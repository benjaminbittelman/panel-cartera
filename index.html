<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartera ACMA — Benjamín Bittelman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* superficie */
  --lienzo:#F1F3F6; --panel:#FFFFFF; --panel2:#F7F8FA; --panel3:#EDF0F4;
  --rail:#0E2841; --rail2:#16385A;
  /* tinta: cuatro niveles, no cinco */
  --t1:#0F1419; --t2:#48525F; --t3:#8A94A2;
  --linea:#E2E6EB; --linea2:#CFD5DD;
  /* acento único para acción */
  --acc:#1E5EA8; --acc2:#3B82D6; --acc-suave:#E8F0FA; --acc-borde:#C2D8F0;
  /* semánticos: solo para estado, nunca para acción */
  --ok:#1B6E4F; --ok-s:#E3F1EA; --ok-b:#B5DCC8;
  --ojo:#B0770B; --ojo-s:#FCF3DF; --ojo-b:#EBD59B;
  --mal:#B33A24; --mal-s:#FBE9E4; --mal-b:#EDC0B3;
  --oro:#E3A008;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --m:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:6px; --r2:10px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --sombra:0 1px 2px rgba(15,20,25,.05),0 1px 3px rgba(15,20,25,.06);
  --sombra2:0 4px 12px rgba(15,20,25,.09),0 1px 3px rgba(15,20,25,.06);
  --sombra3:0 16px 48px rgba(15,20,25,.18);
  --fila:34px;
}
/* escala tipográfica: el tamaño y el peso hacen la jerarquía, no las mayúsculas */
.d1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.d2{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.d3{font-size:16px;font-weight:600;line-height:1.3}
.d4{font-size:14px;font-weight:600;line-height:1.35}
.tx{font-size:13.5px;line-height:1.5}
.tx2{font-size:12.5px;line-height:1.45;color:var(--t2)}
.mi{font-size:11.5px;line-height:1.4;color:var(--t3)}
.num{font-family:var(--m);font-variant-numeric:tabular-nums}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--lienzo);color:var(--t1);font-family:var(--f);font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#C8CFD8;border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#A9B3C0;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ estructura ============ */
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:56px;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;
  padding:10px 0 8px;gap:2px;z-index:30}
.rail .marca{width:34px;height:34px;border-radius:9px;background:var(--oro);color:var(--rail);display:grid;
  place-items:center;font-weight:700;font-size:15px;margin-bottom:12px;flex:none;letter-spacing:-.02em}
.rail button.nv{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#8FA6C0;
  position:relative;transition:background .12s,color .12s;flex:none}
.rail button.nv:hover{background:var(--rail2);color:#fff}
.rail button.nv[aria-current="page"]{background:var(--rail2);color:#fff}
.rail button.nv[aria-current="page"]::before{content:'';position:absolute;left:-10px;top:11px;bottom:11px;width:3px;
  background:var(--oro);border-radius:0 3px 3px 0}
.rail .sep{flex:1}
.rail .tip{position:absolute;left:52px;background:var(--t1);color:#fff;padding:5px 9px;border-radius:5px;
  font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-4px);
  transition:opacity .12s,transform .12s;z-index:60;box-shadow:var(--sombra2)}
.rail button.nv:hover .tip{opacity:1;transform:translateX(0)}
.rail .badge{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--mal);
  color:#fff;font-family:var(--m);font-size:9.5px;display:grid;place-items:center;padding:0 4px;font-weight:600}

.marco{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{height:52px;flex:none;background:var(--panel);border-bottom:1px solid var(--linea);display:flex;
  align-items:center;gap:var(--s3);padding:0 var(--s4);z-index:20}
.bar .sp{flex:1}
.miga{display:flex;align-items:center;gap:7px;min-width:0}
.miga button{color:var(--t2);font-size:13px;white-space:nowrap}
.miga button:hover{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.miga .actual{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miga .fl{color:var(--t3);font-size:11px}

.cuerpo{flex:1;overflow:auto;padding:var(--s4) var(--s4) 60px}
.cuerpo.plano{padding:0}
.ancho{max-width:1460px;margin:0 auto}

/* ============ controles ============ */
.b{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:var(--r);
  border:1px solid var(--linea2);background:var(--panel);color:var(--t1);font-size:12.5px;font-weight:500;
  transition:background .12s,border-color .12s,box-shadow .12s;white-space:nowrap}
.b:hover{background:var(--panel2);border-color:#B8C1CC}
.b:active{transform:translateY(.5px)}
.b.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:var(--sombra)}
.b.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.b.sutil{border-color:transparent;background:transparent;color:var(--t2)}
.b.sutil:hover{background:var(--panel3);color:var(--t1)}
.b.peli:hover{background:var(--mal-s);border-color:var(--mal-b);color:var(--mal)}
.b.xs{height:26px;padding:0 8px;font-size:11.5px;gap:4px}
.b.ico{width:32px;padding:0;justify-content:center}
.b[aria-pressed="true"]{background:var(--acc-suave);border-color:var(--acc-borde);color:var(--acc)}
.b:disabled{opacity:.4;cursor:default}
.grupo{display:inline-flex;background:var(--panel3);border-radius:var(--r);padding:2px;gap:2px}
.grupo button{height:28px;padding:0 11px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--t2)}
.grupo button[aria-current="true"]{background:var(--panel);color:var(--t1);box-shadow:var(--sombra)}
.chip{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--linea2);background:var(--panel);
  font-size:12px;font-weight:500;color:var(--t2);display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:#B8C1CC}
.chip[aria-pressed="true"]{background:var(--rail);border-color:var(--rail);color:#fff}
.chip .n{font-family:var(--m);font-size:10px;opacity:.75}
.busca{position:relative;display:inline-block}
.busca input{height:32px;padding:0 10px 0 30px;border:1px solid var(--linea2);border-radius:var(--r);
  background:var(--panel);font-size:12.5px;width:230px}
.busca input:focus{border-color:var(--acc2);box-shadow:0 0 0 3px var(--acc-suave);outline:none}
.busca svg{position:absolute;left:9px;top:9px;color:var(--t3)}

/* ============ tarjetas ============ */
.c{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r2);box-shadow:var(--sombra)}
.c>header{display:flex;align-items:center;gap:var(--s2);padding:11px var(--s4);border-bottom:1px solid var(--linea)}
.c>header h3{margin:0;font-size:13.5px;font-weight:600}
.c>header .sp{flex:1}
.c>header .co{font-family:var(--m);font-size:11px;color:var(--t3);background:var(--panel3);padding:1px 7px;border-radius:10px}
.rej{display:grid;gap:var(--s3)}

/* ============ cifras ============ */
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:var(--s3)}
.cifras.jer{grid-template-columns:minmax(228px,1.35fr) repeat(auto-fit,minmax(158px,1fr))}
.cf{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r2);padding:13px 15px;box-shadow:var(--sombra)}
.cf .lb{font-size:11.5px;color:var(--t3);font-weight:500}
.cf .vl{font-family:var(--m);font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.cf .pe{font-size:11.5px;color:var(--t2);margin-top:3px}
.cf.hero{padding:16px 18px;background:linear-gradient(160deg,#fff 0%,var(--acc-suave) 220%)}
.cf.hero .vl{font-size:32px}
.cf.hero .lb{font-size:12.5px;color:var(--t2);font-weight:600}
.cf .brecha{margin-top:7px;padding-top:7px;border-top:1px dashed var(--linea2);font-size:11px;color:var(--ojo);
  display:flex;gap:5px;align-items:baseline}
.cf .brecha button{color:var(--ojo);text-decoration:underline;text-underline-offset:2px;font-size:11px}
.cf.ok{border-left:3px solid var(--ok)} .cf.oj{border-left:3px solid var(--ojo)} .cf.ml{border-left:3px solid var(--mal)}

/* ============ etiquetas de estado ============ */
.e{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;
  font-size:11px;font-weight:500;border:1px solid;white-space:nowrap}
.e.g{background:var(--panel3);border-color:var(--linea2);color:var(--t2)}
.e.a{background:var(--acc-suave);border-color:var(--acc-borde);color:var(--acc)}
.e.v{background:var(--ok-s);border-color:var(--ok-b);color:var(--ok)}
.e.m{background:var(--ojo-s);border-color:var(--ojo-b);color:var(--ojo)}
.e.r{background:var(--mal-s);border-color:var(--mal-b);color:var(--mal)}
.e .pt{width:6px;height:6px;border-radius:3px;background:currentColor}

/* ============ tabla ============ */
.tabla{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tabla th{position:sticky;top:0;z-index:2;background:var(--panel2);text-align:left;font-size:11px;font-weight:600;
  color:var(--t3);padding:0 10px;height:36px;border-bottom:1px solid var(--linea);white-space:nowrap;cursor:pointer}
.tabla th:hover{color:var(--t1)}
.tabla th.fijo{cursor:default}
.tabla td{padding:0 10px;height:var(--fila);border-bottom:1px solid var(--linea);vertical-align:middle}
body.comoda .tabla td{height:48px;padding-top:6px;padding-bottom:6px;vertical-align:top}
body.comoda{--fila:48px}
.tabla tbody tr:hover{background:var(--panel2)}
.tabla tbody tr.sel{background:var(--acc-suave)}
.tabla td.n{font-family:var(--m);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tabla td.mo{font-family:var(--m);white-space:nowrap}
.tw{overflow:auto;border-radius:0 0 var(--r2) var(--r2)}
.corta{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.lk{color:var(--t1);font-weight:500;text-align:left}
.lk:hover{color:var(--acc);text-decoration:underline;text-underline-offset:2px}
.ck{width:15px;height:15px;accent-color:var(--acc);cursor:pointer;vertical-align:middle}
.masiva{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px var(--s4);background:var(--rail);color:#fff;font-size:12.5px}
.masiva .b{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24);color:#fff}
.masiva .b:hover{background:#fff;color:var(--rail)}

/* ============ edición ============ */
.ed{display:inline-block;min-width:20px;min-height:20px;border-radius:4px;padding:1px 5px;margin:0 -5px;
  cursor:text;position:relative;transition:background .1s,box-shadow .1s}
.ed:hover,.ed:focus{background:var(--ojo-s);box-shadow:inset 0 0 0 1px var(--ojo-b)}
.ed::after{content:'✎';font-size:10px;color:var(--t3);margin-left:6px;opacity:0;transition:opacity .1s}
.ed:hover::after,.ed:focus::after{opacity:.9}
.ed.vac{color:var(--t3);font-style:italic}
.ed.blq{display:block;width:100%;margin:0}
.ed.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:#B9E4CE;box-shadow:inset 0 0 0 1px var(--ok)}100%{background:transparent;box-shadow:none}}
input.inl,select.inl,textarea.inl{border:1px solid var(--acc2);border-radius:4px;padding:3px 6px;font-size:12.5px;
  width:100%;background:#fff;box-shadow:0 0 0 3px var(--acc-suave);outline:none}
textarea.inl{min-height:72px;resize:vertical;line-height:1.5}
.calc{font-family:var(--m);color:var(--t2);background:var(--panel3);border-radius:4px;padding:1px 6px;font-size:12px}
.calc::after{content:'ƒ';font-size:9px;color:var(--t3);margin-left:5px;vertical-align:super}

/* ============ formulario ============ */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:var(--s3) var(--s4);padding:var(--s4)}
.form label{display:block;font-size:11.5px;font-weight:500;color:var(--t2);margin-bottom:4px}
.form input,.form select,.form textarea{display:block;width:100%;border:1px solid var(--linea2);border-radius:var(--r);
  padding:8px 10px;font-size:13px;background:var(--panel)}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px var(--acc-suave);outline:none}
.form .full{grid-column:1/-1}
.form textarea{min-height:76px;resize:vertical;font-family:var(--f)}
.barform{display:flex;gap:7px;padding:11px var(--s4);background:var(--panel2);border-top:1px solid var(--linea);align-items:center}

/* ============ datos en ficha ============ */
.dl{display:grid;grid-template-columns:150px 1fr;gap:9px var(--s4);padding:var(--s4);font-size:13px;align-items:baseline}
.dl dt{color:var(--t3);font-size:12px}
.dl dd{margin:0;min-width:0}
@media(max-width:640px){.dl{grid-template-columns:1fr;gap:2px var(--s3)}.dl dd{margin-bottom:9px}}

/* ============ recorrido de proceso ============ */
.via{display:flex;gap:0;padding:var(--s4) var(--s4) 0;overflow-x:auto}
.via .h{flex:1;min-width:96px;position:relative;padding-right:6px}
.via .h .ln{height:3px;border-radius:2px;background:var(--linea2);margin-bottom:8px}
.via .h.ok .ln{background:var(--acc2)} .via .h.aqui .ln{background:var(--acc)}
.via .h.malo .ln{background:var(--mal)}
.via .h button{display:block;text-align:left;width:100%}
.via .h .nn{font-family:var(--m);font-size:9.5px;color:var(--t3);letter-spacing:.04em}
.via .h .tt{font-size:12.5px;font-weight:500;color:var(--t3);margin-top:1px;line-height:1.25}
.via .h.ok .tt{color:var(--t2)} .via .h.aqui .tt{color:var(--acc);font-weight:600}
.via .h.malo .tt{color:var(--mal);font-weight:600}
.via .h:hover .tt{color:var(--t1)}
.via .h .fh{font-family:var(--m);font-size:10px;color:var(--t3);margin-top:2px}
.viapie{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px var(--s4);font-size:12px;color:var(--t2)}

/* ============ requisitos bloqueantes ============ */
.req{padding:var(--s3) var(--s4)}
.req .it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--linea)}
.req .it:last-child{border-bottom:0}
.req .mk{width:19px;height:19px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:11px;
  border:1.5px solid var(--linea2);color:var(--t3);margin-top:1px}
.req .it.listo .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.req .cu{flex:1;min-width:0}
.req .cu .q{font-size:12.5px;font-weight:500}
.req .cu .a{font-size:11.5px;color:var(--t3);margin-top:1px}
.req .cu .v{font-size:12.5px;margin-top:3px}
.bloqueo{margin:0 var(--s4) var(--s4);padding:10px 13px;border-radius:var(--r);background:var(--ojo-s);
  border:1px solid var(--ojo-b);color:#7A5200;font-size:12.5px;display:flex;gap:9px;align-items:center}

/* ============ tareas ============ */
.tk{display:flex;gap:10px;padding:9px var(--s4);border-bottom:1px solid var(--linea);align-items:flex-start}
.tk:last-child{border-bottom:0}
.tk:hover{background:var(--panel2)}
.tk .bd{flex:1;min-width:0}
.tk.hecha .tt{text-decoration:line-through;color:var(--t3)}
.tk .mt{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:11.5px;color:var(--t3)}
.tk .ac{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.adder{display:flex;gap:7px;padding:10px var(--s4);background:var(--panel2);border-top:1px solid var(--linea);flex-wrap:wrap}
.adder input,.adder select{height:32px;border:1px solid var(--linea2);border-radius:var(--r);padding:0 9px;font-size:12.5px;background:#fff}
.adder input.gr{flex:1;min-width:170px}

/* ============ malla ============ */
.malla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2);padding:var(--s3)}
.nd{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:10px 11px;text-align:left;
  min-height:78px;display:flex;flex-direction:column;justify-content:space-between;position:relative;
  transition:box-shadow .12s,border-color .12s,transform .12s}
.nd:hover{box-shadow:var(--sombra2);border-color:var(--acc-borde);transform:translateY(-1px)}
.nd .id{font-family:var(--m);font-size:9.5px;color:var(--t3)}
.nd .nm{font-size:12.5px;font-weight:600;line-height:1.25;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nd .pi{font-family:var(--m);font-size:10.5px;color:var(--t2);margin-top:6px}
.nd[data-u="3"]{border-left:3px solid var(--mal)} .nd[data-u="2"]{border-left:3px solid var(--ojo)}
.nd[data-u="1"]{border-left:3px solid var(--acc2)} .nd[data-u="0"]{border-left:3px solid var(--linea2);background:var(--panel2)}
.nd .pa{position:absolute;top:9px;right:9px;width:5px;height:5px;border-radius:3px;background:var(--acc)}

/* ============ embudo ============ */
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s3);align-items:start;padding:var(--s3)}
.kc{background:var(--panel2);border:1px solid var(--linea);border-radius:var(--r2);min-height:100px}
.kc.over{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-suave)}
.kc h4{margin:0;padding:10px 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--linea);
  display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.kc h4 span{font-family:var(--m);font-size:10.5px;color:var(--t3);font-weight:400}
.kt{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);margin:8px;padding:9px 10px;
  cursor:grab;box-shadow:var(--sombra);border-left:3px solid var(--acc2)}
.kt:hover{box-shadow:var(--sombra2)}
.kt.arr{opacity:.4}
.kt.venc{border-left-color:var(--mal)} .kt.pronto{border-left-color:var(--ojo)}
.kt .f{font-family:var(--m);font-size:10.5px;color:var(--t3)}
.kt .c{font-size:12.5px;font-weight:600;margin:2px 0 1px;line-height:1.25}
.kt .o{font-size:11.5px;color:var(--t2);line-height:1.3}
.kt .m{font-family:var(--m);font-size:12.5px;font-weight:600;margin-top:5px}

/* ============ líneas de producto ============ */
.lin{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.lin th{background:var(--panel2);font-size:10.5px;font-weight:600;color:var(--t3);padding:6px 10px;
  text-align:left;border-bottom:1px solid var(--linea);border-top:1px solid var(--linea)}
.lin td{padding:5px 10px;border-bottom:1px solid var(--linea)}
.lin tfoot td{font-family:var(--m);font-weight:600;background:var(--panel2)}


/* ============ línea de vida ============ */
.vida{padding:0}
.carril{display:flex;gap:var(--s4);padding:13px var(--s4);border-bottom:1px solid var(--linea);align-items:flex-start}
.carril:last-child{border-bottom:0}
.carril:hover{background:var(--panel2)}
.carril .idc{width:210px;flex:none;min-width:0}
.carril .idc .cta{font-size:13px;font-weight:600;line-height:1.25;display:block;text-align:left}
.carril .idc .cta:hover{color:var(--acc);text-decoration:underline;text-underline-offset:2px}
.carril .idc .sub{font-family:var(--m);font-size:10.5px;color:var(--t3);margin-top:2px}
.carril .idc .mto{font-family:var(--m);font-size:12.5px;font-weight:600;margin-top:4px}
.carril .pista{flex:1;min-width:0;padding-top:2px}
.riel{display:flex;align-items:center;position:relative}
.riel .nodo{flex:1;position:relative;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.riel .barra{height:4px;width:100%;background:var(--linea);border-radius:2px}
.riel .nodo.ok .barra{background:var(--ok)}
.riel .nodo.aqui .barra{background:var(--acc)}
.riel .nodo.trabado .barra{background:repeating-linear-gradient(90deg,var(--mal) 0 6px,var(--mal-b) 6px 12px)}
.riel .pt{width:11px;height:11px;border-radius:6px;background:var(--panel);border:2px solid var(--linea2);
  position:absolute;top:-3.5px;left:-1px;z-index:2}
.riel .nodo.ok .pt{background:var(--ok);border-color:var(--ok)}
.riel .nodo.aqui .pt{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-suave)}
.riel .nodo.trabado .pt{background:var(--mal);border-color:var(--mal);box-shadow:0 0 0 4px var(--mal-s)}
.riel .et{font-size:10.5px;color:var(--t3);margin-top:8px;line-height:1.2;padding-right:8px;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.riel .nodo.ok .et{color:var(--t2)}
.riel .nodo.aqui .et{color:var(--acc);font-weight:600}
.riel .nodo.trabado .et{color:var(--mal);font-weight:600}
.riel .fh{font-family:var(--m);font-size:9.5px;color:var(--t3);margin-top:1px}
.carril .lat{width:158px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.carril .est{font-family:var(--m);font-size:10.5px;color:var(--t3)}
.vidacab{display:flex;gap:var(--s4);padding:9px var(--s4);background:var(--panel2);border-bottom:1px solid var(--linea);
  font-size:10.5px;color:var(--t3);font-weight:600}
.vidacab .idc{width:210px;flex:none} .vidacab .pista{flex:1} .vidacab .lat{width:158px;flex:none;text-align:right}

/* ============ proyectos: contraste entre uno y otro ============ */
.proy{border:1px solid var(--linea);border-left:4px solid var(--linea2);border-radius:var(--r2);
  background:var(--panel);box-shadow:var(--sombra);overflow:hidden}
.proy.act{border-left-color:var(--ok)} .proy.est{border-left-color:var(--acc2)}
.proy.pau{border-left-color:var(--ojo)} .proy.per{border-left-color:var(--mal)}
.proy.abierto{box-shadow:var(--sombra2);border-color:var(--acc-borde)}
.proy>.ph{display:flex;align-items:center;gap:10px;padding:13px var(--s4);background:var(--panel2);
  border-bottom:1px solid var(--linea);flex-wrap:wrap}
.proy.abierto>.ph{background:linear-gradient(180deg,var(--acc-suave),var(--panel2))}
.proy>.ph .tit{font-size:15px;font-weight:600;letter-spacing:-.01em;min-width:0}
.proy .franja{display:flex;gap:var(--s5);padding:10px var(--s4);flex-wrap:wrap;align-items:baseline;
  border-bottom:1px solid var(--linea);background:var(--panel)}
.proy .franja .dato{display:flex;flex-direction:column;gap:1px}
.proy .franja .dl2{font-size:10.5px;color:var(--t3)}
.proy .franja .dv{font-family:var(--m);font-size:13px;font-weight:600}
.proy .franja .dv.txt{font-family:var(--f);font-weight:500;font-size:12.5px}
.pgcab{background:var(--panel);border:1px solid var(--linea);border-left:5px solid var(--linea2);
  border-radius:var(--r2);box-shadow:var(--sombra);overflow:hidden}
.pgcab.act{border-left-color:var(--ok)} .pgcab.est{border-left-color:var(--acc2)}
.pgcab.pau{border-left-color:var(--ojo)} .pgcab.per{border-left-color:var(--mal)}
.pgcab .top{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4) var(--s5) var(--s3);flex-wrap:wrap}
.pgcab .top h1{margin:0;font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.2;min-width:0}
.pgcab .sub{font-size:12.5px;color:var(--t2);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ============ cotizaciones dentro del proyecto ============ */
.cots{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.cots th{background:var(--panel2);font-size:10.5px;font-weight:600;color:var(--t3);text-align:left;
  padding:7px 10px;border-bottom:1px solid var(--linea);white-space:nowrap}
.cots td{padding:0 10px;height:40px;border-bottom:1px solid var(--linea);vertical-align:middle}
.cots tbody tr{cursor:pointer}
.cots tbody tr:hover{background:var(--acc-suave)}
.cots tbody tr.abierta{background:var(--acc-suave);box-shadow:inset 3px 0 0 var(--acc)}
.cots td.n{font-family:var(--m);text-align:right;white-space:nowrap}
.cots .fol{font-family:var(--m);font-weight:600}
.cots .chv{color:var(--t3);width:18px;display:inline-flex;align-items:center;vertical-align:middle}
.vidacab .idc{display:flex;align-items:center;gap:4px}
.cots tfoot td{background:var(--panel2);font-weight:600}
.detalle{border-top:2px solid var(--acc);background:var(--panel2)}
.detalle>.dh{display:flex;gap:10px;align-items:center;padding:12px var(--s4);flex-wrap:wrap;background:var(--panel)}
.detalle>.dh .fol{font-family:var(--m);font-size:15px;font-weight:600}
.detalle .sec{background:var(--panel);margin:0 var(--s3) var(--s3);border:1px solid var(--linea);border-radius:var(--r)}
.detalle .sec>.st{font-size:11px;font-weight:600;color:var(--t3);padding:9px var(--s4) 0}

/* ============ la cotización como documento ============ */
.doc{background:#fff;border:1px solid var(--linea);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sombra2)}
.doc .franja-top{height:9px;background:linear-gradient(90deg,var(--rail) 0 72%,var(--oro) 72% 100%)}
.doc .encab{display:flex;justify-content:space-between;align-items:flex-start;padding:18px var(--s5) 12px;gap:var(--s4);flex-wrap:wrap}
.doc .marca-doc{font-size:24px;font-weight:700;color:var(--rail);letter-spacing:-.02em}
.doc .marca-doc small{display:block;font-size:10.5px;font-weight:400;color:var(--t3);letter-spacing:.02em;margin-top:2px}
.doc .num-doc{text-align:right}
.doc .num-doc .t{font-size:19px;font-weight:600;color:var(--acc);letter-spacing:.02em}
.doc .num-doc .f{font-family:var(--m);font-size:17px;font-weight:600;background:var(--ojo-s);padding:2px 10px;border-radius:4px;display:inline-block;margin-top:3px}
.doc .num-doc .r{font-size:11px;color:var(--t3);margin-top:3px}
.doc .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s5);padding:0 var(--s5) var(--s4)}
@media(max-width:820px){.doc .cols{grid-template-columns:1fr}}
.doc .bloq{min-width:0}
.doc .bloq>h4{margin:0 0 6px;font-size:10.5px;font-weight:700;color:var(--acc);letter-spacing:.06em;
  text-transform:uppercase;border-bottom:2px solid var(--acc);padding-bottom:4px}
.doc .par{display:grid;grid-template-columns:122px 1fr;gap:3px var(--s3);padding:5px 0;font-size:12.5px;
  border-bottom:1px solid var(--linea);align-items:baseline;margin:0}
.doc .par:nth-of-type(odd){background:#FCFAF6}
.doc .par dt{font-size:11px;color:var(--t3);font-weight:500}
.doc .par dd{margin:0;min-width:0;word-break:break-word}
.doc .glosa{padding:4px var(--s5) var(--s4);font-size:13px;line-height:1.55}
.doc .tblwrap{padding:0 var(--s5)}
.doc table.det{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.doc table.det thead th{background:var(--rail);color:#fff;font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:7px 9px;text-align:left}
.doc table.det thead th.n{text-align:right}
.doc table.det tbody td{padding:6px 9px;border-bottom:1px solid var(--linea);vertical-align:top}
.doc table.det tbody tr:nth-child(odd) td{background:#FDF8F0}
.doc table.det td.n{text-align:right;font-family:var(--m);white-space:nowrap}
.doc table.det td.cod{font-family:var(--m);font-size:11px;font-weight:600;color:var(--acc)}
.doc .nota{padding:var(--s3) var(--s5) 0;font-size:10.5px;line-height:1.5;color:var(--t2)}
.doc .totes{display:flex;justify-content:flex-end;padding:var(--s4) var(--s5)}
.doc .totes table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:290px}
.doc .totes td{padding:6px 12px;border-bottom:1px solid var(--linea)}
.doc .totes td.l{color:var(--t2);font-size:11.5px;font-weight:500}
.doc .totes td.v{text-align:right;font-family:var(--m);font-weight:600;white-space:nowrap}
.doc .totes tr.gran td{background:var(--rail);color:#fff;font-size:14px;border:0}
.doc .totes tr.gran td.l{color:#fff;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.doc .grales{padding:0 var(--s5) var(--s5)}
.doc .grales h4{margin:0 0 6px;font-size:10.5px;font-weight:700;color:var(--acc);letter-spacing:.06em;
  text-transform:uppercase;border-bottom:2px solid var(--acc);padding-bottom:4px}
.doc .firma{display:flex;justify-content:space-between;align-items:flex-end;padding:var(--s4) var(--s5) var(--s5);
  border-top:1px solid var(--linea);gap:var(--s4);flex-wrap:wrap}
.doc .firma .fn{font-size:14px;font-weight:600}
.doc .firma .fc{font-size:11.5px;color:var(--t2)}
.doc .barra-doc{display:flex;gap:7px;align-items:center;padding:10px var(--s5);background:var(--panel2);
  border-bottom:1px solid var(--linea);flex-wrap:wrap}
@media print{
  /* el contenedor tiene alto fijo y desbordamiento oculto: al imprimir hay que soltarlo
     o el papel se corta a la altura de una pantalla */
  html,body{height:auto!important;overflow:visible!important;background:#fff}
  .app{display:block!important;height:auto!important;overflow:visible!important}
  .marco{display:block!important;height:auto!important;overflow:visible!important}
  .cuerpo{overflow:visible!important;height:auto!important;padding:0!important}
  .rail,.bar,.barra-doc,.adder,.b,.grupo,.masiva,.aviso{display:none!important}
  .doc{border:0;box-shadow:none;border-radius:0}
  .ed{background:none!important;box-shadow:none!important}
  .ed::after{display:none}
  table,tr,td,th,.doc{break-inside:auto}
  thead{display:table-header-group}
}


/* ============ calendario ============ */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--linea);border-top:1px solid var(--linea)}
.cal .dow{background:var(--panel2);padding:7px 9px;font-size:10.5px;font-weight:600;color:var(--t3);
  text-transform:uppercase;letter-spacing:.04em;text-align:left}
.dia{background:var(--panel);min-height:104px;padding:6px 7px 8px;display:flex;flex-direction:column;gap:3px;
  position:relative;transition:background .1s}
.dia:hover{background:var(--panel2)}
.dia.fuera{background:var(--panel2)}
.dia.fuera .nd2{color:var(--linea2)}
.dia.hoy{background:var(--acc-suave);box-shadow:inset 0 0 0 2px var(--acc)}
.dia.finde{background:#FAFBFC}
.dia.over{background:var(--ojo-s);box-shadow:inset 0 0 0 2px var(--ojo)}
.dia .cab{display:flex;align-items:baseline;gap:5px;margin-bottom:2px}
.dia .nd2{font-family:var(--m);font-size:12px;font-weight:600;color:var(--t2)}
.dia.hoy .nd2{color:var(--acc)}
.dia .mas{font-family:var(--m);font-size:9.5px;color:var(--t3);margin-left:auto}
.dia .add{position:absolute;top:5px;right:5px;width:19px;height:19px;border-radius:5px;display:grid;
  place-items:center;color:var(--t3);opacity:0;font-size:15px;line-height:1;background:var(--panel3)}
.dia:hover .add{opacity:1}
.dia .add:hover{background:var(--acc);color:#fff}
.ev2{display:flex;gap:5px;align-items:flex-start;padding:3px 5px;border-radius:4px;font-size:11px;
  line-height:1.3;cursor:pointer;border-left:2.5px solid var(--linea2);background:var(--panel2);text-align:left;width:100%}
.ev2:hover{filter:brightness(.97);box-shadow:var(--sombra)}
.ev2 .tt2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev2.mio{border-left-color:var(--acc);background:var(--acc-suave)}
.ev2.esp{border-left-color:var(--ojo);background:var(--ojo-s)}
.ev2.vig{border-left-color:var(--mal);background:var(--mal-s);color:var(--mal)}
.ev2.cie{border-left-color:var(--ok);background:var(--ok-s);color:var(--ok)}
.ev2.fab{border-left-color:var(--acc2);background:var(--acc-suave);color:var(--acc)}
.ev2.hecha{opacity:.5}.ev2.hecha .tt2{text-decoration:line-through}
.ev2.vencida{box-shadow:inset 0 0 0 1px var(--mal-b)}
.calbar{display:flex;gap:8px;align-items:center;padding:10px var(--s4);flex-wrap:wrap}
.calbar .mes{font-size:16px;font-weight:600;min-width:172px;text-transform:capitalize}
.callg{display:flex;gap:14px;flex-wrap:wrap;padding:9px var(--s4);border-top:1px solid var(--linea);
  font-size:11.5px;color:var(--t2)}
.callg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--linea);border-top:1px solid var(--linea)}
.sem .dia{min-height:230px}


/* ============ producción ============ */
.prod{display:flex;gap:var(--s4);padding:13px var(--s4);border-bottom:1px solid var(--linea);align-items:flex-start}
.prod:last-child{border-bottom:0}
.prod:hover{background:var(--panel2)}
.prod .pid2{width:230px;flex:none;min-width:0}
.prod .pid2 .ob{font-size:13px;font-weight:600;line-height:1.25;text-align:left;display:block}
.prod .pid2 .ob:hover{color:var(--acc);text-decoration:underline;text-underline-offset:2px}
.prod .pid2 .sb{font-family:var(--m);font-size:10.5px;color:var(--t3);margin-top:2px}
.prod .mid{flex:1;min-width:0}
.prod .lat2{width:190px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.barra2{height:9px;border-radius:5px;background:var(--linea);overflow:hidden;position:relative}
.barra2 i{display:block;height:100%;background:var(--acc2);border-radius:5px;transition:width .2s}
.barra2.full i{background:var(--ok)}
.barra2.cero i{background:var(--mal)}
.prod .kgs{display:flex;gap:var(--s3);flex-wrap:wrap;font-family:var(--m);font-size:11px;color:var(--t2);margin-top:5px}
.prod .kgs b{font-weight:600;color:var(--t1)}
.mini-eta{display:flex;gap:3px;margin-top:7px;flex-wrap:wrap}
.mini-eta span{font-size:9.5px;padding:1px 6px;border-radius:9px;background:var(--panel3);color:var(--t3);white-space:nowrap}
.mini-eta span.ok2{background:var(--ok-s);color:var(--ok)}
.mini-eta span.now{background:var(--acc);color:#fff;font-weight:600}
.mini-eta span.bad{background:var(--mal);color:#fff;font-weight:600}
.despt{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.despt th{background:var(--panel2);font-size:10.5px;font-weight:600;color:var(--t3);text-align:left;padding:6px 9px;border-bottom:1px solid var(--linea)}
.despt td{padding:6px 9px;border-bottom:1px solid var(--linea)}
.despt td.n{text-align:right;font-family:var(--m)}

/* ============ vacíos ============ */
.vac{padding:var(--s6) var(--s4);text-align:center}
.vac .ic{width:42px;height:42px;border-radius:12px;background:var(--panel3);display:grid;place-items:center;
  margin:0 auto var(--s3);color:var(--t3)}
.vac .vt{font-size:14.5px;font-weight:600}
.vac .vd{font-size:12.5px;color:var(--t3);margin:5px auto var(--s4);max-width:400px;line-height:1.55}
.vac .vb{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}

/* ============ capas ============ */
.velo{position:fixed;inset:0;background:rgba(15,20,25,.35);backdrop-filter:blur(2px);z-index:70}
.dlg{position:fixed;z-index:71;top:50%;left:50%;transform:translate(-50%,-50%);width:min(480px,94vw);
  background:var(--panel);border-radius:var(--r2);box-shadow:var(--sombra3);padding:var(--s5);max-height:88vh;overflow:auto}
.dlg h3{margin:0 0 var(--s4);font-size:17px;font-weight:600;letter-spacing:-.01em}
.dlg label{display:block;font-size:11.5px;font-weight:500;color:var(--t2);margin-bottom:var(--s3)}
.dlg input,.dlg select,.dlg textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--linea2);
  border-radius:var(--r);padding:9px 11px;font-size:13.5px;font-family:var(--f)}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px var(--acc-suave);outline:none}
.dlg .ac{display:flex;justify-content:flex-end;gap:8px;margin-top:var(--s4)}
.dlg .ac .b{height:36px;padding:0 16px;font-size:13px}

.men{position:absolute;z-index:78;background:var(--panel);border:1px solid var(--linea);border-radius:var(--r2);
  box-shadow:var(--sombra3);min-width:246px;overflow:hidden;padding:5px}
.men button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;
  font-size:13px;border-radius:5px}
.men button:hover{background:var(--acc-suave);color:var(--acc)}
.men button .kk{font-family:var(--m);font-size:10px;color:var(--t3);margin-left:auto}
.men .sp{height:1px;background:var(--linea);margin:5px 0}
.men .ti{padding:7px 10px 4px;font-size:10.5px;font-weight:600;color:var(--t3);letter-spacing:.04em;text-transform:uppercase}
.men label.op{display:flex;gap:9px;align-items:center;padding:7px 10px;font-size:13px;border-radius:5px;cursor:pointer}
.men label.op:hover{background:var(--panel2)}

.pal{position:fixed;z-index:75;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,94vw);
  background:var(--panel);border-radius:var(--r2);box-shadow:var(--sombra3);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--linea);padding:16px 18px;font-size:16px;outline:none}
.pal .rs{max-height:52vh;overflow:auto;padding:5px}
.pal .it{display:flex;gap:11px;align-items:center;padding:9px 13px;cursor:pointer;border-radius:6px}
.pal .it[aria-selected="true"]{background:var(--acc-suave)}
.pal .it .k{font-family:var(--m);font-size:9.5px;color:var(--t3);text-transform:uppercase;min-width:56px}
.pal .it .n{font-size:13.5px;font-weight:500}
.pal .it .s{font-size:11.5px;color:var(--t3)}
.pal .pi{padding:9px 18px;font-family:var(--m);font-size:10.5px;color:var(--t3);background:var(--panel2);border-top:1px solid var(--linea)}

.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--t1);color:#fff;
  padding:11px 18px;border-radius:var(--r);font-size:13px;z-index:80;box-shadow:var(--sombra3);
  display:flex;gap:14px;align-items:center;max-width:min(560px,92vw)}
.aviso button{background:rgba(255,255,255,.16);border-radius:5px;padding:4px 11px;font-size:12px;color:#fff}
.aviso button:hover{background:rgba(255,255,255,.28)}

.linea-t{display:flex;flex-direction:column;gap:0;padding:var(--s3) var(--s4)}
.linea-t .ev{display:flex;gap:12px;padding-bottom:14px;position:relative}
.linea-t .ev::before{content:'';position:absolute;left:5px;top:14px;bottom:0;width:1px;background:var(--linea)}
.linea-t .ev:last-child::before{display:none}
.linea-t .pt{width:11px;height:11px;border-radius:6px;background:var(--panel);border:2px solid var(--acc2);flex:none;margin-top:3px;z-index:1}
.linea-t .cu{flex:1;min-width:0}
.linea-t .fh{font-family:var(--m);font-size:10.5px;color:var(--t3);display:flex;gap:9px;align-items:center}
.linea-t .tx{font-size:12.5px;white-space:pre-wrap;margin-top:2px}

.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s3)}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ utilidades ============ */
const $ = (s,r=document)=>r.querySelector(s);
/* append seguro: el append nativo del DOM convierte null en el texto "null" */
const ap=(n,...k)=>{k.flat().forEach(c=>{ if(c!==null&&c!==undefined&&c!==false)n.append(c.nodeType?c:document.createTextNode(c)); });return n;};
const el=(t,a={},...k)=>{const n=document.createElement(t);for(const[p,v]of Object.entries(a)){
  if(p==='class')n.className=v;else if(p==='html')n.innerHTML=v;else if(p.startsWith('on'))n.addEventListener(p.slice(2),v);
  else if(v!==null&&v!==undefined&&v!==false)n.setAttribute(p,v);}
  k.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c)));return n;};
const HOY=new Date(); HOY.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return isNaN(x)?'':new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const pd=s=>{if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d;};
const dias=s=>{const d=pd(s);return d===null?null:Math.round((d-HOY)/864e5);};
const money=n=>{n=Math.round(n||0);if(Math.abs(n)>=1e6)return '$'+Math.round(n/1e6).toLocaleString('es-CL')+' M';return '$'+n.toLocaleString('es-CL');};
const num=n=>(n===null||n===undefined||n==='')?'':Math.round(n).toLocaleString('es-CL');
const fdate=s=>{const d=pd(s);if(!d)return '—';return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}).replace('.','');};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const hora=()=>new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});

/* ============ vocabulario ============ */
const ETAPAS=['Por enviar','Por corregir','Enviada','En revisión','En negociación','Adjudicada','Perdida','En pausa','Reemplazada'];
const P_MODELO={'Por enviar':.10,'Por corregir':.15,'Enviada':.25,'En revisión':.35,'En negociación':.50,'Adjudicada':1,'Perdida':0,'En pausa':.10,'Reemplazada':0};
const CANALES=['CLIENTE ACTIVO','EN NEGOCIACIÓN','PUERTA ABIERTA SIN USAR','CONTACTADO SIN RESPUESTA','NUNCA CONTACTADO','SIN DATOS DE CONTACTO'];
const PRIOS=['A - Alta','B - Media','C - Baja'];
const SEGS=['HAB','SOC','INFR','MIX','MIN','OTRO'];
const TIPOS=['Constructora','Inmobiliaria','Inmobiliaria-Constructora','Contratista especialista','Distribuidor / abastecimiento','Revendedor / comercializador','Otro'];
const ROLES=['Decide','Influye','Ejecuta'];
const MOTIVOS=['Precio','Plazo de entrega','Especificación técnica','Competidor directo','Obra suspendida o postergada','Nunca respondieron','Otro'];
const EJEC=['OC recibida','En coordinación','Pedido ingresado','Programada en fábrica','En despacho','Entregada','Facturada','Cerrada'];
const HITO={'OC recibida':'oc','En coordinación':'coord','Pedido ingresado':'ingreso','Programada en fábrica':'programa',
  'En despacho':'despacho','Entregada':'entrega','Facturada':'factura','Cerrada':'cierre'};
const EJEC_AYUDA={
  'OC recibida':'Llegó la orden de compra del cliente',
  'En coordinación':'Enviada a Diego Tapia o a Servicio al Cliente para su ingreso',
  'Pedido ingresado':'Coordinación la cargó y tiene número de pedido',
  'Programada en fábrica':'Fábrica confirmó fecha; queda registrada en Monday',
  'En despacho':'Salió el primer camión; puede haber parciales pendientes',
  'Entregada':'Se despachó el total comprometido',
  'Facturada':'Emitida la factura',
  'Cerrada':'Sin nada pendiente, ni comercial ni de postventa'};
const TOPE_ETAPA={'OC recibida':2,'En coordinación':2,'Pedido ingresado':3,'Programada en fábrica':15,
  'En despacho':10,'Entregada':10,'Facturada':30,'Cerrada':0};
/* Los cinco datos que coordinación exige antes de aceptar el ingreso de una OC.
   El panel bloquea el avance mientras falte alguno: es el mismo criterio del skill. */
const REQ_INGRESO=[
  {k:'calendario',t:'Calendario de entrega por etapa',a:'Fechas comprometidas de cada entrega, no solo el plazo total',tipo:'texto'},
  {k:'precioKilo',t:'Precio por kilo',a:'El valor por kilo acordado, no solo el total de la OC',tipo:'numero'},
  {k:'direccion',t:'Dirección de obra',a:'Dirección exacta donde descarga el camión',tipo:'texto'},
  {k:'contactoObra',t:'Contacto en obra',a:'Nombre y teléfono de quien recibe',tipo:'texto'},
  {k:'segmento',t:'Segmento',a:'Clasificación comercial del pedido',tipo:'lista',opciones:['HAB','SOC','INFR','MIX','MIN','OTRO']},
  {k:'camiones',t:'Camiones y flete',a:'Cantidad, tipo y valor de cada flete',tipo:'texto'}
];
const IVA=0.19;
const COND_DEF={
  plazoEntrega:'20 días hábiles desde recibida la OC',
  condPago:'A través de línea de crédito',
  moneda:'Peso chileno (CLP), valores netos',
  cuadroCub:'',
  reajuste:'Forma trimestral, de acuerdo a lista de precios de fábrica',
  lugarEntrega:'Puesto en obra. Descarga por cuenta del cliente.',
  validezTexto:'',
  anticipo:'No aplica',
  facturacion:'A 30 días según guía de despacho (GD)',
  despachoMin:'A convenir, en camiones completos de 20 ton según avance y secuencia constructiva',
  notaTecnica:'',
  glosa:''
};
const CAMPOS_COND=[
  ['plazoEntrega','Plazo de entrega'],['condPago','Condición de pago'],['moneda','Moneda'],
  ['cuadroCub','Cuadro de cubicación N°']
];
const CAMPOS_GRAL=[
  ['reajuste','Reajuste'],['lugarEntrega','Lugar de entrega'],['validezTexto','Validez de la oferta'],
  ['anticipo','Anticipo'],['facturacion','Facturación'],['despachoMin','Despacho mínimo']
];
const EST_PROY=['En estudio','Activo','Suspendido','Cerrado','Perdido'];
const FAMILIAS=['Malla electrosoldada','Barra / fierro','Alambre','Perfilería steel framing','Cerco Acmanet','Flete','Otro'];
const VIVA=c=>!['Adjudicada','Perdida','Reemplazada'].includes(c.estado);

const VIEWS={};

let S=null, saveT=null, UNDO=[], UI={
  ruta:{v:'hoy'}, vista:'tabla', densidad:'compacta',
  q:'', sortC:{key:'venc',dir:1}, sortA:{key:'urg',dir:1},
  fA:{prio:'',canal:'',seg:'',txt:'',arch:false}, fQ:{estado:'',txt:''},
  cols:null, sel:new Set(), dtab:'resumen', openProy:null, openCot:null,
  editFicha:false, abrirReq:null, verCheck:null, docTab:'doc', verFicha:false, verResumen:false, verBandaCot:false, horizonte:'mes', calMes:null, calSem:null, verCerradas:false};
const COLS=[['prio','Prioridad'],['seg','Segmento'],['canal','Estado del canal'],['sc','Sin contacto'],
  ['nq','Cotizaciones'],['vivo','Monto vivo'],['tar','Tareas'],['prox','Próximo paso'],['acc','Acciones']];

/* ============ carpeta ============ */
const F_JSON='cartera.json', F_XLSX='respaldo_cartera.xlsx';
let DIR=null, PEND=null;
const soporta=()=>typeof window.showDirectoryPicker==='function';
function flag(t){const n=$('#savedFlag');if(n)n.textContent=t;}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('acma-fs',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function putH(h){try{const db=await idb();await new Promise(r=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(h,'dir');t.oncomplete=r;t.onerror=r;});}catch(e){}}
async function getH(){try{const db=await idb();return await new Promise(r=>{const t=db.transaction('h','readonly');const q=t.objectStore('h').get('dir');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});}catch(e){return null;}}
async function delH(){try{const db=await idb();await new Promise(r=>{const t=db.transaction('h','readwrite');t.objectStore('h').delete('dir');t.oncomplete=r;t.onerror=r;});}catch(e){}}
async function permiso(h,pedir){if(!h)return false;const o={mode:'readwrite'};
  try{if(await h.queryPermission(o)==='granted')return true;if(pedir&&await h.requestPermission(o)==='granted')return true;}catch(e){}return false;}
async function elegirCarpeta(){try{const h=await window.showDirectoryPicker({id:'acma-cartera',mode:'readwrite'});
  if(!await permiso(h,true))return false;DIR=h;PEND=null;await putH(h);return true;}catch(e){return false;}}
async function leerTexto(n){try{const fh=await DIR.getFileHandle(n);return await (await fh.getFile()).text();}catch(e){return null;}}
async function escribir(n,data){const fh=await DIR.getFileHandle(n,{create:true});const w=await fh.createWritable();await w.write(data);await w.close();}
async function guardarEnCarpeta(){
  if(!DIR){flag('sin carpeta');return;}
  try{ await escribir(F_JSON,new Blob([JSON.stringify(S)],{type:'application/json'}));
    try{const b=xlsxBlob();if(b)await escribir(F_XLSX,b);}catch(e){}
    flag('guardado '+hora());
  }catch(e){flag('sin guardar');}
}
function save(){clearTimeout(saveT);saveT=setTimeout(guardarEnCarpeta,700);}

/* ============ deshacer ============ */
function snap(desc){ UNDO.push({d:desc,s:JSON.stringify(S)}); if(UNDO.length>40)UNDO.shift(); }
function undo(){ const u=UNDO.pop(); if(!u){toast('No hay nada que deshacer');return;} S=JSON.parse(u.s); save(); render(); toast('Deshecho: '+u.d); }
function mut(desc,fn){ snap(desc); fn(); save(); render(); }

/* ============ modelo ============ */
const cuenta=n=>S.cuentas.find(c=>c.nombre===n);
const cotsDe=n=>S.cotizaciones.filter(q=>q.cuenta===n);
const contactosDe=n=>S.contactos.filter(c=>c.cuenta===n);
const tareasDe=n=>S.tareas.filter(t=>t.cuenta===n);
const proyectosDe=n=>S.proyectos.filter(p=>p.cuenta===n);
const proyecto=pid=>S.proyectos.find(p=>p.pid===pid);
const cotsDeProy=pid=>S.cotizaciones.filter(q=>q.proyecto===pid);
const folioRev=q=>q.folio+(q.rev?' r'+q.rev:'');
const enEjecucion=q=>q.estado==='Adjudicada';
function faltaIngreso(q){ return REQ_INGRESO.filter(r=>{const v=q.ingreso?.[r.k];
  return v===''||v===null||v===undefined;}); }
function avanceEjec(q){ const i=EJEC.indexOf(q.ejecucion); return i<0?-1:i; }
/* Cuánto lleva parado en la etapa actual. Es la señal más predictiva de un
   pedido que se va a caer, y hasta ahora el panel no la medía. */
function diasEnEtapa(q){
  const i=avanceEjec(q); if(i<0)return null;
  const f=q.hitos?.[HITO[EJEC[i]]]; const d=pd(f);
  if(!d)return null; return Math.round((HOY-d)/864e5);
}
function trabado(q){
  const i=avanceEjec(q); if(i<0)return false;
  if(q.ejecucion==='Cerrada')return false;
  if(i<EJEC.indexOf('Ingresada a coordinación')&&faltaIngreso(q).length)return true;
  const d=diasEnEtapa(q); const tope=TOPE_ETAPA[q.ejecucion];
  return d!==null&&tope&&d>tope;
}
async function setEjecucion(q,e){
  if(e===q.ejecucion)return;
  const iNuevo=EJEC.indexOf(e);
  if(iNuevo>=EJEC.indexOf('Pedido ingresado')){
    const f=faltaIngreso(q);
    if(f.length){ await ask('Coordinación no acepta este ingreso',
      [{k:'x',label:'Faltan '+f.length+' de los datos obligatorios',type:'textarea',
        value:f.map(r=>'• '+r.t+' — '+r.a).join('\n')}],'Entendido');
      UI.abrirReq=q.qid; render(); return; }
  }
  mut('avanzar ejecución',()=>{
    const prev=q.ejecucion||'sin iniciar'; q.ejecucion=e;
    const h=HITO[e]; if(h&&!q.hitos[h])q.hitos[h]=iso(HOY);
    logB(q.cuenta,'ejecucion','['+q.folio+'] '+prev+' → '+e);
    if(e==='En coordinación')nuevaTarea(q.cuenta,'Confirmar a Diego el ingreso del pedido de '+q.folio,iso(new Date(HOY.getTime()+2*864e5)),'esperando',q.folio);
    if(e==='Pedido ingresado')nuevaTarea(q.cuenta,'Pedir a fábrica la fecha de fabricación de '+q.folio+' y anotarla desde Monday',iso(new Date(HOY.getTime()+2*864e5)),'esperando',q.folio);
    if(e==='Programada en fábrica')nuevaTarea(q.cuenta,'Avisar al cliente la fecha de fabricación de '+q.folio,iso(HOY),'mio',q.folio);
    if(e==='Facturada')nuevaTarea(q.cuenta,'Revisar si queda algo de postventa antes de cerrar '+q.folio,iso(new Date(HOY.getTime()+7*864e5)),'mio',q.folio);
    if(e==='Entregada')nuevaTarea(q.cuenta,'Verificar recepción conforme de '+q.folio+' (ITO)',iso(HOY),'mio',q.folio);
    if(e==='Facturada')q.ejecucion='Facturada';
  });
}
async function registrarIncidencia(q){
  const r=await ask('Registrar incidencia en '+folioRev(q),[
    {k:'tipo',label:'Tipo',type:'select',options:['Rechazo ITO por oxidación superficial','Rechazo ITO otro motivo','Atraso de entrega','Merma o diferencia de kilos','Problema de acceso a obra','Otro'],value:'Rechazo ITO por oxidación superficial'},
    {k:'fecha',label:'Cuándo',type:'date',value:iso(HOY)},
    {k:'detalle',label:'Qué pasó y cómo se resolvió',type:'textarea'}],'Registrar');
  if(!r)return;
  mut('incidencia',()=>{ q.incidencias=q.incidencias||[];
    q.incidencias.unshift({id:uid(),fecha:r.fecha,tipo:r.tipo,detalle:r.detalle});
    logB(q.cuenta,'incidencia','['+q.folio+'] '+r.tipo+(r.detalle?': '+r.detalle:''));
    if(r.tipo.indexOf('Rechazo ITO')===0)nuevaTarea(q.cuenta,'Responder rechazo ITO de '+q.folio+' (usar NT-ACMA-001)',iso(HOY),'mio',q.folio); });
  toast('Incidencia registrada');
}
const bitaDe=n=>S.bitacora.filter(b=>b.cuenta===n).sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
const abiertas=n=>tareasDe(n).filter(t=>!t.hecha);
function proxTarea(n){ return abiertas(n).slice().sort((a,b)=>(a.fecha||'9999').localeCompare(b.fecha||'9999'))[0]||null; }
function probEf(q){return q.probManual&&q.prob!==null&&q.prob!==undefined?q.prob:(P_MODELO[q.estado]??0);}
function decay(q){const d=dias(q.validez);if(d===null)return .6;if(d>=0)return 1;return Math.max(.25,1+d/30);}
const ponderado=q=>(q.neto||0)*probEf(q);
const ponderadoAj=q=>(q.neto||0)*probEf(q)*decay(q);
function netoLineas(q){ return (q.lineas||[]).reduce((a,l)=>a+(Number(l.kg)||0)*(Number(l.precioKg)||0)+(Number(l.monto)||0),0); }
function recalcNeto(q){ if(q.lineas&&q.lineas.length){ q.neto=Math.round(netoLineas(q)); q.kg=Math.round((q.lineas.reduce((a,l)=>a+(Number(l.kg)||0),0)))||null; } }
function sinContacto(c){const a=pd(c.ultMio),b=pd(c.ultSuyo);const m=[a,b].filter(Boolean).sort((x,y)=>y-x)[0];return m?Math.round((HOY-m)/864e5):null;}
function urgencia(c){
  const t=proxTarea(c.nombre), da=t?dias(t.fecha):null;
  const qs=cotsDe(c.nombre).filter(VIVA);
  const venc=qs.some(q=>{const d=dias(q.validez);return d!==null&&d<0;});
  const pronto=qs.some(q=>{const d=dias(q.validez);return d!==null&&d>=0&&d<=7;});
  if((da!==null&&da<0)||venc)return 3;
  if((da!==null&&da===0)||pronto)return 2;
  if(qs.length||['CLIENTE ACTIVO','EN NEGOCIACIÓN'].includes(c.canal))return 1;
  return 0;
}
function totales(){
  const vivas=S.cotizaciones.filter(VIVA);
  const neto=vivas.reduce((a,q)=>a+(q.neto||0),0);
  const pond=vivas.reduce((a,q)=>a+ponderado(q),0);
  const aj=vivas.reduce((a,q)=>a+ponderadoAj(q),0);
  const gan=S.cotizaciones.filter(q=>q.estado==='Adjudicada').reduce((a,q)=>a+(q.neto||0),0);
  const perd=S.cotizaciones.filter(q=>q.estado==='Perdida').reduce((a,q)=>a+(q.neto||0),0);
  const nG=S.cotizaciones.filter(q=>q.estado==='Adjudicada').length,nP=S.cotizaciones.filter(q=>q.estado==='Perdida').length;
  return {vivas,neto,pond,aj,gan,perd,nG,nP,tasa:(nG+nP)?nG/(nG+nP):null};
}
const activas=()=>S.cuentas.filter(c=>!c.archivada);

/* migración v1 → v2 */
function migrar(st){
  st.version=4;
  st.tareas=st.tareas||[];
  st.proyectos=st.proyectos||[];
  st.correos=st.correos||[]; st.vistos=st.vistos||[]; st.folios=st.folios||[];
  if(st.autoAplicar===undefined)st.autoAplicar=true;
  if(st.ultimoBarrido===undefined)st.ultimoBarrido='';
  if(st.autoDescartarInternos===undefined)st.autoDescartarInternos=false;
  st.proyectos.forEach(p=>{ if(p.lat===undefined)p.lat=''; if(p.lng===undefined)p.lng=''; });
  st.cuentas=st.cuentas||[];
  st.cuentas.forEach(c=>{
    if(!c.cid)c.cid=uid();
    if(c.archivada===undefined)c.archivada=false;
    if(c.accion){ st.tareas.push({id:uid(),cuenta:c.nombre,texto:c.accion,tipo:'mio',fecha:c.fechaAccion||iso(HOY),hecha:false,creada:iso(HOY)});
      delete c.accion; delete c.fechaAccion; }
  });
  (st.cotizaciones||[]).forEach(q=>{ if(!q.qid)q.qid=uid(); if(!q.lineas)q.lineas=[];
    if(q.probManual===undefined)q.probManual=(q.prob!==null&&q.prob!==undefined);
    if(q.cierre===undefined)q.cierre=''; if(q.motivoPerdida===undefined)q.motivoPerdida=''; if(q.kg===undefined)q.kg=null; });
  (st.contactos||[]).forEach(p=>{ if(!p.pid)p.pid=uid(); });
  /* cada cotización cuelga de un proyecto; si no lo tiene, se deriva del campo Obra */
  (st.cotizaciones||[]).forEach(q=>{
    if(q.rev===undefined)q.rev=0;
    if(!q.versiones)q.versiones=[];
    if(q.ejecucion===undefined)q.ejecucion='';
    if(!q.cond)q.cond=JSON.parse(JSON.stringify(COND_DEF));
    else Object.keys(COND_DEF).forEach(k=>{ if(q.cond[k]===undefined)q.cond[k]=COND_DEF[k]; });
    if(q.rut===undefined)q.rut='';
    if(q.emailContacto===undefined)q.emailContacto=q.email||'';
    if(!q.hitos)q.hitos={oc:'',ingreso:'',programa:'',despacho:'',entrega:'',factura:''};
    if(!q.ingreso)q.ingreso={calendario:'',precioKilo:null,direccion:'',contactoObra:'',segmento:'',camiones:''};
    if(!q.incidencias)q.incidencias=[];
    if(!q.revalidaciones)q.revalidaciones=[];
    if(!q.despachos)q.despachos=[];
    if(q.pedido===undefined)q.pedido='';
    if(!q.monday)q.monday={url:'',fabrica:'',semana:'',nota:''};
    if(!q.hitos.coord)q.hitos.coord='';
    if(!q.hitos.cierre)q.hitos.cierre='';
    const mapEjec={'Ingresada a coordinación':'Pedido ingresado','Programada':'Programada en fábrica'};

  return new Promise(res=>{

      inputs[f.k]=i; mo.append(el('label',{},f.label,i)); });
    const ok=()=>{const o={};campos.forEach(f=>o[f.k]=inputs[f.k].value);cerrar(o);};
    mo.append(el('div',{class:'ac'},el('button',{class:'b',onclick:()=>cerrar(null)},'Cancelar'),
      el('button',{class:'b pri',onclick:ok},textoOk||'Guardar')));

let FLASH=null;
function edit(obj,campo,o={}){
  const v=obj[campo];
  const bruto=o.fmt?o.fmt(v):(v===''||v===null||v===undefined?'':String(v));
  const vacio=bruto==='';
  const rotulo=o.ph||('añadir '+(o.nombre||campo).toLowerCase());
  const sp=el('span',{class:'ed'+(vacio?' vac':'')+(o.blq||o.blk?' blq':''),tabindex:'0',role:'button',
    'aria-label':(o.nombre||campo)+': '+(vacio?'sin definir':bruto)+'. Editar.',
    title:o.title||'Clic para editar'}, vacio?rotulo:bruto);
  if(FLASH&&FLASH.o===obj&&FLASH.c===campo){ sp.classList.add('flash'); FLASH=null; }
  const start=()=>{
    let inp;
    if(o.options){ inp=el('select',{class:'inl'}); (o.blank?['',...o.options]:o.options).forEach(x=>inp.append(el('option',{value:x,selected:x===v?'':null},x||'—'))); }
    else if(o.multiline){ inp=el('textarea',{class:'inl'}); inp.value=v??''; }
    else inp=el('input',{class:'inl',type:o.type||'text',value:v===null||v===undefined?'':v,placeholder:rotulo});
    sp.replaceWith(inp); inp.focus(); if(inp.select&&!o.multiline)inp.select();
    let cerrado=false;
    const commit=()=>{ if(cerrado)return; cerrado=true;
      let nv=inp.value;
      if(o.type==='number')nv=nv===''?null:Number(String(nv).replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''));
      if(o.num01)nv=nv===''?null:Math.min(1,Math.max(0,Number(nv)));
      if(String(nv)!==String(v===null||v===undefined?'':v)){
        snap(o.desc||('editar '+(o.nombre||campo))); obj[campo]=nv; if(o.after)o.after(nv,v);
        FLASH={o:obj,c:campo}; save(); }
      render(); };
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!o.multiline){e.preventDefault();inp.blur();}
      if(e.key==='Enter'&&o.multiline&&(e.ctrlKey||e.metaKey)){e.preventDefault();inp.blur();}
      if(e.key==='Escape'){cerrado=true;render();}});
    if(o.options)inp.addEventListener('change',()=>inp.blur());
  };
  sp.addEventListener('click',start);
  sp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();start();}});
  return sp;
}

    if(o.type==='number')nv=nv===''?null:Number(String(nv).replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''));
    if(String(nv)!==String(obj[campo]??'')){ obj[campo]=nv; if(o.after)o.after(nv); save(); } };

    if(i<grupos.length-1)m.append(el('div',{class:'sp'}));
  });
  document.body.append(m);
  const r=anchor.getBoundingClientRect();
  m.style.top=(r.bottom+window.scrollY+5)+'px';
  m.style.left=Math.max(8,Math.min(r.left+window.scrollX,window.innerWidth-m.offsetWidth-10))+'px';
  const fuera=e=>{ if(!m.contains(e.target)&&e.target!==anchor){m.remove();document.removeEventListener('mousedown',fuera);} };
  setTimeout(()=>document.addEventListener('mousedown',fuera),0);
  m.addEventListener('keydown',e=>{if(e.key==='Escape')m.remove();});
}

/* ============================================================
   RECOTIZAR
   Un solo camino para la pregunta que se hace de verdad: esta oferta
   hay que volver a mandarla. Distingue entre revisar el mismo folio
   (cambia precio o condiciones) y emitir uno nuevo (cambia el alcance),
   y deja el ajuste de precio hecho en vez de obligar a editar línea a línea.
   ============================================================ */
async function recotizar(q){
  const d=dias(q.validez);
  const contexto=d!==null&&d<0?('Está vencida hace '+Math.abs(d)+' días. '):'';
  const r=await ask('Recotizar '+folioRev(q),[
    {k:'tipo',label:contexto+'¿Qué cambia?',type:'select',
     options:['Solo el precio o las condiciones — misma obra, mismo folio, revisión '+((q.rev||0)+1),
              'También el alcance — folio nuevo, la anterior queda reemplazada'],
     value:'Solo el precio o las condiciones — misma obra, mismo folio, revisión '+((q.rev||0)+1)},
    {k:'ajuste',label:'Ajuste de precio sobre todas las líneas (en %, 0 = sin cambio)',type:'number',value:0},
    {k:'val',label:'Nueva validez',type:'date',value:iso(new Date(HOY.getTime()+15*864e5))},
    {k:'plazo',label:'Plazo de entrega',value:q.cond?.plazoEntrega||''},
    {k:'motivo',label:'Qué cambia respecto de la anterior',type:'textarea',
     ph:'ej. el cliente pidió bajar 3% y adelantar la entrega a 15 días'}],'Recotizar');
  if(!r)return;
  const pct=Number(r.ajuste)||0;
  const nuevoFolio=r.tipo.indexOf('También el alcance')===0;
  const ajustar=ls=>ls.forEach(l=>{
    if(l.precioKg)l.precioKg=Math.round(l.precioKg*(1+pct/100));
    else if(l.monto)l.monto=Math.round(l.monto*(1+pct/100));});
  if(nuevoFolio){
    const f=await ask('Folio de la cotización nueva',[{k:'folio',label:'Folio',value:siguienteFolio()}],'Crear');
    if(!f||!f.folio.trim())return;
    mut('recotizar con folio nuevo',()=>{
      const n=JSON.parse(JSON.stringify(q));
      n.qid=uid(); n.folio=f.folio.trim(); n.rev=0; n.versiones=[]; n.fecha=iso(HOY);
      n.validez=r.val; n.estado='Por enviar'; n.probManual=false; n.prob=null; n.oc='';
      n.motivoPerdida=''; n.cierre=''; n.ejecucion='';

/* ============================================================
   REVALIDAR
   Extender la vigencia sin tocar precio ni alcance. No es una
   revisión: la oferta es la misma, solo se corre el plazo para
   aceptarla. Queda registrado quién lo pidió y hasta cuándo.
   ============================================================ */
async function revalidar(q){
  const d=dias(q.validez);
  const ctx=d===null?'Esta oferta no tiene vigencia cargada. ':
    (d<0?'Venció hace '+Math.abs(d)+' días. ':'Vence en '+d+' días. ');
  const r=await ask('Revalidar '+folioRev(q),[
    {k:'val',label:ctx+'Nueva fecha de validez',type:'date',
     value:iso(new Date(HOY.getTime()+15*864e5))},
    {k:'motivo',label:'Por qué se extiende',type:'select',
     options:['El cliente sigue evaluando','Se atrasó la licitación','Esperando la OC',
              'Se atrasó el inicio de obra','Petición del cliente','Otro'],
     value:'El cliente sigue evaluando'},
    {k:'precio',label:'¿Los precios se mantienen?',type:'select',
     options:['Sí, mismo precio','No, hay que recotizar'],value:'Sí, mismo precio'},
    {k:'nota',label:'Detalle (opcional)',type:'textarea'}],'Revalidar');
  if(!r)return;
  if(r.precio.startsWith('No')){ toast('Si el precio cambia, usa Recotizar en vez de revalidar'); return recotizar(q); }
  mut('revalidar',()=>{
    q.revalidaciones=q.revalidaciones||[];
    q.revalidaciones.unshift({id:uid(),ts:iso(HOY),desde:q.validez,hasta:r.val,motivo:r.motivo,nota:r.nota||''});
    q.validez=r.val;
    if(q.cond)q.cond.validezTexto='Órdenes de compra recibidas hasta el '+
      (r.val||'').split('-').reverse().join('-')+'; precios revalidados el '+iso(HOY).split('-').reverse().join('-');
    if(['Perdida','Reemplazada'].includes(q.estado))q.estado='Enviada';
    logB(q.cuenta,'cotizacion','['+q.folio+'] revalidada hasta el '+fdate(r.val)+
      ' sin cambio de precio. Motivo: '+r.motivo+(r.nota?'. '+r.nota:''));
    nuevaTarea(q.cuenta,'Confirmar a '+(q.contacto||'el cliente')+' la revalidación de '+folioRev(q)+
      ' hasta el '+fdate(r.val),iso(HOY),'mio',q.folio);
  });
  toast(folioRev(q)+' vigente hasta el '+fdate(r.val)+'. Queda la tarea de avisarle al cliente.');
}


/* ============================================================
   DESPACHOS PARCIALES
   Una OC casi nunca sale en un camión. Sin registrar cada parcial
   no se puede responder la pregunta que importa: qué falta por salir.
   ============================================================ */
function kgLinea(l){ return Number(l.kg)||0; }
function kgTotalCot(q){ return (q.lineas||[]).reduce((a,l)=>a+kgLinea(l),0)||Number(q.kg)||0; }
function kgDespachados(q){ return (q.despachos||[]).filter(d=>d.estado!=='anulado')
  .reduce((a,d)=>a+(Number(d.kg)||0),0); }
function kgPorLinea(q){
  const m={};
  (q.lineas||[]).forEach(l=>{ m[l.id]={producto:l.producto||l.familia,total:kgLinea(l),salido:0}; });
  (q.despachos||[]).filter(d=>d.estado!=='anulado').forEach(d=>{
    (d.lineas||[]).forEach(x=>{ if(m[x.id])m[x.id].salido+=Number(x.kg)||0; }); });
  return m;
}
function avanceDespacho(q){
  const t=kgTotalCot(q), s=kgDespachados(q);
  return {total:t,salido:s,falta:Math.max(0,t-s),pct:t?Math.min(100,Math.round(s/t*100)):0};
}
const completa=q=>{const a=avanceDespacho(q);return a.total>0&&a.falta<=Math.max(1,a.total*0.005);};

async function registrarDespacho(q){
  const a=avanceDespacho(q);
  const lin=(q.lineas||[]).filter(l=>kgLinea(l)>0);
  const campos=[
    {k:'fecha',label:'Fecha del despacho',type:'date',value:iso(HOY)},
    {k:'guia',label:'N° de guía de despacho'},
    {k:'kg',label:'Kilos de este parcial (faltan '+num(a.falta)+' de '+num(a.total)+')',type:'number',value:a.falta||''},
    {k:'transporte',label:'Camión, patente y conductor',ph:'ej. rampla · CCYH-21 · Richard Cárcamo'},
    {k:'estado',label:'Estado',type:'select',options:['programado','despachado','recibido conforme','rechazado'],value:'despachado'},
    {k:'nota',label:'Qué salió en este camión',type:'textarea',
     ph:lin.length?('Productos: '+lin.map(l=>(l.producto||l.familia)).join(' · ')):''}];
  const r=await ask('Registrar despacho de '+folioRev(q),campos,'Registrar');
  if(!r)return;
  mut('registrar despacho',()=>{
    q.despachos=q.despachos||[];
    q.despachos.unshift({id:uid(),fecha:r.fecha,guia:r.guia||'',kg:Number(r.kg)||0,
      transporte:r.transporte||'',estado:r.estado,nota:r.nota||'',lineas:[]});
    if(avanceDespacho(q).pct>0&&EJEC.indexOf(q.ejecucion)<EJEC.indexOf('En despacho')){
      q.ejecucion='En despacho'; q.hitos.despacho=q.hitos.despacho||r.fecha; }
    const gd=String(r.guia||'').trim();
    logB(q.cuenta,'ejecucion','['+q.folio+'] despacho '+(gd?(/^GD/i.test(gd)?gd:'GD '+gd)+' ':'')+'de '+num(r.kg)+
      ' kg el '+fdate(r.fecha)+(r.transporte?' · '+r.transporte:'')+'. Avance '+avanceDespacho(q).pct+'%.');
    if(r.estado==='rechazado')nuevaTarea(q.cuenta,'Resolver el rechazo del despacho '+(r.guia||'')+' de '+q.folio,iso(HOY),'mio',q.folio);
    if(completa(q)&&EJEC.indexOf(q.ejecucion)<EJEC.indexOf('Entregada')){
      q.ejecucion='Entregada'; q.hitos.entrega=q.hitos.entrega||r.fecha;
      nuevaTarea(q.cuenta,'Confirmar recepción conforme y gestionar la factura de '+q.folio,iso(HOY),'mio',q.folio); }
  });
  const av=avanceDespacho(q);
  toast(av.pct+'% despachado'+(av.falta?' · faltan '+num(av.falta)+' kg':' · pedido completo'));
}

  mut('borrar '+tipo,()=>{
    if(tipo==='cuenta'){ S.cuentas=S.cuentas.filter(x=>x!==obj);
      S.cotizaciones=S.cotizaciones.filter(x=>x.cuenta!==obj.nombre);
      S.contactos=S.contactos.filter(x=>x.cuenta!==obj.nombre);

function renombrarCuenta(c,nuevo){
  const viejo=c.nombre; if(!nuevo||nuevo===viejo)return;
  c.nombre=nuevo;
  S.cotizaciones.forEach(q=>{if(q.cuenta===viejo)q.cuenta=nuevo;});
  S.contactos.forEach(p=>{if(p.cuenta===viejo)p.cuenta=nuevo;});
  S.tareas.forEach(t=>{if(t.cuenta===viejo)t.cuenta=nuevo;});
  S.proyectos.forEach(p=>{if(p.cuenta===viejo)p.cuenta=nuevo;});
  S.bitacora.forEach(b=>{if(b.cuenta===viejo)b.cuenta=nuevo;});
  if(UI.open===viejo)UI.open=nuevo;
}

/* ============ importar / exportar ============ */
function celTxt(v){return v===null||v===undefined?'':String(v).trim();}
function celFecha(v){
  if(v&&typeof v.getTime==='function'&&!isNaN(v.getTime())){const d=new Date(v.getTime()-v.getTimezoneOffset()*6e4);return d.toISOString().slice(0,10);}
  if(typeof v==='number'&&v>20000&&v<80000&&typeof XLSX!=='undefined'){const p=XLSX.SSF.parse_date_code(v);
    if(p)return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0');}
  const t=celTxt(v); if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);
  const m=t.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  return '';
}
function celNum(v){if(v===null||v===undefined||v==='')return 0;const n=Number(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'));return isNaN(n)?0:n;}
function hdrRow(rows,claves){for(let i=0;i<Math.min(rows.length,20);i++){const r=(rows[i]||[]).map(x=>norm(celTxt(x)));
  if(claves.every(k=>r.some(c=>c===norm(k))))return i;}return -1;}
const colIdx=(h,...ns)=>{for(const n of ns){const i=h.findIndex(x=>norm(celTxt(x))===norm(n));if(i>=0)return i;}return -1;};

function importarLibro(buf){

  const CU=hoja('CUENTAS'),CO=hoja('COTIZACIONES'),CT=hoja('CONTACTOS'),TA=hoja('TAREAS'),PR=hoja('PROYECTOS'),LI=hoja('LINEAS');

  let contactos=[];

  let hojaTareas=false;

  if(!hojaTareas)tareas.push(...tareasDeColumna);
  const proyectos=[];
  if(PR){ const hp=hdrRow(PR,['Cuenta','Proyecto']);
    if(hp>=0){ const P=PR[hp],g5=(...n)=>colIdx(P,...n);
      const mp={cuenta:g5('Cuenta'),nombre:g5('Proyecto'),comuna:g5('Comuna'),direccion:g5('Dirección'),

/* ============================================================
   ARCHIVO DOCUMENTAL
   Una sola convención para todo: FOLIO_rN. Cada cotización deja
   sus rastros bajo Cartera BB:
     cotizaciones/BB2026-016_r0.json           datos del CRM
     cotizaciones/BB2026-016_r0.html           documento imprimible

   El último lo pone el barrido de correo; los demás, el panel.

const D_COT='cotizaciones', D_PDF='cotizaciones_pdf', D_MAIL='correos';
const claveDoc=q=>String(q.folio).replace(/[^\w\-]/g,'_')+'_r'+(q.rev||0);
let ARCHIVO={};

async function subcarpeta(nombre,crear){
  if(!DIR)return null;
  try{ return await DIR.getDirectoryHandle(nombre,{create:!!crear}); }catch(e){ return null; }
}
async function escanearArchivo(){
  ARCHIVO={};
  if(!DIR)return ARCHIVO;
  const marcar=nom=>{ const m=String(nom).match(/^(.+?)(\.cotizador)?\.(json|html|pdf)$/i); if(!m)return;
    const k=m[1]; if(!ARCHIVO[k])ARCHIVO[k]={};
    if(m[2])ARCHIVO[k].cotizador=true; else ARCHIVO[k][m[3].toLowerCase()]=true; };
  for(const carp of [D_COT,D_PDF]){
    const h=await subcarpeta(carp,false); if(!h)continue;

async function escribirEn(carpeta,nombre,blob){
  const h=await subcarpeta(carpeta,true); if(!h)throw new Error('sin carpeta');

async function archivarCotizacion(q,silencio){
  if(!DIR){ if(!silencio)toast('No hay carpeta conectada'); return false; }
  const k=claveDoc(q);
  try{
    const datos={version:1,exportado:iso(HOY),cuenta:q.cuenta,
      proyecto:(proyecto(q.proyecto)||{}).nombre||'',cotizacion:JSON.parse(JSON.stringify(q))};
    await escribirEn(D_COT,k+'.json',new Blob([JSON.stringify(datos,null,1)],{type:'application/json'}));
    await escribirEn(D_COT,k+'.html',new Blob([htmlCotizacion(q)],{type:'text/html;charset=utf-8'}));
    ARCHIVO[k]=Object.assign(ARCHIVO[k]||{},{json:true,html:true});
    if(!silencio)toast(k+' archivada en JSON y HTML');
    return true;
  }catch(e){ if(!silencio)toast('No se pudo escribir en la carpeta'); return false; }
}
async function archivarTodas(){
  if(!DIR){ toast('No hay carpeta conectada'); return; }
  let n=0;
  for(const q of S.cotizaciones){ if(await archivarCotizacion(q,true))n++; }
  await escanearArchivo(); render();
  toast(n+' cotizaciones archivadas en cotizaciones/ (JSON + HTML)');
}
function descargarDoc(q){
  const b=new Blob([htmlCotizacion(q)],{type:'text/html;charset=utf-8'});
  const a=el('a',{href:URL.createObjectURL(b),download:claveDoc(q)+'.html'});
  document.body.append(a);a.click();a.remove();
}

/* ---------- leer y guardar el PDF de una cotización ---------- */
let PDF_URL=null, PDF_CLAVE=null;
async function urlPDF(q){
  const k=claveDoc(q);
  if(PDF_CLAVE===k&&PDF_URL)return PDF_URL;
  if(PDF_URL){ URL.revokeObjectURL(PDF_URL); PDF_URL=null; PDF_CLAVE=null; }
  const h=await subcarpeta(D_PDF,false); if(!h)return null;
  try{ const fh=await h.getFileHandle(k+'.pdf'); const f=await fh.getFile();
    PDF_URL=URL.createObjectURL(f); PDF_CLAVE=k; return PDF_URL; }catch(e){ return null; }
}
async function guardarPDF(q,file){
  if(!file)return false;
  if(!/\.pdf$/i.test(file.name)){ toast('Solo archivos PDF'); return false; }
  const k=claveDoc(q);
  try{
    await escribirEn(D_PDF,k+'.pdf',file);
    ARCHIVO[k]=Object.assign(ARCHIVO[k]||{},{pdf:true});
    if(PDF_CLAVE===k&&PDF_URL){ URL.revokeObjectURL(PDF_URL); PDF_URL=null; PDF_CLAVE=null; }
    toast('PDF guardado como '+k+'.pdf');
    return true;
  }catch(e){ toast('No se pudo guardar el PDF'); return false; }
}
async function borrarPDF(q){
  if(!await confirmar('Borrar el PDF archivado de '+folioRev(q)+'.','Borrar'))return;
  const k=claveDoc(q);
  try{ const h=await subcarpeta(D_PDF,false); if(h)await h.removeEntry(k+'.pdf');
    if(ARCHIVO[k])delete ARCHIVO[k].pdf;
    if(PDF_CLAVE===k&&PDF_URL){ URL.revokeObjectURL(PDF_URL); PDF_URL=null; PDF_CLAVE=null; }
    render(); toast('PDF borrado'); }catch(e){ toast('No se pudo borrar'); }
}

  const v=window.open('','_blank','width=980,height=1200');

}

const NS='http://www.w3.org/2000/svg';

  for(const[p,v]of Object.entries(a)){ if(p.startsWith('on'))n.addEventListener(p.slice(2),v); else if(v!==null&&v!==undefined)n.setAttribute(p,v); }

function chPareto(){
  const map={}; S.cotizaciones.filter(VIVA).forEach(q=>map[q.cuenta]=(map[q.cuenta]||0)+(q.neto||0));
  const arr=Object.entries(map).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const tot=arr.reduce((a,[,v])=>a+v,0)||1, max=arr[0]?arr[0][1]:1;
  const W=700,H=250,L=6,R=40,T=16,B=78, bw=(W-L-R)/Math.max(arr.length,1);
  const g=sv('svg',{viewBox:'0 0 '+W+' '+H});
  [0,.25,.5,.75,1].forEach(f=>{ const y=T+(H-T-B)*(1-f);
    g.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,class:'grid'}));
    g.append(sv('text',{x:W-R+5,y:y+3,class:'ax'},Math.round(f*100)+'%')); });
  let acc=0; const pts=[];
  arr.forEach(([n,v],i)=>{
    const x=L+i*bw, h=(H-T-B)*v/max, y=H-B-h;
    g.append(sv('rect',{x:x+bw*.16,y,width:bw*.68,height:Math.max(h,1),
      fill:i===0?'var(--mal)':'var(--acc2)', onclick:()=>abrir(n), style:'cursor:pointer'},
      sv('title',{},n+' — '+money(v))));
    g.append(sv('text',{x:x+bw/2,y:y-5,'text-anchor':'middle',class:'val'},money(v)));
    acc+=v; pts.push([x+bw/2, T+(H-T-B)*(1-acc/tot)]);
    const t=sv('text',{x:0,y:0,'text-anchor':'end',class:'lbl2',transform:'translate('+(x+bw/2+3)+','+(H-B+8)+') rotate(-42)'},
      n.length>26?n.slice(0,25)+'…':n);
    g.append(t);
  });
  g.append(sv('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'var(--ojo)','stroke-width':2}));
  pts.forEach(p=>g.append(sv('circle',{cx:p[0],cy:p[1],r:3,fill:'var(--ojo)',stroke:'#fff','stroke-width':1.5})));
  const top1=arr[0]?Math.round(arr[0][1]/tot*100):0;
  const ceros=Object.entries(map).filter(([,v])=>!v).map(([n])=>n);
  return panelC('Concentración de la cartera',
    (arr[0]? top1+'% en '+arr[0][0] : '')+(ceros.length? ' · no aparece '+ceros.join(', ')+': oferta viva sin neto cargado':''),g,
    leg(['var(--mal)','mayor exposición'],['var(--acc2)','resto de cuentas'],['var(--ojo)','acumulado']));
}

    g.append(sv('text',{x:L-8,y:H-8,'text-anchor':'end',class:'lbl2'},'$/kg implícito'));
  }
  return panelC('Precio por kilo', faltan? faltan+' cotizaciones vivas todavía sin kilos':'',g,
    leg(['var(--ok)','adjudicada'],['var(--acc2)','viva']));
}

function chContacto(){
  const b=[{l:'0–7 d',f:d=>d!==null&&d<=7,c:'var(--ok)'},{l:'8–15 d',f:d=>d!==null&&d>7&&d<=15,c:'var(--acc2)'},
           {l:'16–30 d',f:d=>d!==null&&d>15&&d<=30,c:'var(--ojo)'},{l:'+30 d',f:d=>d!==null&&d>30,c:'var(--mal)'},
           {l:'nunca',f:d=>d===null,c:'var(--linea2)'}];
  const ds=activas().map(sinContacto);
  const data=b.map(x=>({...x,n:ds.filter(x.f).length}));
  const max=Math.max(1,...data.map(d=>d.n)),W=700,H=190,L=20,B=44,T=22,bw=(W-L*2)/data.length;
  const g=sv('svg',{viewBox:'0 0 '+W+' '+H});
  g.append(sv('line',{x1:L,x2:W-L,y1:H-B,y2:H-B,stroke:'var(--linea2)'}));
  data.forEach((d,i)=>{
    const h=(H-T-B)*d.n/max, x=L+i*bw;
    g.append(sv('rect',{x:x+bw*.2,y:H-B-h,width:bw*.6,height:Math.max(h,1),fill:d.c}));
    g.append(sv('text',{x:x+bw/2,y:H-B-h-7,'text-anchor':'middle',class:'val'},String(d.n)));
    g.append(sv('text',{x:x+bw/2,y:H-B+15,'text-anchor':'middle',class:'lbl'},d.l));
    g.append(sv('text',{x:x+bw/2,y:H-B+27,'text-anchor':'middle',class:'lbl2'},Math.round(d.n/activas().length*100)+'%'));
  });
  return panelC('Temperatura del contacto','días desde el último correo en cualquier dirección',g);
}
