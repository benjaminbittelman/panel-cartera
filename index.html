/* ============================================================
   AGENDA
   Tres horizontes sobre los mismos datos: el día, la semana y el mes.
   Junta en una sola línea de tiempo lo que hoy vive separado: tus
   tareas, las vigencias que se caen y los cierres que prometiste.
   ============================================================ */
const DOW=['lun','mar','mié','jue','vie','sáb','dom'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const lunesDe=d=>{const x=new Date(d);const n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x;};
const masDias=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};

/* todo lo que tiene fecha, en un solo formato */
function eventos(){
  const ev=[];
  (S.tareas||[]).forEach(t=>{ if(!t.fecha)return;
    ev.push({f:t.fecha,tipo:t.tipo==='esperando'?'esp':'mio',hecha:!!t.hecha,
      txt:t.texto,cuenta:t.cuenta,folio:t.folio||'',ref:t,
      ir:()=>abrir(t.cuenta,'tareas')}); });
  S.cotizaciones.filter(q=>VIVA(q)||q.estado==='Adjudicada').forEach(q=>{
    if(q.validez)ev.push({f:q.validez,tipo:'vig',txt:'Vence '+folioRev(q)+' · '+money(q.neto),
      cuenta:q.cuenta,folio:q.folio,ref:q,
      ir:()=>{UI.openCot=q.qid;if(q.proyecto)irA({v:'proyecto',id:q.proyecto});else abrir(q.cuenta,'proyectos');}});
    if(q.monday&&q.monday.fabrica)ev.push({f:q.monday.fabrica,tipo:'fab',
      txt:'Fabricación '+folioRev(q)+(q.monday.semana?' · '+q.monday.semana:''),
      cuenta:q.cuenta,folio:q.folio,ref:q,
      ir:()=>{UI.openCot=q.qid;if(q.proyecto)irA({v:'proyecto',id:q.proyecto});else abrir(q.cuenta,'proyectos');}});
    if(q.cierre)ev.push({f:q.cierre,tipo:'cie',txt:'Cierre estimado '+folioRev(q)+' · '+money(q.neto),
      cuenta:q.cuenta,folio:q.folio,ref:q,
      ir:()=>{UI.openCot=q.qid;if(q.proyecto)irA({v:'proyecto',id:q.proyecto});else abrir(q.cuenta,'proyectos');}});
  });
  return ev;
}
const evPorDia=(ev,f)=>ev.filter(e=>e.f===f).sort((a,b)=>
  ({mio:0,esp:1,vig:2,fab:3,cie:4}[a.tipo]||9)-({mio:0,esp:1,vig:2,fab:3,cie:4}[b.tipo]||9));

async function agendarEn(fecha,cn,texto){
  const r=await ask('Agendar el '+fdate(fecha),[
    {k:'texto',label:'Qué hay que hacer',value:texto||'',ph:'ej. llamar a Gustavo por la OC'},
    {k:'cuenta',label:'Cuenta (déjalo en interno si no es de un cliente)',type:'select',
     options:opcionesCuenta(),value:cn||SIN_CUENTA},
    {k:'tipo',label:'Tipo',type:'select',options:['mio','esperando'],value:'mio'},
    {k:'folio',label:'Folio relacionado (opcional)'}],'Agendar');
  if(!r||!r.texto.trim())return;
  mut('agendar',()=>nuevaTarea(r.cuenta,r.texto.trim(),fecha,r.tipo,r.folio||''));
  toast('Agendado para el '+fdate(fecha));
}
function moverTarea(t,fecha){
  if(!t||t.fecha===fecha)return;
  mut('mover de fecha',()=>{ const antes=t.fecha; t.fecha=fecha;
    logB(t.cuenta,'tarea','Movida del '+fdate(antes)+' al '+fdate(fecha)+': '+t.texto); });
  toast('Movida al '+fdate(fecha));
}

function pintaEvento(e,compacto){
  const d=dias(e.f);
  const cls='ev2 '+e.tipo+(e.hecha?' hecha':'')+
    (!e.hecha&&e.tipo!=='cie'&&d!==null&&d<0?' vencida':'');
  const n=el('button',{class:cls,title:e.cuenta+' · '+e.txt,onclick:ev=>{ev.stopPropagation();e.ir();}});
  if(e.tipo==='mio'||e.tipo==='esp'){
    n.append(el('input',{type:'checkbox',class:'ck',style:'width:12px;height:12px;margin-top:1px',
      checked:e.hecha?'':null,onclick:ev=>ev.stopPropagation(),onchange:()=>toggleTarea(e.ref)}));
    n.draggable=true;
    n.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain','t:'+e.ref.id);n.style.opacity='.4';});
    n.addEventListener('dragend',()=>n.style.opacity='');
  }
  n.append(el('span',{class:'tt2'},compacto?e.txt:(e.cuenta+' · '+e.txt)));
  return n;
}

function celdaDia(fecha,ev,opt){
  const hoyS=iso(HOY), dow=(pd(fecha)||HOY).getDay();
  const del=evPorDia(ev,fecha);
  const abiertos=del.filter(e=>!e.hecha).length;
  const c=el('div',{class:'dia'+(fecha===hoyS?' hoy':'')+(opt&&opt.fuera?' fuera':'')+
    (dow===0||dow===6?' finde':''),onclick:()=>agendarEn(fecha,null)});
  ap(c,el('div',{class:'cab'},
    el('span',{class:'nd2'},String((pd(fecha)||HOY).getDate())),
    opt&&opt.dow?el('span',{class:'mi'},DOW[((pd(fecha)||HOY).getDay()+6)%7]):null,
    abiertos?el('span',{class:'mas'},abiertos+' pend.'):null));
  c.append(el('button',{class:'add',title:'Agendar aquí',
    onclick:ev=>{ev.stopPropagation();agendarEn(fecha,null);}},'+'));
  const lim=opt&&opt.lim||4;
  del.slice(0,lim).forEach(e=>c.append(pintaEvento(e,true)));
  if(del.length>lim)c.append(el('div',{class:'mi',style:'padding-left:3px'},'+'+(del.length-lim)+' más'));
  c.addEventListener('dragover',ev=>{ev.preventDefault();c.classList.add('over');});
  c.addEventListener('dragleave',()=>c.classList.remove('over'));
  c.addEventListener('drop',ev=>{ev.preventDefault();c.classList.remove('over');
    const dt=String(ev.dataTransfer.getData('text/plain')||'');
    if(dt.startsWith('t:'))moverTarea((S.tareas||[]).find(t=>t.id===dt.slice(2)),fecha);});
  return c;
}

function vistaMes(v){
  const ev=eventos();
  const base=UI.calMes?pd(UI.calMes):new Date(HOY);
  const ini=new Date(base.getFullYear(),base.getMonth(),1);
  const desde=lunesDe(ini);
  const card=el('div',{class:'c'});
  const mover=n=>{const x=new Date(base.getFullYear(),base.getMonth()+n,1);UI.calMes=iso(x);render();};
  card.append(barraAgenda(MESES[base.getMonth()]+' '+base.getFullYear(),
    ()=>mover(-1),()=>mover(1),()=>{UI.calMes=null;render();}));
  const g=el('div',{class:'cal'});
  DOW.forEach(d=>g.append(el('div',{class:'dow'},d)));
  for(let i=0;i<42;i++){
    const f=masDias(desde,i);
    if(i>=35&&f.getMonth()!==base.getMonth())break;
    g.append(celdaDia(iso(f),ev,{fuera:f.getMonth()!==base.getMonth(),lim:4}));
  }
  card.append(g,leyendaAgenda());
  v.append(card);
}
function vistaSemana(v){
  const ev=eventos();
  const base=UI.calSem?pd(UI.calSem):new Date(HOY);
  const desde=lunesDe(base);
  const card=el('div',{class:'c'});
  const mover=n=>{UI.calSem=iso(masDias(desde,n*7));render();};
  const hasta=masDias(desde,6);
  const tit=desde.getDate()+' '+MESES[desde.getMonth()].slice(0,3)+' — '+hasta.getDate()+' '+MESES[hasta.getMonth()].slice(0,3);
  card.append(barraAgenda(tit,()=>mover(-1),()=>mover(1),()=>{UI.calSem=null;render();}));
  const g=el('div',{class:'sem'});
  DOW.forEach(d=>g.append(el('div',{class:'dow'},d)));
  for(let i=0;i<7;i++)g.append(celdaDia(iso(masDias(desde,i)),ev,{lim:10}));
  card.append(g,leyendaAgenda());
  v.append(card);
  const rango=[...Array(7)].map((_,i)=>iso(masDias(desde,i)));
  const sem=ev.filter(e=>rango.includes(e.f)&&!e.hecha);
  v.append(el('div',{class:'cifras'},
    cifra('Pendientes de la semana',String(sem.filter(e=>e.tipo==='mio').length),'lo que prometiste tú'),
    cifra('Esperando respuesta',String(sem.filter(e=>e.tipo==='esp').length),'la pelota está en su cancha'),
    cifra('Vigencias que caen',String(sem.filter(e=>e.tipo==='vig').length),
      money(sem.filter(e=>e.tipo==='vig').reduce((a,e)=>a+(e.ref.neto||0),0))+' en juego',
      sem.some(e=>e.tipo==='vig')?'ml':'ok'),
    cifra('Cierres estimados',String(sem.filter(e=>e.tipo==='cie').length),
      money(sem.filter(e=>e.tipo==='cie').reduce((a,e)=>a+(e.ref.neto||0),0))+' comprometidos','ok')));
}

/* ============================================================
   PRODUCCIÓN
   Lo que pasa después de la OC: coordinación, fábrica, despachos
   parciales y cierre. La pregunta que responde es una sola:
   qué falta por salir y quién la tiene detenida.
   ============================================================ */
function enProduccion(){
  return S.cotizaciones.filter(q=>q.estado==='Adjudicada'&&q.ejecucion&&q.ejecucion!=='Cerrada')
    .sort((a,b)=>(trabado(b)?1:0)-(trabado(a)?1:0)||avanceEjec(a)-avanceEjec(b));
}
function cerradas(){
  return S.cotizaciones.filter(q=>q.ejecucion==='Cerrada')
    .sort((a,b)=>(b.hitos?.cierre||'').localeCompare(a.hitos?.cierre||''));
}
function miniEtapas(q){
  const i=avanceEjec(q), tr=trabado(q);
  const n=el('div',{class:'mini-eta'});
  EJEC.forEach((e,k)=>n.append(el('span',{class:k<i?'ok2':k===i?(tr?'bad':'now'):'',
    title:EJEC_AYUDA[e]+(q.hitos?.[HITO[e]]?' · '+fdate(q.hitos[HITO[e]]):'')},
    e.replace('Programada en fábrica','Fábrica').replace('Pedido ingresado','Pedido')
     .replace('En coordinación','Coordinación').replace('OC recibida','OC'))));
  return n;
}
function filaProduccion(q){
  const p=proyecto(q.proyecto), a=avanceDespacho(q), tr=trabado(q), d=diasEnEtapa(q);
  const w=el('div',{class:'prod'});
  const idc=el('div',{class:'pid2'});
  idc.append(el('button',{class:'ob',onclick:()=>{UI.openCot=q.qid;
      if(q.proyecto)irA({v:'proyecto',id:q.proyecto});else abrir(q.cuenta,'proyectos');}},p?p.nombre:q.obra),
    el('div',{class:'sb'},q.cuenta),
    el('div',{class:'sb'},folioRev(q)+(q.oc?' · OC '+q.oc:'')+(q.pedido?' · pedido '+q.pedido:'')));
  w.append(idc);

  const mid=el('div',{class:'mid'});
  mid.append(miniEtapas(q));
  const b=el('div',{class:'barra2'+(a.pct>=100?' full':a.pct===0?' cero':''),style:'margin-top:8px'},
    el('i',{style:'width:'+Math.max(a.pct,2)+'%'}));
  mid.append(b);
  const kgs=el('div',{class:'kgs'});
  ap(kgs,el('span',{},'Despachado ',el('b',{},num(a.salido)+' kg'),' de '+num(a.total)),
    a.falta?el('span',{style:'color:var(--mal)'},'Faltan ',el('b',{style:'color:var(--mal)'},num(a.falta)+' kg')):
      el('span',{style:'color:var(--ok)'},'completo'),
    el('span',{},a.pct+'%'),
    (q.despachos||[]).length?el('span',{},(q.despachos||[]).length+' parcial(es)'):null,
    q.monday?.fabrica?el('span',{},'fábrica '+fdate(q.monday.fabrica)+(q.monday.semana?' · '+q.monday.semana:'')):null);
  mid.append(kgs);
  if(tr){
    const f=faltaIngreso(q);
    mid.append(el('div',{style:'margin-top:6px'},
      f.length&&avanceEjec(q)<EJEC.indexOf('Pedido ingresado')
        ? pill('r','coordinación no lo acepta: faltan '+f.length+' datos')
        : pill('r',d+' días en '+q.ejecucion)));
  }
  w.append(mid);

  const lat=el('div',{class:'lat2'});
  ap(lat,pill(a.pct>=100?'v':tr?'r':'a',q.ejecucion));
  const i=avanceEjec(q);
  if(i<EJEC.length-1)lat.append(el('button',{class:'b xs pri',onclick:()=>setEjecucion(q,EJEC[i+1])},'→ '+EJEC[i+1]));
  lat.append(el('button',{class:'b xs',onclick:()=>registrarDespacho(q)},'Registrar despacho'),
    el('button',{class:'b xs ico',title:'Más',onclick:e=>menu(e.currentTarget,[
      {titulo:folioRev(q),items:[
        {txt:'Datos de producción y Monday',fn:()=>datosProduccion(q)},
        {txt:'Registrar despacho parcial',fn:()=>registrarDespacho(q)},
        {txt:'Registrar incidencia o rechazo',fn:()=>registrarIncidencia(q)},
        q.monday?.url?{txt:'Abrir el tablero de Monday',fn:()=>window.open(q.monday.url,'_blank')}:null,
        {txt:'Ver la cotización',fn:()=>{UI.openCot=q.qid;
          if(q.proyecto)irA({v:'proyecto',id:q.proyecto});else abrir(q.cuenta,'proyectos');}}].filter(Boolean)},
      {titulo:'Cierre',items:[{txt:'Cerrar el pedido',fn:()=>cerrarPedido(q)}]}])},'···'));
  w.append(lat);
  return w;
}
function tarjetaProduccion(){

/* ============================================================
   REGISTRO DE FOLIOS
   La serie es un recurso compartido: la usas desde el panel, desde el
   cotizador suelto y a mano en un correo. Sin un registro único
   terminas repitiendo números y saltándote otros, que es justo lo que
   pasó con el BB2026-018 y con el 019 que el PDF llamó 023.
   ============================================================ */
const PREFIJO=()=>{
  const f=(S.cotizaciones[0]||{}).folio||'BB2026-001';
  const m=String(f).match(/^(.*?)(\d+)\s*$/);
  return m?m[1]:'BB2026-';
};
const numFolio=f=>{const m=String(f||'').match(/(\d+)\s*$/);return m?+m[1]:null;};
const armaFolio=n=>PREFIJO()+String(n).padStart(3,'0');

function registroFolios(){
  const usa={}, dup={};
  S.cotizaciones.forEach(q=>{const n=numFolio(q.folio); if(n===null)return;
    if(usa[n])dup[n]=(dup[n]||[usa[n]]).concat(q); else usa[n]=q;});
  const res={}; (S.folios||[]).forEach(r=>{const n=numFolio(r.n); if(n!==null)res[n]=r;});
  const nums=[...Object.keys(usa),...Object.keys(res)].map(Number);
  const max=nums.length?Math.max(...nums):0;
  const filas=[];
  for(let n=1;n<=max+3;n++){
    const q=usa[n], r=res[n];
    filas.push({n,folio:armaFolio(n),q,res:r,dups:dup[n]||null,
      estado:dup[n]?'duplicado':q?'usado':r?'reservado':'libre'});
  }
  return {filas,max,
    huecos:filas.filter(f=>f.estado==='libre'&&f.n<max).length,
    duplicados:filas.filter(f=>f.estado==='duplicado').length,
    reservados:filas.filter(f=>f.estado==='reservado').length};
}
/* el siguiente libre de verdad: salta usados y reservados */
function siguienteFolioLibre(){
  const r=registroFolios();
  const f=r.filas.find(x=>x.estado==='libre'&&x.n>r.max);
  return f?f.folio:armaFolio(r.max+1);
}
async function reservarFolio(n){
  const f=armaFolio(n);
  const r=await ask('Reservar '+f,[
    {k:'para',label:'¿Para qué o para quién?',ph:'ej. Quilin · Proyecto AMB'},
    {k:'nota',label:'Nota',type:'textarea',ph:'dónde se va a emitir: cotizador suelto, a mano, otro KAM…'}],'Reservar');
  if(!r)return;
  mut('reservar folio',()=>{
    S.folios=S.folios||[];
    S.folios=S.folios.filter(x=>numFolio(x.n)!==n);
    S.folios.push({n:f,ts:iso(HOY),para:r.para||'',nota:r.nota||''});
  });
  try{ navigator.clipboard.writeText(f); toast(f+' reservado y copiado al portapapeles'); }
  catch(e){ toast(f+' reservado'); }
}
function liberarFolio(n){
  mut('liberar folio',()=>{ S.folios=(S.folios||[]).filter(x=>numFolio(x.n)!==n); });
}
async function renumerar(q){
  const r=registroFolios();
  const libres=r.filas.filter(x=>x.estado==='libre').map(x=>x.folio).slice(0,12);
  const rr=await ask('Renumerar '+folioRev(q),[
    {k:'folio',label:'Folio nuevo',value:libres[0]||siguienteFolioLibre()},
    {k:'libres',label:'Libres disponibles',type:'select',options:libres.length?libres:['(no hay huecos)'],value:libres[0]||''},
    {k:'motivo',label:'Por qué se renumera',type:'textarea',value:'Corrección de folio duplicado.'}],'Renumerar');
  if(!rr)return;
  const nuevo=(rr.folio||'').trim()||rr.libres;
  if(!nuevo||nuevo.startsWith('('))return;
  if(S.cotizaciones.some(x=>x!==q&&x.folio===nuevo)){ toast('Ese folio ya está usado'); return; }
  mut('renumerar',()=>{
    const antes=q.folio; q.folio=nuevo;
    S.tareas.forEach(t=>{ if(t.folio===antes)t.folio=nuevo; });
    logB(q.cuenta,'cotizacion','['+antes+'] renumerada a '+nuevo+'. '+(rr.motivo||''));
    S.folios=(S.folios||[]).filter(x=>numFolio(x.n)!==numFolio(nuevo));
  });
  toast('Ahora es '+nuevo+'. Ojo: los archivos guardados con el nombre anterior hay que renombrarlos.');
}

function hace(isoTs){ const ms=Date.now()-new Date(isoTs).getTime(); if(isNaN(ms))return '';
  const h=Math.floor(ms/36e5); if(h<1)return 'hace minutos'; if(h<24)return 'hace '+h+' h'; return 'hace '+Math.floor(h/24)+' d'; }
const SECCIONES=[['hoy','Hoy'],['agenda','Agenda'],['cartera','Cartera'],['bandeja','Bandeja'],['numeros','Números'],['cotizar','Cotizar']];

function irA(ruta,reemplazar){
  const h=(ruta.v==='cuenta'||ruta.v==='proyecto')?('#/'+ruta.v+'/'+encodeURIComponent(ruta.id)):('#/'+ruta.v);
  if(location.hash===h){UI.ruta=ruta;render();return;}
  if(reemplazar)location.replace(h); else location.hash=h;
}
function leerRuta(){
  const h=(location.hash||'#/hoy').replace(/^#\/?/,'').split('/');
  if(h[0]==='cuenta'&&h[1])return {v:'cuenta',id:decodeURIComponent(h[1])};
  if(h[0]==='proyecto'&&h[1])return {v:'proyecto',id:decodeURIComponent(h[1])};
  const v=['hoy','agenda','cartera','bandeja','numeros','cotizar'].includes(h[0])?h[0]:'hoy';
  return {v};
}

      el('div',{class:'d4'},el('button',{class:'lk',onclick:()=>{UI.openProy=q.proyecto;UI.openCot=q.qid;abrir(q.cuenta,'proyectos');}},folioRev(q)+' · '+q.cuenta)),
      el('div',{class:'tx2'},q.obra),

/* ============================================================
   LÍNEA DE VIDA
   Un carril por proyecto activo. Los que ya tienen orden de compra
   corren sobre el ciclo de ejecución; los demás sobre el comercial.
   ============================================================ */
function lineaDeVida(){
  const conOC=S.cotizaciones.filter(q=>q.estado==='Adjudicada'&&q.ejecucion&&q.ejecucion!=='Facturada')
    .sort((a,b)=>(trabado(b)?1:0)-(trabado(a)?1:0)||avanceEjec(a)-avanceEjec(b));
  const enCot=S.cotizaciones.filter(q=>VIVA(q)&&(q.neto||0)>0)
    .sort((a,b)=>b.neto-a.neto).slice(0,8);
  const facturadas=S.cotizaciones.filter(q=>q.ejecucion==='Facturada').length;
  const card=el('div',{class:'c vida'});
  card.append(el('header',{},el('h3',{},'Ofertas vivas en el tiempo'),
    el('span',{class:'sp'}),
    facturadas?el('span',{class:'mi'},facturadas+' ya facturadas'):null,
    el('button',{class:'b xs',onclick:()=>{UI.vista='embudo';irA({v:'cartera'});}},'Ver el embudo')));


  if(enCot.length){
    const cab=el('div',{class:'vidacab',style:'cursor:pointer',onclick:()=>{UI.verBandaCot=!UI.verBandaCot;render();}},
      el('div',{class:'idc'},chevron(!!UI.verBandaCot),' En cotización ',el('span',{class:'mi'},'('+enCot.length+')')),
      el('div',{class:'pista'},UI.verBandaCot?'Por enviar → Enviada → En revisión → En negociación → Adjudicada':'las ofertas vivas más grandes · clic para ver'),
      el('div',{class:'lat'},UI.verBandaCot?'Vigencia':''));
    card.append(cab);
    if(UI.verBandaCot)enCot.forEach(q=>card.append(carril(q,'comercial')));
  }
  if(!enCot.length)
    card.append(vacio(ICO.cotizar,'Todavía no hay nada en curso',
      'Cuando tengas cotizaciones vivas u órdenes de compra, cada una va a correr en su carril aquí.',
      el('button',{class:'b pri',onclick:()=>crearCotizacion()},'Crear cotización')));
  return card;
}
function carril(q,modo){
  const p=proyecto(q.proyecto);
  const etapas=modo==='ejecucion'?EJEC:FLUJO;
  const idx=modo==='ejecucion'?avanceEjec(q):FLUJO.indexOf(q.estado);
  const tr=modo==='ejecucion'&&trabado(q);
  const w=el('div',{class:'carril'});

  const idc=el('div',{class:'idc'});
  idc.append(el('button',{class:'cta',onclick:()=>{UI.openCot=q.qid;
      if(p)irA({v:'proyecto',id:p.pid}); else abrir(q.cuenta,'proyectos');}},p?p.nombre:q.obra),
    el('div',{class:'sub'},q.cuenta),
    el('div',{class:'sub'},folioRev(q)+(q.oc?' · OC '+q.oc:'')+(p?.comuna?' · '+p.comuna:'')),
    el('div',{class:'mto'},money(q.neto),q.kg?el('span',{class:'mi'},'  '+num(q.kg)+' kg'):null));
  w.append(idc);

  const pista=el('div',{class:'pista'});
  const riel=el('div',{class:'riel'});
  etapas.forEach((e,i)=>{
    const cls='nodo '+(i<idx?'ok':i===idx?(tr?'trabado':'aqui'):'');
    const fh=modo==='ejecucion'?q.hitos?.[HITO[e]]:null;
    const nd=el('div',{class:cls});
    ap(nd,el('div',{class:'barra'}),el('span',{class:'pt'}),
      el('div',{class:'et'},e),fh?el('div',{class:'fh'},fdate(fh)):null);
    nd.title=(i===idx?'Está aquí · ':'')+e;
    if(modo==='ejecucion'&&i!==idx)nd.style.cursor='pointer',nd.onclick=()=>setEjecucion(q,e);
    riel.append(nd);
  });
  pista.append(riel);
  w.append(pista);

  const lat=el('div',{class:'lat'});
  if(modo==='ejecucion'){
    const d=diasEnEtapa(q),f=faltaIngreso(q);
    if(tr&&f.length&&idx<1)lat.append(pill('r','faltan '+f.length+' datos'));
    else if(tr)lat.append(pill('r',d+' días parado'));
    else lat.append(pill(idx>=4?'v':'a',q.ejecucion));
    if(d!==null&&!tr)lat.append(el('span',{class:'est'},d===0?'movió hoy':'hace '+d+'d'));
    if(idx<EJEC.length-1)lat.append(el('button',{class:'b xs pri',onclick:()=>setEjecucion(q,EJEC[idx+1])},
      'Avanzar'));
  }else{
    const d=dias(q.validez);
    lat.append(d===null?pill('g','sin vigencia'):pill(d<0?'r':d<=7?'m':'g',d<0?Math.abs(d)+'d vencida':'vence en '+d+'d'));
    lat.append(el('span',{class:'est'},Math.round(probEf(q)*100)+'% · '+money(ponderadoAj(q))));
    if(q.estado!=='Adjudicada')lat.append(el('button',{class:'b xs',
      onclick:()=>setEstadoCot(q,FLUJO[Math.min(idx+1,FLUJO.length-1)])},'Avanzar'));
  }
  w.append(lat);
  return w;
}

function filaTarea(t,conCuenta){
  const d=dias(t.fecha);
  const wr=el('div',{class:'tk'+(t.hecha?' hecha':'')});
  wr.append(el('input',{type:'checkbox',class:'ck',style:'margin-top:4px',checked:t.hecha?'':null,onchange:()=>toggleTarea(t)}));
  const b=el('div',{class:'bd'});
  b.append(el('div',{class:'tx tt'},edit(t,'texto',{blq:true,nombre:'tarea',desc:'editar tarea'})));
  const mt=el('div',{class:'mt'});
  mt.append(edit(t,'fecha',{type:'date',nombre:'fecha',fmt:s=>s?fdate(s):'sin fecha'}));
  if(!t.hecha&&d!==null)mt.append(pill(d<0?'r':d===0?'m':'g',d<0?Math.abs(d)+'d tarde':d===0?'hoy':d===1?'mañana':d+'d'));
  mt.append(edit(t,'tipo',{options:['mio','esperando'],nombre:'tipo',fmt:x=>x==='esperando'?'esperando a ellos':'mío'}));
  if(conCuenta)mt.append(esInterna(t)

    : el('button',{class:'lk',style:'font-size:11.5px',onclick:()=>abrir(t.cuenta,'tareas')},t.cuenta));
  if(t.folio)mt.append(pill('a',t.folio));
  b.append(mt);
  wr.append(b,el('div',{class:'ac'},
    t.hecha?null:el('button',{class:'b xs',onclick:()=>cerrarYAgendar(t)},'Cerrar y agendar'),
    t.hecha?null:el('button',{class:'b xs sutil',title:'posponer una semana',onclick:()=>mut('posponer',()=>{t.fecha=iso(new Date(Math.max((pd(t.fecha)||HOY).getTime(),HOY.getTime())+7*864e5));})},'+7d'),
    el('button',{class:'b xs sutil peli',title:'borrar',onclick:()=>borrar('tarea',t)},'×')));
  return wr;

function adderTarea(cn){

/* lee el estado que dejó el cotizador para esa cotización, si existe */
async function snapshotDe(q){
  if(!DIR||!q)return null;
  try{ const h=await subcarpeta(D_COT,false); if(!h)return null;
    const fh=await h.getFileHandle(claveDoc(q)+'.cotizador.json');
    return JSON.parse(await (await fh.getFile()).text());
  }catch(e){ return null; }
}
function contextoCotizador(){
  if(!COT_CTX)return {};
  const c=cuenta(COT_CTX.cuenta),p=COT_CTX.proyecto?proyecto(COT_CTX.proyecto):null;
  const q=COT_CTX.qid?S.cotizaciones.find(x=>x.qid===COT_CTX.qid):null;
  const pr=contactosDe(COT_CTX.cuenta).find(x=>x.rol==='Decide')||contactosDe(COT_CTX.cuenta)[0];
  return {cliente:c?.nombre||'',contacto:(q?.contacto)||pr?.nombre||c?.contacto||'',
    obra:q?.obra||p?.nombre||'',comuna:p?.comuna||'',folio:q?q.folio:siguienteFolio(),
    rev:q?String(q.rev||0):'0',e_correo:q?.emailContacto||pr?.email||c?.email||'',
    fvalida:q?.validez||'',femision:q?.fecha||'',
    c_plazo:q?.cond?.plazoEntrega||'',c_pago:q?.cond?.condPago||'',c_lugar:q?.cond?.lugarEntrega||'',
    c_reajuste:q?.cond?.reajuste||'',c_facturacion:q?.cond?.facturacion||'',c_anticipo:q?.cond?.anticipo||'',
    c_despacho:q?.cond?.despachoMin||'',glosa:q?.cond?.notaTecnica||''};
}
/* manda el contexto y, si existe, el estado completo para poder modificar de verdad */
async function enviarContextoCotizador(){
  const f=$('#cotFrame'); if(!f||!f.contentWindow)return;
  const q=COT_CTX?.qid?S.cotizaciones.find(x=>x.qid===COT_CTX.qid):null;
  const snap=q?await snapshotDe(q):null;
  f.contentWindow.postMessage({tipo:'acma-cot-contexto',campos:contextoCotizador(),
    snapshot:snap,sobrescribir:!!q},'*');
  if(q){
    if(snap)toast(folioRev(q)+' cargada completa en el cotizador. Lo que edites y guardes vuelve al CRM.');
    else toast(folioRev(q)+': solo se cargó la cabecera. Esta cotización no se creó en el cotizador, así que no existe su cubicación.',
      ['Entendido',()=>{}]);
  }
}
function recibirCotizacion(m){
  const r=m.resumen||{};
  const cn=cuenta(r.cliente)?r.cliente:(COT_CTX?.cuenta||r.cliente);
  let c=cuenta(cn);
  snap('cotización desde el cotizador');
  if(!c){ const ids=S.cuentas.map(x=>+String(x.id).replace(/\D/g,'')||0);
    c={cid:uid(),id:'C'+String(Math.max(0,...ids)+1).padStart(2,'0'),nombre:cn||'Cliente sin nombre',seg:'',tipo:'Constructora',
      grupo:'',contacto:r.contacto||'',cargo:'',email:'',tel:'',ultMio:'',ultSuyo:'',hablo:'nadie',
      canal:'EN NEGOCIACIÓN',prio:'B - Media',notas:'',archivada:false};
    S.cuentas.push(c); }
  const nomProy=(COT_CTX?.proyecto&&proyecto(COT_CTX.proyecto)?.nombre)||r.obra||'Obra sin definir';
  let p=S.proyectos.find(x=>x.cuenta===c.nombre&&norm(x.nombre)===norm(nomProy));
  if(!p){ p={pid:uid(),cuenta:c.nombre,nombre:nomProy,comuna:r.comuna||'',direccion:'',mandante:'',estado:'Activo',inicio:'',notas:''};
    S.proyectos.push(p); } else if(!p.comuna&&r.comuna)p.comuna=r.comuna;
  const lineas=(m.lineas||[]).map(l=>({id:uid(),familia:l.familia||'Otro',producto:l.producto||'',
    kg:l.kg||null,precioKg:l.precioKg||null,monto:l.monto||null}));
  const netoCot=Math.round(Number(r.neto)||0);
  const suma=Math.round(lineas.reduce((a,l)=>a+(Number(l.kg)||0)*(Number(l.precioKg)||0)+(Number(l.monto)||0),0));
  let desajuste=0;
  if(lineas.length&&netoCot&&Math.abs(netoCot-suma)>Math.max(1000,netoCot*0.005)){
    desajuste=netoCot-suma;
    lineas.push({id:uid(),familia:'Otro',producto:desajuste>0?'Diferencia con el total del cotizador':'Descuento o ajuste',
      kg:null,precioKg:null,monto:desajuste});
  }
  let q=S.cotizaciones.find(x=>x.folio===r.folio&&x.cuenta===c.nombre);
  const rev=Number(r.rev||0);
  if(q){
    if(rev>(q.rev||0)){ q.versiones=q.versiones||[];
      q.versiones.unshift({rev:q.rev||0,ts:iso(HOY),fecha:q.fecha,neto:q.neto,kg:q.kg,validez:q.validez,estado:q.estado,
        lineas:JSON.parse(JSON.stringify(q.lineas||[])),nota:q.nota,motivo:'reemplazada por r'+rev+' del cotizador'}); }
    q.rev=rev; q.neto=netoCot; q.kg=r.kg||null; q.validez=r.fvalida||q.validez; q.obra=r.obra||q.obra;
    q.contacto=r.contacto||q.contacto; q.lineas=lineas; q.proyecto=p.pid;
    if(q.estado==='Por enviar')q.estado='Enviada';
    logB(c.nombre,'cotizacion','['+q.folio+' r'+rev+'] actualizada desde el cotizador: '+money(q.neto));
  }else{
    q={qid:uid(),folio:r.folio||siguienteFolio(),rev,versiones:[],fecha:r.femision||iso(HOY),cuenta:c.nombre,proyecto:p.pid,
      obra:r.obra||p.nombre,contacto:r.contacto||'',email:'',producto:'',neto:netoCot,kg:r.kg||null,validez:r.fvalida||'',
      estado:'Enviada',prob:null,probManual:false,oc:'',nota:r.glosa||'',cierre:'',motivoPerdida:'',lineas,
      ejecucion:'',hitos:{oc:'',ingreso:'',programa:'',despacho:'',entrega:'',factura:''},
      ingreso:{calendario:'',precioKilo:(r.kg&&netoCot)?Math.round(netoCot/r.kg):null,direccion:'',contactoObra:r.contacto||'',
        segmento:'',camiones:''},incidencias:[]};
    S.cotizaciones.unshift(q);
    logB(c.nombre,'cotizacion','['+q.folio+' r'+rev+'] creada desde el cotizador: '+money(q.neto));
    nuevaTarea(c.nombre,'Confirmar recepción de '+q.folio,iso(new Date(HOY.getTime()+3*864e5)),'esperando',q.folio);
  }
  if(desajuste)logB(c.nombre,'cotizacion','['+q.folio+'] las líneas no sumaban el total: línea de ajuste por '+money(desajuste));
  guardarSnapshotCot(q,m.snapshot);
  save(); render();
  toast(folioRev(q)+' registrada en '+c.nombre+' · '+lineas.length+' líneas',
    ['Ver',()=>{UI.openProy=p.pid;UI.openCot=q.qid;abrir(c.nombre,'proyectos');}]);
}
async function guardarSnapshotCot(q,snapshot){
  if(!DIR)return;
  /* el snapshot crudo del cotizador va aparte, para no pisar el registro del CRM */
  if(snapshot){ try{ await escribirEn(D_COT,claveDoc(q)+'.cotizador.json',
    new Blob([JSON.stringify(snapshot)],{type:'application/json'})); }catch(e){} }
  await archivarCotizacion(q,true);
  escanearArchivo();
}

/* ============================================================
   PÁGINA DE PROYECTO
   La obra deja de vivir dentro de la ficha del cliente y tiene su
   propia hoja, con URL propia: se puede compartir y volver atrás.
   ============================================================ */
function pgProyecto(v,p){
  const c=cuenta(p.cuenta);
  const qs=cotsDeProy(p.pid).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const vv=qs.filter(VIVA),gan=qs.filter(q=>q.estado==='Adjudicada');
  const w=el('div',{class:'ancho rej'});
  const clase={'Activo':'act','En estudio':'est','Suspendido':'pau','Perdido':'per','Cerrado':''}[p.estado]||'';

  /* ---- cabecera compacta: la obra se identifica, no se explica ---- */
  const cab=el('div',{class:'pgcab '+clase});
  const top=el('div',{class:'top'});
  top.append(el('div',{style:'flex:1;min-width:0'},
    el('h1',{},edit(p,'nombre',{nombre:'nombre de la obra',desc:'renombrar proyecto'})),
    el('div',{class:'sub'},
      el('button',{class:'lk',onclick:()=>abrir(p.cuenta)},p.cuenta),
      el('span',{style:'color:var(--t3)'},'·'),
      pill(p.estado==='Activo'?'v':p.estado==='Perdido'?'r':p.estado==='Suspendido'?'m':'a',p.estado||'—',true),
      p.comuna?el('span',{},p.comuna):el('span',{style:'color:var(--t3)'},'sin comuna'),
      p.mandante?el('span',{},'· '+p.mandante):null,
      el('span',{style:'color:var(--t3)'},'·'),
      el('span',{class:'num'},money(vv.reduce((a,q)=>a+(q.neto||0),0))+' vivo'),
      el('span',{style:'color:var(--t3)'},'·'),
      el('span',{},qs.length+(qs.length===1?' cotización':' cotizaciones')))),
    el('button',{class:'b','aria-pressed':UI.verFicha?'true':'false',
      onclick:()=>{UI.verFicha=!UI.verFicha;render();}},chevron(!!UI.verFicha),
      UI.verFicha?'Ocultar detalles':'Detalles de la obra'),
    el('button',{class:'b ico',title:'Más',onclick:e=>menu(e.currentTarget,[
      {titulo:p.nombre,items:[
        {txt:'Ver la cuenta completa',fn:()=>abrir(p.cuenta)},
        {txt:'Ver el resumen y la bitácora',fn:()=>{UI.verResumen=!UI.verResumen;render();}},
        {txt:'Agendar una tarea',fn:async()=>{const r=await ask('Nueva tarea en '+p.nombre,
          [{k:'t',label:'Tarea'},{k:'f',label:'Fecha',type:'date',value:iso(HOY)},
           {k:'tipo',label:'Tipo',type:'select',options:['mio','esperando'],value:'mio'}],'Agendar');
          if(!r||!r.t.trim())return; mut('nueva tarea',()=>nuevaTarea(p.cuenta,r.t.trim()+' — '+p.nombre,r.f,r.tipo));}},
        {txt:'Borrar proyecto',fn:()=>borrar('proyecto',p)}]}])},'···'));
  cab.append(top);
  if(UI.verFicha){
    const dl=el('dl',{class:'dl'}),put=(k,x)=>{dl.append(el('dt',{},k),el('dd',{},x));};
    put('Estado',edit(p,'estado',{options:EST_PROY,nombre:'estado'}));
    put('Comuna',edit(p,'comuna',{nombre:'comuna',ph:'añadir comuna'}));
    put('Dirección',edit(p,'direccion',{nombre:'dirección',ph:'añadir dirección de obra'}));
    put('Mandante',edit(p,'mandante',{nombre:'mandante',ph:'añadir mandante'}));
    put('Inicio de obra',edit(p,'inicio',{type:'date',nombre:'fecha',fmt:x=>x?fdate(x):''}));
    put('Notas',edit(p,'notas',{multiline:true,blq:true,nombre:'notas',ph:'contexto de esta obra'}));
    const per=contactosDe(p.cuenta);
    put('Personas',per.length?el('div',{},...per.map(x=>el('div',{style:'margin-bottom:3px'},
      x.nombre,' ',pill(x.rol==='Decide'?'v':'g',x.rol||'—'),
      el('span',{class:'mi'},'  '+[x.cargo,x.email,x.tel].filter(Boolean).join(' · ')))))
      :el('button',{class:'b xs',onclick:()=>crearContacto(p.cuenta)},'Agregar la primera persona'));
    cab.append(dl);
  }
  w.append(cab);

  /* ---- el centro de la hoja: las cotizaciones ---- */
  const card=el('div',{class:'c'});
  const ultima=qs.filter(VIVA).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''))[0]||qs[0];
  const venc=qs.filter(q=>VIVA(q)&&dias(q.validez)!==null&&dias(q.validez)<0);
  card.append(el('header',{},el('h3',{},'Cotizaciones'),el('span',{class:'co'},String(qs.length)),
    venc.length?pill('r',venc.length+' vencida'+(venc.length>1?'s':'')):null,
    (()=>{const n=qs.filter(x=>estadoDoc(x).pdf).length;
      return qs.length?el('span',{class:'mi',title:'PDF archivados en Cartera BB/cotizaciones_pdf'},
        n+' de '+qs.length+' con PDF'):null;})(),
    el('span',{class:'sp'}),
    ultima?el('button',{class:'b pri',onclick:()=>recotizar(ultima)},'Recotizar '+folioRev(ultima)):null,
    el('button',{class:'b',onclick:()=>crearCotizacion(p.cuenta,p.pid)},'Nueva cotización'),
    el('button',{class:'b',onclick:()=>abrirCotizador({cuenta:p.cuenta,proyecto:p.pid})},'Cotizador')));
  if(venc.length)card.append(el('div',{class:'bloqueo'},'⚠',
    el('div',{},venc.map(q=>folioRev(q)).join(', ')+(venc.length>1?' están vencidas':' está vencida')+
      '. Recotizar copia las líneas, te deja aplicar un ajuste de precio en un solo paso y archiva la versión anterior.')));
  card.append(tablaCotizaciones(p,c||{nombre:p.cuenta}));
  w.append(card);

  /* ---- lo que hay en curso, si lo hay ---- */
  const enEj=qs.filter(q=>q.ejecucion&&q.ejecucion!=='Facturada');
  if(enEj.length){
    const lv=el('div',{class:'c vida'});
    lv.append(el('header',{},el('h3',{},'Pedidos en curso'),
      pill(enEj.some(trabado)?'r':'v',String(enEj.length))));
    lv.append(el('div',{class:'vidacab'},el('div',{class:'idc'},'Pedido'),
      el('div',{class:'pista'},'OC → Ingreso → Programa → Despacho → Entrega → Factura'),
      el('div',{class:'lat'},'Estado')));
    enEj.forEach(q=>lv.append(carril(q,'ejecucion')));
    w.append(lv);
  }

  /* ---- lo secundario, plegado ---- */
  const extra=el('div',{class:'c'});
  extra.append(el('header',{},el('h3',{},'Resumen y bitácora de la obra'),el('span',{class:'sp'}),
    el('button',{class:'b xs','aria-pressed':UI.verResumen?'true':'false',
      onclick:()=>{UI.verResumen=!UI.verResumen;render();}},UI.verResumen?'Ocultar':'Ver')));
  if(UI.verResumen){
    extra.append(el('div',{style:'padding:var(--s4)'},
      el('div',{class:'cifras'},
        cifra('Monto vivo',money(vv.reduce((a,q)=>a+(q.neto||0),0)),vv.length+' abiertas'),
        cifra('Ponderado',money(vv.reduce((a,q)=>a+ponderadoAj(q),0)),'ajustado por vigencia'),
        cifra('Ganado',money(gan.reduce((a,q)=>a+(q.neto||0),0)),gan.length+' órdenes','ok'),
        cifra('Kilos vivos',num(vv.reduce((a,q)=>a+(q.kg||0),0))||'—',
          vv.filter(q=>!q.kg).length?vv.filter(q=>!q.kg).length+' sin kilos':'todas con kilos',
          vv.some(q=>!q.kg)?'oj':'ok'),
        cifra('Revisiones',String(qs.reduce((a,q)=>a+(q.versiones||[]).length,0)+qs.length),'histórico'))));
    const folios=qs.map(q=>q.folio);
    const bit=bitaDe(p.cuenta).filter(b=>folios.some(f=>b.texto.includes(f))||norm(b.texto).includes(norm(p.nombre)));
    const tl=el('div',{class:'linea-t'});
    bit.slice(0,40).forEach(e=>tl.append(el('div',{class:'ev'},el('div',{class:'pt'}),
      el('div',{class:'cu'},el('div',{class:'fh'},fdate(e.ts),el('span',{},e.tipo)),
        el('div',{class:'tx'},e.texto)))));
    if(!bit.length)tl.append(vacio(ICO.cotizar,'Sin registros de esta obra',
      'Lo que anotes en la cuenta y mencione la obra o alguno de sus folios aparece aquí.'));
    extra.append(tl);
  }
  w.append(extra);
  v.append(w);
}

let HOJA_PEND=null;
function panelHoja(q){
  const cont=el('div',{style:'padding:var(--s4)'});
  cont.append(el('div',{style:'display:flex;gap:8px;align-items:center;margin-bottom:var(--s3);flex-wrap:wrap'},
    el('span',{class:'mi'},'Esta es la maqueta del cotizador, la misma que sale impresa al cliente.'),
    el('span',{style:'flex:1'}),
    el('button',{class:'b xs pri',onclick:()=>pedirHoja(q)},'Generar la hoja'),
    el('button',{class:'b xs',onclick:()=>{UI.docTab='doc';render();}},'Ver la ficha del CRM')));
  const caja=el('div',{id:'cajaHoja',
    style:'border:1px solid var(--linea);border-radius:var(--r);background:#fff;min-height:320px'});
  if(HOJA_PEND&&HOJA_PEND.qid===q.qid){
    const marco=el('iframe',{style:'width:100%;height:min(76vh,1000px);border:0;display:block;background:#fff'});
    caja.append(marco);
    setTimeout(()=>{ try{ marco.contentDocument.open(); marco.contentDocument.write(HOJA_PEND.html);
      marco.contentDocument.close(); }catch(e){} },30);
    cont.append(caja,el('div',{style:'margin-top:var(--s3);display:flex;gap:7px'},
      el('button',{class:'b',onclick:()=>{const v=window.open('','_blank');
        if(v){v.document.open();v.document.write(HOJA_PEND.html);v.document.close();}}},'Abrir aparte'),
      el('button',{class:'b',onclick:()=>{const b=new Blob([HOJA_PEND.html],{type:'text/html;charset=utf-8'});
        const a=el('a',{href:URL.createObjectURL(b),download:claveDoc(q)+'_hoja.html'});
        document.body.append(a);a.click();a.remove();}},'Descargar')));
    return cont;
  }
  caja.append(vacio(ICO.cotizar,'La hoja se genera desde el cotizador',
    'El cotizador arma el documento con su propia maqueta, que es la que ha ido al cliente. Apreta «Generar la hoja»: se abre el cotizador con esta cotización cargada y devuelve el documento aquí. '+
    'Requiere que la cotización se haya creado en el cotizador; si vino del Excel o la cargaste a mano, no existe su cubicación.',
    el('button',{class:'b pri',onclick:()=>pedirHoja(q)},'Generar la hoja')));
  cont.append(caja);
  return cont;
}
async function pedirHoja(q){
  const snap=await snapshotDe(q);
  if(!snap){ await ask('No hay estado del cotizador para '+folioRev(q),
    [{k:'x',label:'Qué pasa',type:'textarea',
      value:'Esta cotización no se generó desde el cotizador embebido, así que no existe el archivo '+claveDoc(q)+'.cotizador.json con su cubicación, precios y plan de carga.\n\nPara tenerla: abre la cotización en el cotizador, carga la cubicación y genera el PDF desde ahí. A partir de ese momento la hoja se puede reproducir siempre.'}],'Entendido');
    return; }
  toast('Generando la hoja en el cotizador…');
  HOJA_PEND={qid:q.qid,html:null,pidiendo:true};
  abrirCotizadorSilencioso(q,snap);
}
function abrirCotizadorSilencioso(q,snap){
  document.querySelectorAll('#marcoHoja').forEach(n=>n.remove());
  const f=el('iframe',{id:'marcoHoja',src:'cotizador.html',
    style:'position:fixed;left:-9999px;top:0;width:1200px;height:900px;border:0'});
  f.addEventListener('load',()=>{ setTimeout(()=>{ try{
    f.contentWindow.postMessage({tipo:'acma-cot-contexto',campos:contextoCotizador(),snapshot:snap,sobrescribir:true},'*');
    setTimeout(()=>f.contentWindow.postMessage({tipo:'acma-cot-pedir-hoja',qid:q.qid},'*'),700);
  }catch(e){} },400); });
  document.body.append(f);
}
function mostrarHojaCotizador(html){
  document.querySelectorAll('#marcoHoja').forEach(n=>n.remove());
  if(!HOJA_PEND){ return; }
  HOJA_PEND.html=html; HOJA_PEND.pidiendo=false;
  UI.docTab='hoja'; render();
  toast('Hoja generada con la maqueta del cotizador');
}

/* ============================================================
   BANDEJA DE CORREO
   El flujo alimenta, el panel propone, tú confirmas. Nunca al revés:
   un CRM que se actualiza solo desde el correo miente peor que uno
   desactualizado, porque no sabes en qué dejó de ser cierto.
   ============================================================ */
const RX_FOLIO=/\bBB\s?2026[\s\-_]?(\d{3})\b/gi;
function foliosEn(txt){
  const s=String(txt||'').toUpperCase(); const out=new Set(); let m;
  RX_FOLIO.lastIndex=0;
  while((m=RX_FOLIO.exec(s))!==null)out.add('BB2026-'+m[1]);
  return [...out];
}
function correoDe(x){
  if(!x)return '';
  if(typeof x==='string')return (x.match(/[\w.\-+]+@[\w.\-]+/)||[''])[0].toLowerCase();
  if(x.emailAddress)return String(x.emailAddress.address||'').toLowerCase();
  if(x.address)return String(x.address).toLowerCase();
  return '';
}
function correosDe(x){
  if(!x)return [];
  if(Array.isArray(x))return x.map(correoDe).filter(Boolean);
  if(typeof x==='string')return (x.match(/[\w.\-+]+@[\w.\-]+/g)||[]).map(s=>s.toLowerCase());
  const u=correoDe(x); return u?[u]:[];
}
const INTERNOS=['acma.cl','acmanet.cl','inchalam.cl'];
function cuentaPorCorreo(dirs){
  for(const d of dirs){
    const dom=d.split('@')[1]||'';
    if(!dom||INTERNOS.includes(dom))continue;
    let c=S.cuentas.find(x=>(x.email||'').toLowerCase()===d);
    if(c)return c;
    const p=S.contactos.find(x=>(x.email||'').toLowerCase()===d);
    if(p){ c=cuenta(p.cuenta); if(c)return c; }
    c=S.cuentas.find(x=>(x.email||'').toLowerCase().split('@')[1]===dom);
    if(c)return c;
    const p2=S.contactos.find(x=>(x.email||'').toLowerCase().split('@')[1]===dom);
    if(p2){ c=cuenta(p2.cuenta); if(c)return c; }
  }
  return null;
}

/* ingesta pura: recibe el JSON ya parseado, venga de la carpeta o de un archivo suelto */
function ingerirBarrido(j){
  S.correos=S.correos||[]; S.vistos=S.vistos||[];
  S.ultimoBarrido=new Date().toISOString();
  const lista=x=>Array.isArray(x)?x:(x&&Array.isArray(x.body)?x.body:(x&&Array.isArray(x.value)?x.value:[]));
  const respaldoFecha=String(j.generado||'').slice(0,10);
  const yaTengo=new Set([...S.correos.map(x=>x.id),...S.vistos]);
  let nuevos=0;
  const meter=(arr,dir)=>{ lista(arr).forEach(m=>{
    const id=String(m.id||m.internetMessageId||((m.asunto||m.subject||'')+(m.fecha||'')));
    if(!id||yaTengo.has(id))return; yaTengo.add(id);
    if(!(m.asunto||m.subject)&&!(m.de||m.from))return;
    S.correos.push({id,dir,
      de:correoDe(m.de||m.from),
      para:correosDe(m.para||m.toRecipients),
      asunto:String(m.asunto||m.subject||''),
      fecha:String(m.fecha||m.receivedDateTime||m.sentDateTime||m.dateTimeReceived||respaldoFecha||'').slice(0,10),
      resumen:String(m.resumen||m.bodyPreview||'').slice(0,600),
      adjuntos:!!(m.adjuntos||m.hasAttachments)});
    nuevos++; }); };
  meter(j.recibidos,'in'); meter(j.enviados,'out');
  S.correos.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return nuevos;
}
/* cargar uno o varios barridos desde archivos que el usuario elige o arrastra */
async function cargarArchivosBarrido(files){
  let n=0, malos=0;
  for(const f of files){
    if(!/\.json$/i.test(f.name)){malos++;continue;}
    try{ n+=ingerirBarrido(JSON.parse(await f.text())); }catch(e){ malos++; }
  }
  S.ultimoBarrido=new Date().toISOString();
  if(n){ snap('cargar barrido');
    if(S.autoAplicar!==false){ const r=procesarAuto(); toast(n+' correos leídos · '+resumenAuto(r)); }
    else toast(n+' correo(s) nuevo(s) cargado(s)');
    save(); }
  else toast(malos?'Ninguno de esos archivos era un barrido válido':'Sin correos nuevos: ya estaban todos');
  render();
  return n;
}
async function leerBarridos(){
  if(!DIR){ toast('No hay carpeta conectada'); return 0; }
  let h=null;
  try{ h=await DIR.getDirectoryHandle(D_MAIL,{create:false}); }
  catch(e){ toast('No encuentro la carpeta «correos» dentro de '+DIR.name+'. Usa «Cargar un archivo» y arrastra el barrido.'); return 0; }
  let nuevos=0, archivos=0, fallos=0;
  try{
    for await(const [nom,ent] of h.entries()){
      if(ent.kind!=='file'||!/\.json$/i.test(nom))continue;
      archivos++;
      try{ nuevos+=ingerirBarrido(JSON.parse(await (await ent.getFile()).text())); }catch(e){ fallos++; }
    }
  }catch(e){ toast('El navegador no me dejó leer la carpeta. Usa «Cargar un archivo».'); return 0; }
  S.ultimoBarrido=new Date().toISOString();
  if(nuevos){ snap('leer barridos');
    if(S.autoAplicar!==false){ const r=procesarAuto();
      toast(archivos+' barrido(s) · '+nuevos+' leídos · '+resumenAuto(r)); }
    else toast(archivos+' barrido(s) · '+nuevos+' correo(s) nuevo(s)');
    save(); }
  else toast(archivos?'Sin correos nuevos':'La carpeta correos está vacía');
  return nuevos;
}


/* ============================================================
   PROCESO AUTOMÁTICO
   Se aplica solo lo que no requiere criterio: fechas de contacto,
   bitácora y cierre de esperas. Lo que exige decidir —una cuenta
   desconocida, un folio que no existe— queda esperándote.
   ============================================================ */
function esInterno(m){
  const dom=d=>String(d||'').split('@')[1]||'';
  const todos=[m.de,...(m.para||[])].map(dom).filter(Boolean);
  return todos.length>0&&todos.every(d=>INTERNOS.includes(d));
}
function procesarAuto(){
  const res={aplicados:0,descartados:0,quedan:0,cotiz:0};
  const pend=[...(S.correos||[])];
  pend.forEach(m=>{
    const p=propuesta(m);
    if(p.nuevos.length){ res.cotiz++; return; }              // folio nuevo: decide él
    if(p.cuenta){ aplicarCorreo(m,p); res.aplicados++; return; }
    if(S.autoDescartarInternos&&esInterno(m)&&!p.folios.length){ descartarCorreo(m); res.descartados++; return; }
  });
  res.quedan=(S.correos||[]).length;
  return res;
}
function resumenAuto(r){
  const p=[];
  if(r.aplicados)p.push(r.aplicados+' aplicados');
  if(r.descartados)p.push(r.descartados+' internos descartados');
  if(r.cotiz)p.push(r.cotiz+' con folio sin registrar');
  if(r.quedan)p.push(r.quedan+' esperando tu decisión');
  return p.join(' · ')||'nada que hacer';
}


/* qué propone el panel para cada correo */
function propuesta(m){
  const c=cuentaPorCorreo(m.dir==='out'?m.para:[m.de]);
  const folios=foliosEn(m.asunto+' '+m.resumen);
  const cots=folios.map(f=>S.cotizaciones.find(q=>q.folio===f)).filter(Boolean);
  const nuevos=folios.filter(f=>!S.cotizaciones.some(q=>q.folio===f));
  const esperando=c?abiertas(c.nombre).filter(t=>t.tipo==='esperando'&&
    (!t.folio||folios.includes(t.folio))):[];
  return {cuenta:c,folios,cots,nuevos,esperando};
}
function aplicarCorreo(m,p){
  const c=p.cuenta; if(!c)return false;
  if(m.dir==='out'){ if((c.ultMio||'')<m.fecha){c.ultMio=m.fecha;c.hablo='Benjamín';} }
  else { if((c.ultSuyo||'')<m.fecha){c.ultSuyo=m.fecha;c.hablo='cliente';}
    if(['NUNCA CONTACTADO','SIN DATOS DE CONTACTO','CONTACTADO SIN RESPUESTA'].includes(c.canal))c.canal='EN NEGOCIACIÓN'; }
  logB(c.nombre,'correo',(m.dir==='out'?'Enviado: ':'Recibido de '+m.de+': ')+m.asunto,m.fecha);
  if(m.dir==='in')p.esperando.forEach(t=>{ t.hecha=true; t.hechaTs=m.fecha;
    logB(c.nombre,'tarea','Cerrada por respuesta del cliente: '+t.texto,m.fecha); });
  S.vistos=S.vistos||[]; S.vistos.push(m.id);
  S.correos=S.correos.filter(x=>x.id!==m.id);
  return true;
}
function descartarCorreo(m){
  S.vistos=S.vistos||[]; S.vistos.push(m.id);
  S.correos=S.correos.filter(x=>x.id!==m.id);
}

  ap(mt,ico,el('span',{},fdate(m.fecha)),

  p.cots.forEach(q=>ap(mt,el('button',{class:'lk mo',style:'font-size:11px',
    onclick:()=>{UI.openCot=q.qid;if(q.proyecto)irA({v:'proyecto',id:q.proyecto});else abrir(q.cuenta,'proyectos');}},folioRev(q))));
  p.nuevos.forEach(f=>ap(mt,pill('r',f+' no registrada')));
  bd.append(mt);
  if(m.resumen)bd.append(el('div',{class:'tx2',style:'margin-top:4px;max-width:760px'},
    m.resumen.slice(0,220)+(m.resumen.length>220?'…':'')));
  if(p.cuenta){
    const acc=[];
    acc.push(m.dir==='out'?'marcar «le escribí» el '+fdate(m.fecha):'marcar «me respondió» el '+fdate(m.fecha));
    acc.push('anotar en la bitácora');
    if(m.dir==='in'&&p.esperando.length)acc.push('cerrar '+p.esperando.length+' tarea(s) de espera');
    bd.append(el('div',{class:'mi',style:'margin-top:4px;color:var(--acc)'},'Al aplicar: '+acc.join(' · ')));

  const ac=el('div',{class:'ac'});

  ap(ac,el('button',{class:'b xs sutil',onclick:()=>mut('descartar correo',()=>descartarCorreo(m))},'Descartar'));
  w.append(ac);
  return w;
}

/* un correo puede generar un seguimiento aunque no sea de ningún cliente:
   un pedido de Diego, un aviso de Williams, algo que dijo Fernando */
async function agendarDesdeCorreo(m,p){
  const sug=String(m.asunto||'').replace(/^(re|rv|fwd?|rd)\s*:\s*/i,'').trim().slice(0,90);
  const quien=m.dir==='out'?(m.para[0]||''):m.de;
  const r=await ask('Agendar a partir de este correo',[
    {k:'texto',label:'Qué hay que hacer',value:(m.dir==='out'?'Seguimiento: ':'Responder: ')+sug},
    {k:'cuenta',label:'Cuenta (déjalo en interno si no es de un cliente)',type:'select',
     options:opcionesCuenta(),value:p&&p.cuenta?p.cuenta.nombre:SIN_CUENTA},
    {k:'tipo',label:'Tipo',type:'select',options:['mio','esperando'],value:m.dir==='out'?'esperando':'mio'},
    {k:'fecha',label:'Para cuándo',type:'date',value:iso(new Date(HOY.getTime()+2*864e5))},
    {k:'folio',label:'Folio relacionado',value:(p&&p.folios[0])||''},
    {k:'archivar',label:'¿Sacar el correo de la bandeja?',type:'select',options:['Sí','No'],value:'Sí'}],'Agendar');
  if(!r||!r.texto.trim())return;
  mut('agendar desde el correo',()=>{
    nuevaTarea(r.cuenta,r.texto.trim(),r.fecha,r.tipo,r.folio||'');
    const dest=r.cuenta===SIN_CUENTA?'':r.cuenta;
    logB(dest,'correo',(m.dir==='out'?'Enviado a '+quien:'Recibido de '+quien)+': '+m.asunto,m.fecha);
    if(r.archivar==='Sí'){ if(p&&p.cuenta)aplicarCorreo(m,p); else descartarCorreo(m); }
  });
  toast('Agendado'+(r.cuenta===SIN_CUENTA?' como tarea interna':' en '+r.cuenta));
}

async function asignarCuenta(m){
  const dir=m.dir==='out'?(m.para[0]||''):m.de;
  const r=await ask('¿De qué cuenta es este correo?',[
    {k:'cuenta',label:'Cuenta',type:'select',options:['— ninguna, descartar —',...activas().map(c=>c.nombre)],value:'— ninguna, descartar —'},
    {k:'guardar',label:'¿Guardar '+dir+' como contacto de esa cuenta?',type:'select',options:['Sí','No'],value:'Sí'}],'Asignar');
  if(!r)return;
  if(r.cuenta.startsWith('—')){ mut('descartar correo',()=>descartarCorreo(m)); return; }
  mut('asignar cuenta al correo',()=>{
    if(r.guardar==='Sí'&&dir&&!S.contactos.some(x=>(x.email||'').toLowerCase()===dir))
      S.contactos.push({pid:uid(),cuenta:r.cuenta,nombre:dir.split('@')[0].replace(/[._]/g,' '),
        cargo:'',email:dir,tel:'',rol:'Influye',nota:'Detectado en el barrido de correo del '+fdate(m.fecha)});
    aplicarCorreo(m,{...propuesta(m),cuenta:cuenta(r.cuenta),esperando:abiertas(r.cuenta).filter(t=>t.tipo==='esperando')});
  });
  toast('Aplicado a '+r.cuenta);
}

/* ============================================================
   IMPORTADOR EN BLOQUE
   Una sola entrada de datos para todo: cuentas, personas, proyectos,
   cotizaciones con sus líneas y condiciones, tareas y notas.
   Siempre con vista previa antes de tocar nada, y siempre reversible.
   Pensado para que un asistente genere el lote y tú solo lo revises.
   ============================================================ */
const OPS=['cuenta','contacto','proyecto','cotizacion','tarea','nota','ejecucion'];

function normalizarLote(txt){
  let j;
  try{ j=JSON.parse(txt); }
  catch(e){ throw new Error('No es JSON válido: '+e.message); }
  if(Array.isArray(j))j={operaciones:j};
  if(!j||!Array.isArray(j.operaciones))throw new Error('Falta la lista "operaciones".');
  const malas=j.operaciones.filter(o=>!o||!OPS.includes(o.op));
  if(malas.length)throw new Error(malas.length+' operación(es) con "op" desconocido. Válidos: '+OPS.join(', '));
  return j;
}

/* qué haría cada operación, sin ejecutarla */
function planLote(j){
  const plan=[], nuevasCuentas=new Set(), nuevosProy=new Set();
  const existeCuenta=n=>!!cuenta(n)||nuevasCuentas.has(norm(n));
  const existeProy=(cn,n)=>S.proyectos.some(p=>p.cuenta===cn&&norm(p.nombre)===norm(n))||nuevosProy.has(norm(cn)+'|'+norm(n));
  j.operaciones.forEach((o,i)=>{
    const r={i,op:o.op,accion:'',detalle:'',aviso:''};
    if(o.op==='cuenta'){
      r.accion=existeCuenta(o.nombre)?'actualiza':'crea';
      r.detalle=o.nombre; nuevasCuentas.add(norm(o.nombre));
    }
    if(o.op==='contacto'){
      const ya=S.contactos.some(p=>p.cuenta===o.cuenta&&norm(p.nombre)===norm(o.nombre));
      r.accion=ya?'actualiza':'crea'; r.detalle=o.nombre+' → '+o.cuenta;
      if(!existeCuenta(o.cuenta))r.aviso='la cuenta no existe todavía';
    }
    if(o.op==='proyecto'){
      r.accion=existeProy(o.cuenta,o.nombre)?'actualiza':'crea';
      r.detalle=o.nombre+' → '+o.cuenta; nuevosProy.add(norm(o.cuenta)+'|'+norm(o.nombre));
      if(!existeCuenta(o.cuenta))r.aviso='la cuenta no existe todavía';
    }
    if(o.op==='cotizacion'){
      const q=S.cotizaciones.find(x=>x.folio===o.folio&&(!o.cuenta||x.cuenta===o.cuenta));
      r.accion=q?'actualiza':'crea';
      const n=(o.lineas||[]).reduce((a,l)=>a+(Number(l.kg)||0)*(Number(l.precioKg)||0)+(Number(l.monto)||0),0);
      r.detalle=o.folio+' · '+(o.cuenta||'?')+(n?' · '+money(n):'');
      if(o.neto&&n&&Math.abs(o.neto-n)>Math.max(1000,o.neto*0.005))
        r.aviso='el neto declarado ('+money(o.neto)+') no cuadra con las líneas ('+money(n)+')';
      if(!o.lineas||!o.lineas.length)r.aviso=(r.aviso?r.aviso+' · ':'')+'sin líneas de producto';
      const dup=S.cotizaciones.filter(x=>x.folio===o.folio).length;
      if(dup&&!q)r.aviso=(r.aviso?r.aviso+' · ':'')+'ese folio ya existe en otra cuenta';
    }
    if(o.op==='tarea'){ r.accion='crea'; r.detalle=String(o.texto||'').slice(0,64)+' → '+o.cuenta; }
    if(o.op==='nota'){ r.accion='crea'; r.detalle=String(o.texto||'').slice(0,64)+' → '+o.cuenta; }
    if(o.op==='ejecucion'){
      const q=S.cotizaciones.find(x=>x.folio===o.folio);
      r.accion=q?'actualiza':'no aplica'; r.detalle=o.folio+' → '+(o.estado||'');
      if(!q)r.aviso='no existe esa cotización';
    }
    plan.push(r);
  });
  return plan;
}

function ejecutarLote(j){
  const res={creados:0,actualizados:0,omitidos:0};
  const pick=(o,ks)=>{const x={};ks.forEach(k=>{if(o[k]!==undefined)x[k]=o[k];});return x;};
  j.operaciones.forEach(o=>{
    if(o.op==='cuenta'){
      let c=cuenta(o.nombre);
      if(!c){
        const ids=S.cuentas.map(x=>+String(x.id).replace(/\D/g,'')||0);
        c={cid:uid(),id:o.id||('C'+String(Math.max(0,...ids)+1).padStart(2,'0')),nombre:o.nombre,seg:'',tipo:'Constructora',
          grupo:'',contacto:'',cargo:'',email:'',tel:'',ultMio:'',ultSuyo:'',hablo:'nadie',
          canal:'NUNCA CONTACTADO',prio:'B - Media',notas:'',archivada:false};
        S.cuentas.push(c); res.creados++;
      } else res.actualizados++;
      Object.assign(c,pick(o,['seg','tipo','grupo','contacto','cargo','email','tel','canal','prio','notas','ultMio','ultSuyo','hablo']));
    }
    if(o.op==='contacto'){
      let p=S.contactos.find(x=>x.cuenta===o.cuenta&&norm(x.nombre)===norm(o.nombre));
      if(!p){ p={pid:uid(),cuenta:o.cuenta,nombre:o.nombre,cargo:'',email:'',tel:'',rol:'Influye',nota:''};
        S.contactos.push(p); res.creados++; } else res.actualizados++;
      Object.assign(p,pick(o,['cargo','email','tel','rol','nota']));
    }
    if(o.op==='proyecto'){
      let p=S.proyectos.find(x=>x.cuenta===o.cuenta&&norm(x.nombre)===norm(o.nombre));
      if(!p){ p={pid:uid(),cuenta:o.cuenta,nombre:o.nombre,comuna:'',direccion:'',mandante:'',
        estado:'Activo',inicio:'',notas:'',lat:'',lng:''}; S.proyectos.push(p); res.creados++; }
      else res.actualizados++;
      Object.assign(p,pick(o,['comuna','direccion','mandante','estado','inicio','notas','lat','lng']));
    }
    if(o.op==='cotizacion'){
      let pr=o.proyecto?S.proyectos.find(x=>x.cuenta===o.cuenta&&norm(x.nombre)===norm(o.proyecto)):null;
      if(!pr&&o.proyecto){ pr={pid:uid(),cuenta:o.cuenta,nombre:o.proyecto,comuna:o.comuna||'',direccion:'',
        mandante:'',estado:'Activo',inicio:'',notas:'',lat:'',lng:''}; S.proyectos.push(pr); res.creados++; }
      let q=S.cotizaciones.find(x=>x.folio===o.folio&&(!o.cuenta||x.cuenta===o.cuenta));
      if(!q){
        q={qid:uid(),folio:o.folio,rev:o.rev||0,versiones:[],fecha:o.fecha||iso(HOY),cuenta:o.cuenta,
          proyecto:pr?pr.pid:'',obra:o.obra||'',contacto:o.contacto||'',email:o.emailContacto||'',
          emailContacto:o.emailContacto||'',rut:o.rut||'',producto:'',neto:0,kg:null,validez:o.validez||'',
          estado:o.estado||'Enviada',prob:null,probManual:false,oc:o.oc||'',nota:o.nota||'',cierre:o.cierre||'',
          motivoPerdida:'',lineas:[],cond:JSON.parse(JSON.stringify(COND_DEF)),ejecucion:'',
          hitos:{oc:'',ingreso:'',programa:'',despacho:'',entrega:'',factura:''},
          ingreso:{calendario:'',precioKilo:null,direccion:'',contactoObra:'',segmento:'',camiones:''},incidencias:[]};
        S.cotizaciones.unshift(q); res.creados++;
      } else res.actualizados++;
      Object.assign(q,pick(o,['fecha','obra','contacto','emailContacto','rut','validez','estado','oc','nota','cierre','rev']));
      if(pr)q.proyecto=pr.pid;
      if(o.lineas&&o.lineas.length){
        q.lineas=o.lineas.map(l=>({id:uid(),familia:l.familia||'Otro',producto:l.producto||'',
          kg:l.kg??null,precioKg:l.precioKg??null,monto:l.monto??null}));
        recalcNeto(q);
      }
      if(o.neto!==undefined&&(!o.lineas||!o.lineas.length))q.neto=Number(o.neto)||0;
      if(o.kg!==undefined&&(!o.lineas||!o.lineas.length))q.kg=o.kg;
      if(o.cond)Object.assign(q.cond,o.cond);
      if(o.ingreso)Object.assign(q.ingreso,o.ingreso);
    }
    if(o.op==='tarea'){
      nuevaTarea(o.cuenta,o.texto,o.fecha||iso(HOY),o.tipo||'mio',o.folio||''); res.creados++;
    }
    if(o.op==='nota'){ logB(o.cuenta,o.tipo||'nota',o.texto,o.ts); res.creados++; }
    if(o.op==='ejecucion'){
      const q=S.cotizaciones.find(x=>x.folio===o.folio);
      if(!q){ res.omitidos++; return; }
      if(o.estado)q.ejecucion=o.estado;
      if(o.hitos)Object.assign(q.hitos,o.hitos);
      if(o.ingreso)Object.assign(q.ingreso,o.ingreso);
      if(o.oc)q.oc=o.oc;
      res.actualizados++;
    }
  });
  return res;
}

function vistaLote(){

    const crea=plan.filter(p=>p.accion==='crea').length, act=plan.filter(p=>p.accion==='actualiza').length;
    const avisos=plan.filter(p=>p.aviso);

      pill('v',crea+' se crean'),pill('a',act+' se actualizan'),

      j.descripcion?el('span',{class:'mi'},j.descripcion):null));

    const tb=el('tbody');
    plan.forEach(p=>tb.append(el('tr',{style:'cursor:default'},

      el('td',{},p.aviso?el('span',{class:'tx2',style:'color:var(--ojo)'},p.aviso):''))));
    t.append(tb);

    bAplicar.disabled=false; bAplicar.dataset.listo='1';
  }},'Ver qué haría');
  const bAplicar=el('button',{class:'b pri',disabled:'true',onclick:()=>{
    let j; try{ j=normalizarLote(ta.value); }catch(e){ toast(e.message); return; }
    const r=ejecutarLote2(j);
    cerrar();
    toast(r.creados+' creados · '+r.actualizados+' actualizados'+(r.omitidos?' · '+r.omitidos+' omitidos':''),['Deshacer',undo]);
  }},'Aplicar');
  const bPegar=el('button',{class:'b',onclick:async()=>{
    try{ ta.value=await navigator.clipboard.readText(); bVer.click(); }
    catch(e){ toast('El navegador no me deja leer el portapapeles. Pega con Ctrl+V.'); ta.focus(); }
  }},'Pegar del portapapeles');
  pie.append(bPegar,bCerrar,bVer,bAplicar);
  mo.append(pie);
  ta.addEventListener('input',()=>{bAplicar.disabled=true;});

}

/* ============ PALETA DE COMANDOS ============
   La superficie completa del sistema vive acá: toda acción es alcanzable
   escribiendo. La barra visible se queda con cinco cosas. */
function cmdk(){
  if(document.querySelector('.pal'))return;
  const cerrar=()=>{sc.remove();box.remove();};
  const sc=el('div',{class:'velo',style:'z-index:74',onclick:cerrar});
  const box=el('div',{class:'pal'});
  const inp=el('input',{placeholder:'Buscar una cuenta, folio o persona… o escribe una acción'});
  const rs=el('div',{class:'rs'});
  box.append(inp,rs,el('div',{class:'pi'},'↑↓ moverse · Enter abrir · Esc cerrar'));
  let items=[],sel=0;
  const acciones=()=>{
    const cn=UI.ruta.v==='cuenta'?UI.ruta.id:null;
    return [
      {k:'crear',n:'Cuenta nueva',s:'',go:crearCuenta},
      {k:'crear',n:'Proyecto nuevo',s:cn?'en '+cn:'',go:()=>crearProyecto(cn)},
      {k:'crear',n:'Cotización nueva',s:cn?'en '+cn:'',go:()=>crearCotizacion(cn)},
      {k:'crear',n:'Persona nueva',s:cn?'en '+cn:'',go:()=>crearContacto(cn)},
      {k:'crear',n:'Agendar una tarea',s:cn?'en '+cn:'para hoy',go:()=>agendarEn(iso(HOY),cn)},
      {k:'crear',n:'Tarea interna',s:'sin cuenta asociada',go:()=>agendarEn(iso(HOY),SIN_CUENTA)},
      {k:'crear',n:'Reservar el folio siguiente',s:'para cotizar fuera del panel',
       go:()=>reservarFolio(numFolio(siguienteFolioLibre()))},
      {k:'ir a',n:'Hoy',s:'la jornada',go:()=>{UI.horizonte='dia';irA({v:'hoy'});}},
      {k:'ir a',n:'Agenda de la semana',s:'tareas, vigencias y cierres',go:()=>{UI.horizonte='semana';irA({v:'hoy'});}},
      {k:'ir a',n:'Calendario del mes',s:'todo lo que se viene',go:()=>{UI.horizonte='mes';irA({v:'hoy'});}},
      {k:'ir a',n:'Cartera',s:'cuentas, proyectos, embudo y personas',go:()=>irA({v:'cartera'})},
      {k:'ir a',n:'Números',s:'gráficos y salud del dato',go:()=>irA({v:'numeros'})},
      {k:'ir a',n:'Bandeja',s:'correos por revisar',go:()=>irA({v:'bandeja'})},
      {k:'ir a',n:'Cotizar',s:'el cotizador ACMA',go:()=>abrirCotizador(cn?{cuenta:cn}:null)},
      {k:'vista',n:'Tabla de cuentas',s:'',go:()=>{UI.vista='tabla';irA({v:'cartera'});}},
      {k:'vista',n:'Malla de la cartera',s:'',go:()=>{UI.vista='malla';irA({v:'cartera'});}},
      {k:'vista',n:'Embudo de cotizaciones',s:'',go:()=>{UI.vista='embudo';irA({v:'cartera'});}},
      {k:'vista',n:'Todos los proyectos',s:'',go:()=>{UI.vista='proyectos';irA({v:'cartera'});}},
      {k:'vista',n:'Mapa de personas',s:'',go:()=>{UI.vista='personas';irA({v:'cartera'});}},
      {k:'vista',n:'Registro de folios',s:'cuál sigue, cuáles chocan, cuáles faltan',go:()=>{UI.vista='folios';irA({v:'cartera'});}},
      {k:'vista',n:UI.densidad==='compacta'?'Filas cómodas':'Filas compactas',s:'',
       go:()=>{UI.densidad=UI.densidad==='compacta'?'comoda':'compacta';render();}},
      {k:'filtro',n:'Solo prioridad A',s:'',go:()=>{UI.fA={prio:'A - Alta',canal:'',seg:'',txt:'',arch:false};UI.vista='tabla';irA({v:'cartera'});}},
      {k:'filtro',n:'Nunca contactadas',s:'',go:()=>{UI.fA={prio:'',canal:'NUNCA CONTACTADO',seg:'',txt:'',arch:false};UI.vista='tabla';irA({v:'cartera'});}},
      {k:'datos',n:'Buscar barridos de correo nuevos',s:'lee Cartera BB/correos',go:()=>leerBarridos().then(()=>render())},
      {k:'datos',n:'Aplicar cambios en bloque',s:'pegar un JSON de operaciones',go:vistaLote},
      {k:'datos',n:'Descargar respaldo en Excel',s:'',go:descargarRespaldo},
      {k:'datos',n:'Guardar ahora en la carpeta',s:'',go:()=>guardarEnCarpeta().then(()=>toast('Guardado'))},
      {k:'datos',n:'Deshacer el último cambio',s:UNDO.length?UNDO[UNDO.length-1].d:'nada que deshacer',go:undo},
      {k:'datos',n:'Cambiar de carpeta',s:DIR?DIR.name:'sin carpeta',
       go:async()=>{if(await elegirCarpeta()){await guardarEnCarpeta();toast('Ahora se guarda en '+DIR.name);render();}}}
    ];
  };
  const pinta=()=>{
    const n=norm(inp.value);
    items=[];
    if(n){
      S.cuentas.filter(c=>norm(c.nombre+c.contacto+c.id).includes(n)).slice(0,6)
        .forEach(c=>items.push({k:'cuenta',n:c.nombre,s:[c.canal,c.prio].filter(Boolean).join(' · '),go:()=>abrir(c.nombre,'resumen')}));
      S.proyectos.filter(p=>norm(p.nombre+p.cuenta+p.comuna).includes(n)).slice(0,5)
        .forEach(p=>items.push({k:'proyecto',n:p.nombre,s:p.cuenta+(p.comuna?' — '+p.comuna:''),
          go:()=>{UI.openProy=p.pid;abrir(p.cuenta,'proyectos');}}));
      S.cotizaciones.filter(q=>norm(q.folio+q.cuenta+q.obra+(q.oc||'')).includes(n)).slice(0,6)
        .forEach(q=>items.push({k:'cotiz',n:folioRev(q)+' · '+money(q.neto),s:q.cuenta+' — '+q.obra,
          go:()=>{UI.openProy=q.proyecto;UI.openCot=q.qid;abrir(q.cuenta,'proyectos');}}));
      S.contactos.filter(p=>norm(p.nombre+p.cuenta).includes(n)).slice(0,4)
        .forEach(p=>items.push({k:'persona',n:p.nombre,s:p.cuenta+(p.cargo?' — '+p.cargo:''),go:()=>abrir(p.cuenta,'personas')}));
      S.tareas.filter(t=>!t.hecha&&norm(t.texto+(t.cuenta||'interno')).includes(n)).slice(0,5)
        .forEach(t=>items.push({k:'tarea',n:t.texto,s:(esInterna(t)?'interna':t.cuenta)+' · '+fdate(t.fecha),
          go:()=>esInterna(t)?irA({v:'hoy'}):abrir(t.cuenta,'tareas')}));
      acciones().filter(a=>norm(a.n+a.k).includes(n)).slice(0,6).forEach(a=>items.push(a));
    } else items=acciones();
    sel=0; dibuja();
  };
  const dibuja=()=>{
    rs.innerHTML='';
    items.forEach((it,i)=>rs.append(el('div',{class:'it','aria-selected':i===sel?'true':'false',
      onclick:()=>{cerrar();it.go();}},el('span',{class:'k'},it.k),
      el('span',{},el('span',{class:'n'},it.n),it.s?el('div',{class:'s'},it.s):null))));
    if(!items.length)rs.append(el('div',{class:'vac'},el('div',{class:'vt'},'Sin resultados'),
      el('div',{class:'vd'},'Prueba con parte del nombre, un folio, o el nombre de la obra.')));
    const act=rs.querySelector('[aria-selected="true"]'); if(act)act.scrollIntoView({block:'nearest'});
  };
  inp.addEventListener('input',pinta);
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,items.length-1);dibuja();}
    if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);dibuja();}
    if(e.key==='Enter'&&items[sel]){e.preventDefault();cerrar();items[sel].go();}
    if(e.key==='Escape')cerrar();});
  document.body.append(sc,box); pinta(); inp.focus();
}

/* ============ ARRANQUE ============ */
async function boot(){
  UI.ruta=leerRuta();
  if(soporta()){
    const h=await getH();
    if(h){ if(await permiso(h,false)){ DIR=h; const t=await leerTexto(F_JSON);
      if(t){ try{ S=migrar(JSON.parse(t)); flag('carpeta '+h.name); await escanearArchivo(); }catch(e){} } } else PEND=h; }
  }
  render();
}
document.addEventListener('keydown',e=>{
  const enCampo=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(S)cmdk();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!enCampo){e.preventDefault();if(S)undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(S)guardarEnCarpeta().then(()=>toast('Guardado'));return;}
  if(enCampo||!S)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();crearCuenta();}
  if(e.key==='/'){e.preventDefault();cmdk();}
  if(e.key==='1'){UI.horizonte='dia';irA({v:'hoy'});}
  if(e.key==='a'||e.key==='A'){e.preventDefault();UI.horizonte=UI.horizonte==='mes'?'dia':'mes';irA({v:'hoy'});} if(e.key==='2'){irA({v:'cartera'});}
  if(e.key==='3'){irA({v:'bandeja'});} if(e.key==='4'){irA({v:'numeros'});} if(e.key==='5'){irA({v:'cotizar'});}
});
window.addEventListener('beforeunload',()=>{ if(saveT)guardarEnCarpeta(); });
boot();
