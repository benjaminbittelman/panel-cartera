<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de cartera — KAM Benjamín Bittelman · ACMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6EAEF; --panel:#FFFFFF; --panel-2:#F4F6F9;
  --ink:#11161C; --ink2:#4C5766; --ink3:#7C8798;
  --rule:#C7CFDA; --rule2:#DFE4EB;
  --plano:#173A5E; --plano2:#2C6394; --plano-soft:#E3ECF5;
  --hivis:#E3A008; --hivis-soft:#FDF3D8;
  --oxido:#B33F17; --oxido-soft:#FBE7DE;
  --verde:#1C6E52; --verde-soft:#DFF0E8;
  --disp:'Archivo Narrow','Arial Narrow',system-ui,sans-serif;
  --body:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--plano2);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1600px;margin:0 auto;padding:0 18px 70px}
header.top{position:sticky;top:0;z-index:40;background:var(--plano);color:#fff;margin:0;padding:0 18px;border-bottom:3px solid var(--hivis)}
.top-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 0 8px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.07em;opacity:.72;text-transform:none;margin-top:3px}
.top-spacer{flex:1}
.search{position:relative}
.search input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:var(--r);padding:7px 10px 7px 28px;width:230px;font-family:var(--mono);font-size:12px}
.search input::placeholder{color:rgba(255,255,255,.6)}
.search svg{position:absolute;left:8px;top:8px;opacity:.7}
.top-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;padding:7px 11px;border-radius:var(--r);font-size:12px}
.top-btn:hover{background:rgba(255,255,255,.22)}
.top-btn:disabled{opacity:.35;cursor:default}
.saved{font-family:var(--mono);font-size:10.5px;opacity:.75;letter-spacing:.03em;min-width:92px;text-align:right}
nav.tabs{display:flex;overflow-x:auto;border-top:1px solid rgba(255,255,255,.16)}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.68);padding:9px 14px 8px;font-family:var(--disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-current="true"]{color:#fff;border-bottom-color:var(--hivis)}
nav.tabs .cnt{font-family:var(--mono);font-size:10px;opacity:.7;margin-left:5px}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r)}
.card>h3{margin:0;padding:9px 12px;border-bottom:1px solid var(--rule2);font-family:var(--disp);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .n{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--rule2);padding:1px 6px;border-radius:20px;color:var(--ink)}
.card>h3 .hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink3);font-family:var(--body)}
.card>h3 .sp{flex:1}
.grid{display:grid;gap:14px}
.sec{margin-top:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--plano);border-radius:var(--r);padding:10px 12px}
.kpi.warn{border-left-color:var(--hivis)} .kpi.bad{border-left-color:var(--oxido)} .kpi.good{border-left-color:var(--verde)}
.kpi .lab{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi .sub{font-size:11.5px;color:var(--ink2);margin-top:1px}

.pill{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.04em;padding:1.5px 6px;border-radius:20px;border:1px solid;white-space:nowrap}
.p-red{background:var(--oxido-soft);border-color:#E8B9A5;color:var(--oxido)}
.p-yel{background:var(--hivis-soft);border-color:#E8D294;color:#8A6407}
.p-blu{background:var(--plano-soft);border-color:#B9CFE4;color:var(--plano)}
.p-grn{background:var(--verde-soft);border-color:#A9D2C1;color:var(--verde)}
.p-gry{background:var(--panel-2);border-color:var(--rule2);color:var(--ink3)}

.row{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--rule2);align-items:flex-start}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:13px}
.row .d{color:var(--ink2);font-size:12px;margin-top:1px}
.row .acts{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.mini{background:var(--panel-2);border:1px solid var(--rule);border-radius:var(--r);padding:3px 7px;font-size:11px;color:var(--ink2)}
.mini:hover{background:var(--plano);color:#fff;border-color:var(--plano)}
.mini.k{background:var(--plano);color:#fff;border-color:var(--plano)}
.mini.k:hover{background:var(--plano2)}
.mini.dgr:hover{background:var(--oxido);border-color:var(--oxido)}
a.mini{display:inline-block;text-decoration:none}
.datebar{font-family:var(--mono);font-size:11px;color:var(--ink3);min-width:60px;padding-top:2px}

.malla-wrap{padding:0}
.malla{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:1px;background:var(--rule);padding:1px}
.nodo{background:var(--panel);padding:7px 8px 8px;text-align:left;border:0;position:relative;min-height:62px;display:flex;flex-direction:column;justify-content:space-between}
.nodo:hover{z-index:2;box-shadow:0 0 0 2px var(--plano)}
.nodo .id{font-family:var(--mono);font-size:9.5px;color:var(--ink3);letter-spacing:.04em}
.nodo .nm{font-family:var(--disp);font-size:11.5px;font-weight:600;line-height:1.15;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nodo .bar{height:3px;margin-top:6px;background:var(--rule2);border-radius:2px}
.nodo[data-u="3"]{background:var(--oxido-soft)} .nodo[data-u="3"] .bar{background:var(--oxido)}
.nodo[data-u="2"]{background:var(--hivis-soft)} .nodo[data-u="2"] .bar{background:var(--hivis)}
.nodo[data-u="1"]{background:var(--panel)} .nodo[data-u="1"] .bar{background:var(--plano2)}
.nodo[data-u="0"]{background:var(--panel-2)} .nodo[data-u="0"] .bar{background:var(--rule)}
.nodo .prioA{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--plano)}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;padding:8px 12px;border-top:1px solid var(--rule2);font-size:11.5px;color:var(--ink2)}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tablewrap{overflow:auto;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{position:sticky;top:0;z-index:3;background:var(--panel-2);text-align:left;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer}
th.nosort{cursor:default}
th .arrow{color:var(--plano2)}
td{padding:5px 9px;border-bottom:1px solid var(--rule2);vertical-align:top}
tbody tr:hover{background:var(--panel-2)}
tbody tr.sel{background:var(--plano-soft)}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
td.mono{font-family:var(--mono);white-space:nowrap}
.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkish{color:var(--plano);text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;text-align:left;font-weight:600}
.chk{width:14px;height:14px;accent-color:var(--plano);cursor:pointer}

.ed{border-bottom:1px dashed var(--ink3);cursor:text;display:inline-block;min-width:16px;min-height:17px}
.ed:hover{background:var(--hivis-soft)}
.ed.empty::after{content:'—';color:var(--ink3)}
.ed.blk{display:block}
input.inline,select.inline,textarea.inline{border:1px solid var(--plano2);border-radius:2px;padding:2px 4px;font-family:var(--mono);font-size:12px;width:100%;background:#fff}
textarea.inline{font-family:var(--body);min-height:64px;resize:vertical}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:9px 12px;border-bottom:1px solid var(--rule2);background:var(--panel-2)}
.filters select,.filters input{border:1px solid var(--rule);border-radius:var(--r);padding:5px 7px;background:#fff;font-size:12px}
.chip{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--plano);color:#fff;border-color:var(--plano)}
.bulk{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--plano);color:#fff;font-size:12px}
.bulk .mini{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.bulk .mini:hover{background:#fff;color:var(--plano)}

.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:10px;align-items:start}
.col{background:var(--panel-2);border:1px solid var(--rule);border-radius:var(--r);min-height:110px}
.col.over{border-color:var(--plano);box-shadow:0 0 0 2px var(--plano-soft)}
.col h4{margin:0;padding:8px 10px;font-family:var(--disp);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--rule2);display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.col h4 span{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-transform:none;letter-spacing:0}
.kcard{background:#fff;border:1px solid var(--rule);border-left:3px solid var(--plano2);border-radius:var(--r);margin:7px;padding:8px 9px;cursor:grab}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.4}
.kcard .f{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.kcard .c{font-family:var(--disp);font-weight:600;font-size:13px;line-height:1.2;margin:1px 0 2px}
.kcard .o{font-size:11.5px;color:var(--ink2);line-height:1.25}
.kcard .m{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-top:4px}
.kcard.venc{border-left-color:var(--oxido)} .kcard.pronto{border-left-color:var(--hivis)}

.scrim{position:fixed;inset:0;background:rgba(17,22,28,.42);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--panel);z-index:51;display:flex;flex-direction:column;border-left:3px solid var(--hivis);box-shadow:-12px 0 34px rgba(17,22,28,.2)}
.drawer .dh{padding:12px 16px 0;border-bottom:1px solid var(--rule);background:var(--plano);color:#fff;position:relative}
.drawer .dh h2{margin:0;font-family:var(--disp);font-size:18px;letter-spacing:.02em;line-height:1.15;padding-right:36px}
.drawer .dh .meta{font-family:var(--mono);font-size:11px;opacity:.8;margin-top:3px}
.drawer .db{overflow:auto;padding:14px 16px 30px;flex:1}
.closeb{position:absolute;top:11px;right:13px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--r);width:28px;height:28px;line-height:1}
.tt{display:flex;gap:0;margin-top:9px;overflow-x:auto}
.tt button{background:none;border:0;color:rgba(255,255,255,.65);padding:7px 11px 7px;font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
.tt button[aria-current="true"]{color:#fff;border-bottom-color:var(--hivis)}
.tt .cnt{font-family:var(--mono);font-size:9.5px;opacity:.7;margin-left:4px}
.dsec{margin-bottom:16px}
.dsec>h4{margin:0 0 6px;font-family:var(--disp);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule2);padding-bottom:3px;display:flex;gap:8px;align-items:center}
.dsec>h4 .sp{flex:1}
.kv{display:grid;grid-template-columns:132px 1fr;gap:4px 10px;font-size:12.5px;align-items:start}
.kv dt{color:var(--ink3);font-size:11.5px;padding-top:1px}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-word}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tl{border-left:2px solid var(--rule);padding-left:12px;margin-left:4px}
.tl .e{position:relative;padding-bottom:11px}
.tl .e::before{content:'';position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--plano2);border:2px solid var(--panel)}
.tl .ts{font-family:var(--mono);font-size:10.5px;color:var(--ink3);display:flex;gap:7px;align-items:center}
.tl .tx{font-size:12.5px;white-space:pre-wrap}
textarea.note{width:100%;border:1px solid var(--rule);border-radius:var(--r);padding:7px;font-size:12.5px;resize:vertical;min-height:54px}

.tsk{display:flex;gap:9px;padding:7px 10px;border-bottom:1px solid var(--rule2);align-items:flex-start}
.tsk:last-child{border-bottom:0}
.tsk:hover{background:var(--panel-2)}
.tsk .bx{margin-top:2px}
.tsk .tb{flex:1;min-width:0}
.tsk .tx{font-size:12.5px;line-height:1.35}
.tsk.done .tx{text-decoration:line-through;color:var(--ink3)}
.tsk .mt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addbar{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--rule2);background:var(--panel-2);flex-wrap:wrap}
.addbar input,.addbar select{border:1px solid var(--rule);border-radius:var(--r);padding:5px 7px;font-size:12px;background:#fff}
.addbar input.gr{flex:1;min-width:150px}

.lin{width:100%;font-size:12px}
.lin th{position:static;font-size:10px;padding:4px 6px;background:var(--panel-2)}
.lin td{padding:3px 6px}
.lin tfoot td{font-family:var(--mono);font-weight:600;background:var(--panel-2);border-top:1px solid var(--rule)}

.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:14px;margin-top:16px}
.chart{padding:12px 14px 14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
svg text{font-family:var(--body)}
svg .lbl{font-family:var(--disp);font-size:12px;font-weight:600;fill:var(--ink)}
svg .lbl2{font-family:var(--mono);font-size:9.5px;fill:var(--ink3)}
svg .val{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink)}
svg .ax{font-family:var(--mono);font-size:9.5px;fill:var(--ink3)}
svg .grid{stroke:var(--rule2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:9px;font-size:11px;color:var(--ink2);font-family:var(--mono)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mtx{display:grid;gap:1px;background:var(--rule2);border:1px solid var(--rule2);font-size:11.5px}
.mtx>div{background:var(--panel);padding:6px 7px;text-align:center}
.mtx .mh{font-family:var(--disp);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);background:var(--panel-2);line-height:1.2}
.mtx .mr{text-align:left;font-family:var(--disp);font-weight:600;font-size:11.5px;background:var(--panel-2)}
.mtx button{border:0;width:100%;padding:8px 4px;font-family:var(--mono);font-size:14px;font-weight:600;background:none}
.mtx button:hover{outline:2px solid var(--plano);outline-offset:-2px}

.check{display:flex;gap:11px;padding:11px 12px;border-bottom:1px solid var(--rule2);align-items:flex-start}
.check:last-child{border-bottom:0}
.check .sev{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:2px;flex-shrink:0;margin-top:2px}
.sev.alta{background:var(--oxido);color:#fff} .sev.media{background:var(--hivis);color:#3B2B00} .sev.baja{background:var(--rule);color:var(--ink2)}
.check .cb{flex:1}
.check .ct{font-weight:600;font-size:13px}
.check .cw{color:var(--ink2);font-size:12px;margin-top:2px}
.check .cl{font-family:var(--mono);font-size:11.5px;color:var(--plano);margin-top:4px;line-height:1.6}
.check .cl button{background:none;border:0;color:var(--plano);text-decoration:underline;padding:0 6px 0 0;font-family:var(--mono);font-size:11.5px}

.modal{position:fixed;z-index:71;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,92vw);background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--hivis);border-radius:var(--r);box-shadow:0 18px 50px rgba(17,22,28,.32);padding:16px 18px 14px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 12px;font-family:var(--disp);font-size:15px;letter-spacing:.02em;line-height:1.25}
.modal label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:9px;font-family:var(--disp);letter-spacing:.05em;text-transform:uppercase}
.modal input,.modal select,.modal textarea{display:block;width:100%;margin-top:3px;border:1px solid var(--rule);border-radius:var(--r);padding:7px 8px;font-size:13px;font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--ink)}
.modal .mact{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}
.modal .mact .mini{padding:6px 13px;font-size:12.5px}

.cmdk{position:fixed;z-index:75;top:14vh;left:50%;transform:translateX(-50%);width:min(600px,94vw);background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--hivis);border-radius:var(--r);box-shadow:0 20px 60px rgba(17,22,28,.36);overflow:hidden}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--rule2);padding:13px 15px;font-size:15px;font-family:var(--body);outline:none}
.cmdk .res{max-height:52vh;overflow:auto}
.cmdk .it{display:flex;gap:10px;padding:8px 15px;align-items:baseline;cursor:pointer;border-bottom:1px solid var(--rule2)}
.cmdk .it[aria-selected="true"]{background:var(--plano-soft)}
.cmdk .it .k{font-family:var(--mono);font-size:9.5px;color:var(--ink3);text-transform:uppercase;min-width:52px}
.cmdk .it .n{font-weight:600;font-size:13px}
.cmdk .it .s{color:var(--ink2);font-size:11.5px}
.cmdk .ft{padding:7px 15px;font-family:var(--mono);font-size:10.5px;color:var(--ink3);background:var(--panel-2)}

.empty{padding:22px 14px;text-align:center;color:var(--ink3);font-size:12.5px}
.foot{margin-top:22px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--rule);padding-top:10px;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:12.5px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center}
.toast button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--r);padding:2px 9px;font-size:11.5px}
@media(max-width:720px){.kv{grid-template-columns:1fr}.search input{width:140px}.brand{font-size:16px}.dashgrid{grid-template-columns:1fr}}
</style>

<header class="top">
  <div class="top-in">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ utilidades ============ */
const $ = (s,r=document)=>r.querySelector(s);
const el=(t,a={},...k)=>{const n=document.createElement(t);for(const[p,v]of Object.entries(a)){
  if(p==='class')n.className=v;else if(p==='html')n.innerHTML=v;else if(p.startsWith('on'))n.addEventListener(p.slice(2),v);
  else if(v!==null&&v!==undefined&&v!==false)n.setAttribute(p,v);}
  k.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c)));return n;};
const HOY=new Date(); HOY.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return isNaN(x)?'':new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const pd=s=>{if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d;};
const dias=s=>{const d=pd(s);return d===null?null:Math.round((d-HOY)/864e5);};
const money=n=>{n=Math.round(n||0);if(Math.abs(n)>=1e6)return '$'+Math.round(n/1e6).toLocaleString('es-CL')+' M';return '$'+n.toLocaleString('es-CL');};
const num=n=>(n===null||n===undefined||n==='')?'':Math.round(n).toLocaleString('es-CL');
const fdate=s=>{const d=pd(s);if(!d)return '—';return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}).replace('.','');};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const hora=()=>new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});

/* ============ vocabulario ============ */
const ETAPAS=['Por enviar','Por corregir','Enviada','En revisión','En negociación','Adjudicada','Perdida','En pausa','Reemplazada'];
const P_MODELO={'Por enviar':.10,'Por corregir':.15,'Enviada':.25,'En revisión':.35,'En negociación':.50,'Adjudicada':1,'Perdida':0,'En pausa':.10,'Reemplazada':0};
const CANALES=['CLIENTE ACTIVO','EN NEGOCIACIÓN','PUERTA ABIERTA SIN USAR','CONTACTADO SIN RESPUESTA','NUNCA CONTACTADO','SIN DATOS DE CONTACTO'];
const PRIOS=['A - Alta','B - Media','C - Baja'];
const SEGS=['HAB','SOC','INFR','MIX','MIN','OTRO'];
const TIPOS=['Constructora','Inmobiliaria','Inmobiliaria-Constructora','Contratista especialista','Distribuidor / abastecimiento','Revendedor / comercializador','Otro'];
const ROLES=['Decide','Influye','Ejecuta'];
const MOTIVOS=['Precio','Plazo de entrega','Especificación técnica','Competidor directo','Obra suspendida o postergada','Nunca respondieron','Otro'];
const EST_PROY=['En estudio','Activo','Suspendido','Cerrado','Perdido'];
const FAMILIAS=['Malla electrosoldada','Barra / fierro','Alambre','Perfilería steel framing','Cerco Acmanet','Flete','Otro'];
const VIVA=c=>!['Adjudicada','Perdida','Reemplazada'].includes(c.estado);

const TABS=[['hoy','Hoy'],['tareas','Tareas'],['dash','Dashboard'],['malla','Cartera'],['pipeline','Pipeline'],
  ['cuentas','Cuentas'],['proyectos','Proyectos'],['cotizaciones','Cotizaciones'],['cotizador','Cotizador'],['contactos','Personas'],['salud','Salud del dato']];
const VIEWS={};

let S=null, saveT=null, UNDO=[], UI={tab:'hoy',q:'',sortC:{key:'venc',dir:1},sortA:{key:'urg',dir:1},
  fA:{prio:'',canal:'',seg:'',txt:'',arch:false}, fQ:{estado:'',txt:''}, sel:new Set(), open:null, dtab:'ficha', openProy:null, openCot:null};

/* ============ carpeta ============ */
const F_JSON='cartera.json', F_XLSX='respaldo_cartera.xlsx';
let DIR=null, PEND=null;
const soporta=()=>typeof window.showDirectoryPicker==='function';
function flag(t){const n=$('#savedFlag');if(n)n.textContent=t;}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('acma-fs',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function putH(h){try{const db=await idb();await new Promise(r=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(h,'dir');t.oncomplete=r;t.onerror=r;});}catch(e){}}
async function getH(){try{const db=await idb();return await new Promise(r=>{const t=db.transaction('h','readonly');const q=t.objectStore('h').get('dir');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});}catch(e){return null;}}
async function delH(){try{const db=await idb();await new Promise(r=>{const t=db.transaction('h','readwrite');t.objectStore('h').delete('dir');t.oncomplete=r;t.onerror=r;});}catch(e){}}
async function permiso(h,pedir){if(!h)return false;const o={mode:'readwrite'};
  try{if(await h.queryPermission(o)==='granted')return true;if(pedir&&await h.requestPermission(o)==='granted')return true;}catch(e){}return false;}
async function elegirCarpeta(){try{const h=await window.showDirectoryPicker({id:'acma-cartera',mode:'readwrite'});
  if(!await permiso(h,true))return false;DIR=h;PEND=null;await putH(h);return true;}catch(e){return false;}}
async function leerTexto(n){try{const fh=await DIR.getFileHandle(n);return await (await fh.getFile()).text();}catch(e){return null;}}
async function escribir(n,data){const fh=await DIR.getFileHandle(n,{create:true});const w=await fh.createWritable();await w.write(data);await w.close();}
async function guardarEnCarpeta(){
  if(!DIR){flag('sin carpeta');return;}
  try{ await escribir(F_JSON,new Blob([JSON.stringify(S)],{type:'application/json'}));
    try{const b=xlsxBlob();if(b)await escribir(F_XLSX,b);}catch(e){}
    flag('guardado '+hora());
  }catch(e){flag('sin guardar');}
}
function save(){clearTimeout(saveT);saveT=setTimeout(guardarEnCarpeta,700);}

/* ============ deshacer ============ */
function snap(desc){ UNDO.push({d:desc,s:JSON.stringify(S)}); if(UNDO.length>40)UNDO.shift(); }
function undo(){ const u=UNDO.pop(); if(!u){toast('No hay nada que deshacer');return;} S=JSON.parse(u.s); save(); render(); toast('Deshecho: '+u.d); }
function mut(desc,fn){ snap(desc); fn(); save(); render(); }

/* ============ modelo ============ */
const cuenta=n=>S.cuentas.find(c=>c.nombre===n);
const cotsDe=n=>S.cotizaciones.filter(q=>q.cuenta===n);
const contactosDe=n=>S.contactos.filter(c=>c.cuenta===n);
const tareasDe=n=>S.tareas.filter(t=>t.cuenta===n);
const proyectosDe=n=>S.proyectos.filter(p=>p.cuenta===n);
const proyecto=pid=>S.proyectos.find(p=>p.pid===pid);
const cotsDeProy=pid=>S.cotizaciones.filter(q=>q.proyecto===pid);
const folioRev=q=>q.folio+(q.rev?' r'+q.rev:'');
const bitaDe=n=>S.bitacora.filter(b=>b.cuenta===n).sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
const abiertas=n=>tareasDe(n).filter(t=>!t.hecha);
function proxTarea(n){ return abiertas(n).slice().sort((a,b)=>(a.fecha||'9999').localeCompare(b.fecha||'9999'))[0]||null; }
function probEf(q){return q.probManual&&q.prob!==null&&q.prob!==undefined?q.prob:(P_MODELO[q.estado]??0);}
function decay(q){const d=dias(q.validez);if(d===null)return .6;if(d>=0)return 1;return Math.max(.25,1+d/30);}
const ponderado=q=>(q.neto||0)*probEf(q);
const ponderadoAj=q=>(q.neto||0)*probEf(q)*decay(q);
function netoLineas(q){ return (q.lineas||[]).reduce((a,l)=>a+(Number(l.kg)||0)*(Number(l.precioKg)||0)+(Number(l.monto)||0),0); }
function recalcNeto(q){ if(q.lineas&&q.lineas.length){ q.neto=Math.round(netoLineas(q)); q.kg=Math.round((q.lineas.reduce((a,l)=>a+(Number(l.kg)||0),0)))||null; } }
function sinContacto(c){const a=pd(c.ultMio),b=pd(c.ultSuyo);const m=[a,b].filter(Boolean).sort((x,y)=>y-x)[0];return m?Math.round((HOY-m)/864e5):null;}
function urgencia(c){
  const t=proxTarea(c.nombre), da=t?dias(t.fecha):null;
  const qs=cotsDe(c.nombre).filter(VIVA);
  const venc=qs.some(q=>{const d=dias(q.validez);return d!==null&&d<0;});
  const pronto=qs.some(q=>{const d=dias(q.validez);return d!==null&&d>=0&&d<=7;});
  if((da!==null&&da<0)||venc)return 3;
  if((da!==null&&da===0)||pronto)return 2;
  if(qs.length||['CLIENTE ACTIVO','EN NEGOCIACIÓN'].includes(c.canal))return 1;
  return 0;
}
function totales(){
  const vivas=S.cotizaciones.filter(VIVA);
  const neto=vivas.reduce((a,q)=>a+(q.neto||0),0);
  const pond=vivas.reduce((a,q)=>a+ponderado(q),0);
  const aj=vivas.reduce((a,q)=>a+ponderadoAj(q),0);
  const gan=S.cotizaciones.filter(q=>q.estado==='Adjudicada').reduce((a,q)=>a+(q.neto||0),0);
  const perd=S.cotizaciones.filter(q=>q.estado==='Perdida').reduce((a,q)=>a+(q.neto||0),0);
  const nG=S.cotizaciones.filter(q=>q.estado==='Adjudicada').length,nP=S.cotizaciones.filter(q=>q.estado==='Perdida').length;
  return {vivas,neto,pond,aj,gan,perd,nG,nP,tasa:(nG+nP)?nG/(nG+nP):null};
}
const activas=()=>S.cuentas.filter(c=>!c.archivada);

/* migración v1 → v2 */
function migrar(st){
  st.version=3;
  st.tareas=st.tareas||[];
  st.proyectos=st.proyectos||[];
  st.cuentas=st.cuentas||[];
  st.cuentas.forEach(c=>{
    if(!c.cid)c.cid=uid();
    if(c.archivada===undefined)c.archivada=false;
    if(c.accion){ st.tareas.push({id:uid(),cuenta:c.nombre,texto:c.accion,tipo:'mio',fecha:c.fechaAccion||iso(HOY),hecha:false,creada:iso(HOY)});
      delete c.accion; delete c.fechaAccion; }
  });
  (st.cotizaciones||[]).forEach(q=>{ if(!q.qid)q.qid=uid(); if(!q.lineas)q.lineas=[];
    if(q.probManual===undefined)q.probManual=(q.prob!==null&&q.prob!==undefined);
    if(q.cierre===undefined)q.cierre=''; if(q.motivoPerdida===undefined)q.motivoPerdida=''; if(q.kg===undefined)q.kg=null; });
  (st.contactos||[]).forEach(p=>{ if(!p.pid)p.pid=uid(); });
  /* cada cotización cuelga de un proyecto; si no lo tiene, se deriva del campo Obra */
  (st.cotizaciones||[]).forEach(q=>{
    if(q.rev===undefined)q.rev=0;
    if(!q.versiones)q.versiones=[];
    if(q.proyecto&&st.proyectos.some(p=>p.pid===q.proyecto))return;
    const nom=(q.obra||'Obra sin definir').trim();
    let p=st.proyectos.find(x=>x.cuenta===q.cuenta&&norm(x.nombre)===norm(nom));
    if(!p){ p={pid:uid(),cuenta:q.cuenta,nombre:nom,comuna:'',direccion:'',mandante:'',
      estado:'Activo',inicio:'',notas:''}; st.proyectos.push(p); }
    q.proyecto=p.pid;
  });
  (st.bitacora||[]).forEach(b=>{ if(!b.id)b.id=uid(); });
  return st;
}

/* ============ diálogos ============ */
function toast(t,accion){ document.querySelectorAll('.toast').forEach(n=>n.remove());
  const n=el('div',{class:'toast'},t, accion?el('button',{onclick:()=>{n.remove();accion[1]();}},accion[0]):null);
  document.body.append(n); setTimeout(()=>n.remove(),4000); }
function ask(titulo,campos,textoOk){
  return new Promise(res=>{
    const cerrar=v=>{sc.remove();mo.remove();res(v);};
    const sc=el('div',{class:'scrim',style:'z-index:70',onclick:()=>cerrar(null)});
    const mo=el('div',{class:'modal',role:'dialog','aria-modal':'true'});
    mo.append(el('h3',{},titulo));
    const inputs={};
    campos.forEach(f=>{ let i;
      if(f.type==='select'){i=el('select',{});(f.options||[]).forEach(o=>i.append(el('option',{value:o,selected:o===f.value?'':null},o)));}
      else if(f.type==='textarea'){i=el('textarea',{rows:'3'});i.value=f.value||'';}
      else {i=el('input',{type:f.type||'text'});i.value=f.value??'';if(f.ph)i.placeholder=f.ph;}
      inputs[f.k]=i; mo.append(el('label',{},f.label,i)); });
    const ok=()=>{const o={};campos.forEach(f=>o[f.k]=inputs[f.k].value);cerrar(o);};
    mo.append(el('div',{class:'mact'},el('button',{class:'mini',onclick:()=>cerrar(null)},'Cancelar'),
      el('button',{class:'mini k',onclick:ok},textoOk||'Guardar')));
    mo.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();ok();}if(e.key==='Escape')cerrar(null);});
    document.body.append(sc,mo);
    const f0=Object.values(inputs)[0]; if(f0){f0.focus();if(f0.select)f0.select();}
  });
}
const confirmar=async(t,ok)=>(await ask(t,[],ok||'Sí, continuar'))!==null;

/* ============ edición en línea ============ */
function edit(obj,campo,o={}){
  const v=obj[campo];
  const disp=o.fmt?o.fmt(v):(v===''||v===null||v===undefined?'':String(v));
  const sp=el('span',{class:'ed'+(disp===''?' empty':'')+(o.blk?' blk':''),tabindex:'0',title:o.title||'clic para editar'},disp);
  const start=()=>{
    let inp;
    if(o.options){ inp=el('select',{class:'inline'}); (o.blank?['',...o.options]:o.options).forEach(x=>inp.append(el('option',{value:x,selected:x===v?'':null},x||'—'))); }
    else if(o.multiline){ inp=el('textarea',{class:'inline'}); inp.value=v??''; }
    else inp=el('input',{class:'inline',type:o.type||'text',value:v===null||v===undefined?'':v});
    sp.replaceWith(inp); inp.focus(); if(inp.select&&!o.multiline)inp.select();
    let cerrado=false;
    const commit=()=>{ if(cerrado)return; cerrado=true;
      let nv=inp.value;
      if(o.type==='number')nv=nv===''?null:Number(String(nv).replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''));
      if(o.num01)nv=nv===''?null:Math.min(1,Math.max(0,Number(nv)));
      if(String(nv)!==String(v===null||v===undefined?'':v)){ snap(o.desc||('editar '+campo)); obj[campo]=nv; if(o.after)o.after(nv,v); save(); }
      render(); };
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!o.multiline){e.preventDefault();inp.blur();}
      if(e.key==='Enter'&&o.multiline&&(e.ctrlKey||e.metaKey)){e.preventDefault();inp.blur();}
      if(e.key==='Escape'){cerrado=true;render();}});
    if(o.options)inp.addEventListener('change',()=>inp.blur());
  };
  sp.addEventListener('click',start);
  sp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();start();}});
  return sp;
}

/* ============ acciones de negocio ============ */
function logB(cn,tipo,texto,ts){ S.bitacora.unshift({id:uid(),cuenta:cn,ts:ts||iso(HOY),tipo,texto}); }

function registrarContacto(c,quien){
  mut('registrar contacto',()=>{
    const h=iso(HOY);
    if(quien==='mio'){c.ultMio=h;c.hablo='Benjamín';}else{c.ultSuyo=h;c.hablo='cliente';}
    if(['NUNCA CONTACTADO','SIN DATOS DE CONTACTO'].includes(c.canal))c.canal='CONTACTADO SIN RESPUESTA';
    if(quien==='suyo'&&c.canal==='CONTACTADO SIN RESPUESTA')c.canal='EN NEGOCIACIÓN';
    logB(c.nombre,'contacto',quien==='mio'?'Le escribí o llamé.':'Me respondió.');
  });
  toast('Contacto registrado en '+c.nombre);
}
function nuevaTarea(cn,texto,fecha,tipo,folio){
  const t={id:uid(),cuenta:cn,texto,tipo:tipo||'mio',fecha:fecha||iso(HOY),hecha:false,creada:iso(HOY),folio:folio||''};
  S.tareas.push(t); return t;
}
function toggleTarea(t){
  mut(t.hecha?'reabrir tarea':'cerrar tarea',()=>{
    t.hecha=!t.hecha; t.hechaTs=t.hecha?iso(HOY):'';
    if(t.hecha)logB(t.cuenta,'tarea','Hecho: '+t.texto);
  });
}
async function cerrarYAgendar(t){
  const r=await ask('Cerrar y agendar el siguiente paso',[
    {k:'res',label:'Qué pasó',type:'textarea',value:'Hecho: '+t.texto},
    {k:'sig',label:'Próximo paso (deja vacío si no hay)',ph:'ej. llamar para confirmar la OC'},
    {k:'tipo',label:'Tipo',type:'select',options:['mio','esperando'],value:'mio'},
    {k:'f',label:'Para cuándo',type:'date',value:iso(new Date(HOY.getTime()+2*864e5))}],'Cerrar');
  if(!r)return;
  mut('cerrar tarea',()=>{ t.hecha=true; t.hechaTs=iso(HOY); logB(t.cuenta,'tarea',r.res||('Hecho: '+t.texto));
    if(r.sig.trim())nuevaTarea(t.cuenta,r.sig.trim(),r.f,r.tipo,t.folio); });
  toast('Cerrada');
}
async function marcarPerdida(q){
  const r=await ask('Cerrar '+q.folio+' como perdida',[
    {k:'m',label:'Motivo',type:'select',options:MOTIVOS,value:'Precio'},
    {k:'d',label:'Detalle: quién ganó, a qué precio, qué faltó',type:'textarea'}],'Marcar perdida');
  if(!r)return;
  mut('marcar perdida',()=>{ q.estado='Perdida'; q.motivoPerdida=r.m+(r.d?' — '+r.d:''); q.probManual=false;
    logB(q.cuenta,'cotizacion','['+q.folio+'] PERDIDA. '+q.motivoPerdida); });
  toast(q.folio+' cerrada como perdida');
}
function siguienteFolio(){
  const ns=S.cotizaciones.map(q=>{const m=String(q.folio).match(/(\d+)\s*$/);return m?+m[1]:0;});
  const max=Math.max(0,...ns); const base=S.cotizaciones[0]?String(S.cotizaciones[0].folio).replace(/\d+\s*$/,''):'BB2026-';
  return base+String(max+1).padStart(3,'0');
}
async function reemitir(q){
  const r=await ask('Reemitir '+q.folio,[
    {k:'folio',label:'Folio nuevo',value:siguienteFolio()},
    {k:'val',label:'Nueva validez',type:'date',value:iso(new Date(HOY.getTime()+15*864e5))},
    {k:'neto',label:'Neto',type:'number',value:q.neto||''}],'Crear');
  if(!r||!r.folio)return;
  mut('reemitir',()=>{
    const c2={...JSON.parse(JSON.stringify(q)),qid:uid(),folio:r.folio,fecha:iso(HOY),validez:r.val,
      neto:r.neto===''?0:Number(r.neto),estado:'Enviada',probManual:false,prob:null,oc:'',motivoPerdida:'',cierre:'',rev:0,versiones:[],nota:'Reemite '+q.folio+'.'};
    q.estado='Reemplazada'; q.probManual=false; S.cotizaciones.unshift(c2);
    logB(q.cuenta,'cotizacion','Reemitida '+q.folio+' → '+r.folio);
    nuevaTarea(q.cuenta,'Enviar '+r.folio+' al cliente',iso(HOY),'mio',r.folio);
  });
  toast('Creada '+r.folio+', con tarea de envío');
}
async function setEstadoCot(q,e){
  if(e===q.estado)return;
  if(e==='Perdida')return marcarPerdida(q);
  if(e==='Adjudicada'&&!q.oc){
    const r=await ask('Adjudicada — '+q.folio,[{k:'oc',label:'N° de orden de compra'},{k:'kg',label:'kg confirmados',type:'number',value:q.kg||''}],'Registrar');
    if(!r)return;
    mut('adjudicar',()=>{ q.oc=r.oc||''; if(r.kg!=='')q.kg=Number(r.kg); const p=q.estado; q.estado=e; q.probManual=false;
      logB(q.cuenta,'cotizacion','['+q.folio+'] '+p+' → Adjudicada. OC '+q.oc);
      nuevaTarea(q.cuenta,'Ingresar OC '+(q.oc||q.folio)+' a coordinación',iso(HOY),'mio',q.folio); });
    toast('Adjudicada, con tarea de ingreso'); return;
  }
  mut('cambiar etapa',()=>{const p=q.estado;q.estado=e;q.probManual=false;logB(q.cuenta,'cotizacion','['+q.folio+'] '+p+' → '+e);});
}

/* ---- crear / borrar ---- */
async function crearCuenta(){
  const r=await ask('Nueva cuenta',[
    {k:'nombre',label:'Razón social o nombre'},
    {k:'tipo',label:'Tipo',type:'select',options:TIPOS,value:'Constructora'},
    {k:'seg',label:'Segmento',type:'select',options:SEGS,value:'HAB'},

/* ============ importar / exportar ============ */
function celTxt(v){return v===null||v===undefined?'':String(v).trim();}
function celFecha(v){
  if(v&&typeof v.getTime==='function'&&!isNaN(v.getTime())){const d=new Date(v.getTime()-v.getTimezoneOffset()*6e4);return d.toISOString().slice(0,10);}
  if(typeof v==='number'&&v>20000&&v<80000&&typeof XLSX!=='undefined'){const p=XLSX.SSF.parse_date_code(v);
    if(p)return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0');}
  const t=celTxt(v); if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);
  const m=t.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  return '';
}
function celNum(v){if(v===null||v===undefined||v==='')return 0;const n=Number(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'));return isNaN(n)?0:n;}
function hdrRow(rows,claves){for(let i=0;i<Math.min(rows.length,20);i++){const r=(rows[i]||[]).map(x=>norm(celTxt(x)));
  if(claves.every(k=>r.some(c=>c===norm(k))))return i;}return -1;}
const colIdx=(h,...ns)=>{for(const n of ns){const i=h.findIndex(x=>norm(celTxt(x))===norm(n));if(i>=0)return i;}return -1;};

function importarLibro(buf){
  if(typeof XLSX==='undefined')throw new Error('No se pudo cargar el lector de Excel. Revisa la conexión y recarga.');
  const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
  const hoja=n=>{const k=Object.keys(wb.Sheets).find(x=>norm(x)===norm(n));return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,blankrows:true,defval:null}):null;};
  const CU=hoja('CUENTAS'),CO=hoja('COTIZACIONES'),CT=hoja('CONTACTOS'),TA=hoja('TAREAS'),PR=hoja('PROYECTOS'),LI=hoja('LINEAS');

    fechaAccion:g('Fecha próx. acción'),notas:g('Notas')};
  const cuentas=[],tareas=[],tareasDeColumna=[];
  for(let i=hc+1;i<CU.length;i++){const r=CU[i]||[];const nom=celTxt(r[m.nombre]);if(!nom)continue;
    cuentas.push({cid:uid(),id:celTxt(r[m.id]),nombre:nom,seg:celTxt(r[m.seg]),tipo:celTxt(r[m.tipo]),grupo:celTxt(r[m.grupo]),
      contacto:celTxt(r[m.contacto]),cargo:celTxt(r[m.cargo]),email:celTxt(r[m.email]),tel:celTxt(r[m.tel]),
      ultMio:celFecha(r[m.ultMio]),ultSuyo:celFecha(r[m.ultSuyo]),hablo:celTxt(r[m.hablo]),
      canal:celTxt(r[m.canal])||'NUNCA CONTACTADO',prio:celTxt(r[m.prio])||'C - Baja',notas:celTxt(r[m.notas]),archivada:false});
    const ac=m.accion>=0?celTxt(r[m.accion]):'';
    if(ac)tareasDeColumna.push({id:uid(),cuenta:nom,texto:ac,tipo:'mio',fecha:celFecha(r[m.fechaAccion])||iso(HOY),hecha:false,creada:iso(HOY)});}
  const hq=hdrRow(CO,['Folio','Cuenta']); if(hq<0)throw new Error('No encontré la fila de títulos en COTIZACIONES.');
  const Q=CO[hq],g2=(...n)=>colIdx(Q,...n);
  const mq={folio:g2('Folio'),fecha:g2('Fecha emisión'),cuenta:g2('Cuenta'),obra:g2('Obra / alcance','Obra'),
    contacto:g2('Contacto'),email:g2('Email'),producto:g2('Producto'),neto:g2('Total neto','Neto'),
    validez:g2('Validez hasta','Validez'),estado:g2('ESTADO','Estado'),prob:g2('Prob.','Prob'),oc:g2('N° OC','OC'),
    nota:g2('Qué falta / nota','Nota'),kg:g2('kg','Kilos'),cierre:g2('Cierre est.'),motivo:g2('Motivo pérdida'),
    proy:g2('Proyecto'),rev:g2('Rev')};
  const cots=[];
  for(let i=hq+1;i<CO.length;i++){const r=CO[i]||[];const f=celTxt(r[mq.folio]),cn=celTxt(r[mq.cuenta]);if(!f||!cn)continue;
    const p=mq.prob>=0?r[mq.prob]:null;
    cots.push({qid:uid(),folio:f,fecha:celFecha(r[mq.fecha]),cuenta:cn,obra:celTxt(r[mq.obra]),contacto:celTxt(r[mq.contacto]),
      email:celTxt(r[mq.email]),producto:celTxt(r[mq.producto]),neto:celNum(r[mq.neto]),validez:celFecha(r[mq.validez]),
      estado:celTxt(r[mq.estado])||'Enviada',prob:(p===null||p===undefined||p==='')?null:Number(p),
      probManual:!(p===null||p===undefined||p===''),oc:celTxt(r[mq.oc]),nota:celTxt(r[mq.nota]),
      kg:mq.kg>=0&&celNum(r[mq.kg])?celNum(r[mq.kg]):null,cierre:mq.cierre>=0?celFecha(r[mq.cierre]):'',
      motivoPerdida:mq.motivo>=0?celTxt(r[mq.motivo]):'',lineas:[],
      rev:mq.rev>=0?(celNum(r[mq.rev])||0):0,versiones:[],_proyNom:mq.proy>=0?celTxt(r[mq.proy]):''});}
  let contactos=[];
  if(CT){const hp=hdrRow(CT,['Nombre','Cuenta']);
    if(hp>=0){const P=CT[hp],g3=(...n)=>colIdx(P,...n);
      const mp={cuenta:g3('Cuenta'),nombre:g3('Nombre'),cargo:g3('Cargo / rol','Cargo'),email:g3('Email'),tel:g3('Teléfono'),rol:g3('Decide / influye','Rol'),nota:g3('Nota')};
      for(let i=hp+1;i<CT.length;i++){const r=CT[i]||[];if(!celTxt(r[mp.nombre]))continue;
        contactos.push({pid:uid(),cuenta:celTxt(r[mp.cuenta]),nombre:celTxt(r[mp.nombre]),cargo:celTxt(r[mp.cargo]),

  let hojaTareas=false;
  if(TA){const ht=hdrRow(TA,['Cuenta','Tarea']); if(ht>=0)hojaTareas=true;

  if(!hojaTareas)tareas.push(...tareasDeColumna);
  const proyectos=[];

    if(hp>=0){ const P=PR[hp],g5=(...n)=>colIdx(P,...n);
      const mp={cuenta:g5('Cuenta'),nombre:g5('Proyecto'),comuna:g5('Comuna'),direccion:g5('Dirección'),

          inicio:celFecha(r[mp.inicio]),notas:celTxt(r[mp.notas])});}}}
  cots.forEach(q=>{ if(!q._proyNom)return;

    if(p)q.proyecto=p.pid; delete q._proyNom; });
  if(LI){ const hl=hdrRow(LI,['Folio','Familia']);

      for(let i=hl+1;i<LI.length;i++){ const r=LI[i]||[]; const f=celTxt(r[ml.folio]); if(!f)continue;
        const q=cots.find(x=>x.folio===f&&(ml.cuenta<0||x.cuenta===celTxt(r[ml.cuenta])));
        if(!q)continue;
        q.lineas.push({id:uid(),familia:celTxt(r[ml.familia])||'Otro',producto:celTxt(r[ml.producto]),
          kg:celNum(r[ml.kg])||null,precioKg:celNum(r[ml.precioKg])||null,monto:celNum(r[ml.monto])||null}); } } }

  return migrar(st);
}
function xlsxBlob(){
  if(typeof XLSX==='undefined')return null;
  const wb=XLSX.utils.book_new();
  const hoja=(n,cols,filas)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([cols.map(c=>c[0]),...filas.map(f=>cols.map(c=>c[1](f)))]),n);
  hoja('CUENTAS',[['ID',c=>c.id],['Cuenta',c=>c.nombre],['Seg.',c=>c.seg],['Tipo',c=>c.tipo],['Grupo / holding',c=>c.grupo],
    ['Contacto principal',c=>c.contacto],['Cargo',c=>c.cargo],['Email',c=>c.email],['Teléfono',c=>c.tel],
    ['Último correo MÍO',c=>c.ultMio],['Último correo SUYO',c=>c.ultSuyo],['Días sin contacto',c=>sinContacto(c)],
    ['Habló último',c=>c.hablo],['ESTADO DEL CANAL',c=>c.canal],['Prioridad',c=>c.prio],
    ['Cotiz. vivas',c=>cotsDe(c.nombre).filter(VIVA).length],['Monto vivo (neto)',c=>cotsDe(c.nombre).filter(VIVA).reduce((a,q)=>a+(q.neto||0),0)],
    ['Próxima acción',c=>proxTarea(c.nombre)?.texto||''],['Fecha próx. acción',c=>proxTarea(c.nombre)?.fecha||''],
    ['Archivada',c=>c.archivada?'sí':''],['Notas',c=>c.notas]],S.cuentas);
  hoja('PROYECTOS',[['Cuenta',p=>p.cuenta],['Proyecto',p=>p.nombre],['Comuna',p=>p.comuna],['Dirección',p=>p.direccion],
    ['Mandante',p=>p.mandante],['Estado',p=>p.estado],['Inicio',p=>p.inicio],
    ['Cotizaciones',p=>cotsDeProy(p.pid).length],['Monto vivo',p=>cotsDeProy(p.pid).filter(VIVA).reduce((a,q)=>a+(q.neto||0),0)],
    ['Notas',p=>p.notas]],S.proyectos);
  hoja('COTIZACIONES',[['Folio',q=>q.folio],['Rev',q=>q.rev||0],['Proyecto',q=>proyecto(q.proyecto)?.nombre||''],

    ['Contacto',q=>q.contacto],['Email',q=>q.email],['Producto',q=>q.producto],['Total neto',q=>q.neto],['kg',q=>q.kg||''],
    ['$/kg',q=>q.kg?Math.round(q.neto/q.kg):''],['Validez hasta',q=>q.validez],['ESTADO',q=>q.estado],['Prob.',q=>probEf(q)],
    ['Ponderado',q=>Math.round(ponderadoAj(q))],['Cierre est.',q=>q.cierre],['N° OC',q=>q.oc],
    ['Motivo pérdida',q=>q.motivoPerdida],['Qué falta / nota',q=>q.nota]],S.cotizaciones);
  const lin=[]; S.cotizaciones.forEach(q=>(q.lineas||[]).forEach(l=>lin.push({...l,folio:q.folio,cuenta:q.cuenta})));
  hoja('LINEAS',[['Folio',l=>l.folio],['Cuenta',l=>l.cuenta],['Familia',l=>l.familia],['Descripción',l=>l.producto],
    ['kg',l=>l.kg||''],['$/kg',l=>l.precioKg||''],['Monto fijo',l=>l.monto||''],
    ['Total',l=>Math.round((Number(l.kg)||0)*(Number(l.precioKg)||0)+(Number(l.monto)||0))]],lin);
  const vers=[]; S.cotizaciones.forEach(q=>(q.versiones||[]).forEach(v=>vers.push({...v,folio:q.folio,cuenta:q.cuenta})));
  hoja('VERSIONES',[['Folio',v=>v.folio],['Rev',v=>v.rev],['Cuenta',v=>v.cuenta],['Guardada el',v=>v.ts],
    ['Neto',v=>v.neto],['kg',v=>v.kg||''],['Validez',v=>v.validez],['Etapa',v=>v.estado],
    ['Motivo del cambio',v=>v.motivo||'']],vers);
  hoja('CONTACTOS',[['Cuenta',c=>c.cuenta],['Nombre',c=>c.nombre],['Cargo / rol',c=>c.cargo],['Email',c=>c.email],
    ['Teléfono',c=>c.tel],['Decide / influye',c=>c.rol],['Nota',c=>c.nota]],S.contactos);
  hoja('TAREAS',[['Cuenta',t=>t.cuenta],['Tarea',t=>t.texto],['Tipo',t=>t.tipo],['Fecha',t=>t.fecha],
    ['Hecha',t=>t.hecha?'sí':''],['Cerrada el',t=>t.hechaTs||''],['Folio',t=>t.folio||'']],S.tareas);
  hoja('BITACORA',[['Fecha',b=>b.ts],['Cuenta',b=>b.cuenta],['Tipo',b=>b.tipo],['Registro',b=>b.texto]],S.bitacora);
  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ---- DASHBOARD ---- */
const NS='http://www.w3.org/2000/svg';
const sv=(t,a={},...k)=>{const n=document.createElementNS(NS,t);
  for(const[p,v]of Object.entries(a)){ if(p.startsWith('on'))n.addEventListener(p.slice(2),v); else if(v!==null&&v!==undefined)n.setAttribute(p,v); }
  k.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c))); return n;};
function panelC(titulo, sub, node, leyenda){
  const c=el('div',{class:'card'}, el('h3',{},titulo,
    sub? el('span',{style:'font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink3);font-family:var(--body)'},sub):null));
  const b=el('div',{class:'chart'}, node); if(leyenda) b.append(leyenda); c.append(b); return c;
}
function leg(...pares){ const d=el('div',{class:'legend'});
  pares.forEach(([col,txt])=>d.append(el('span',{}, el('i',{style:'background:'+col}), txt))); return d; }

function chEtapas(){

    return {e,n:qs.length,m:qs.reduce((a,q)=>a+(q.neto||0),0),p:qs.reduce((a,q)=>a+ponderadoAj(q),0)};});
  const max=Math.max(1,...data.map(d=>d.m)), W=700,rh=40,pad=118,rt=112,H=data.length*rh+6;
  const g=sv('svg',{viewBox:'0 0 '+W+' '+H});

    g.append(sv('text',{x:pad-9,y:y+14,'text-anchor':'end',class:'lbl'},d.e));

function chPareto(){
  const map={}; S.cotizaciones.filter(VIVA).forEach(q=>map[q.cuenta]=(map[q.cuenta]||0)+(q.neto||0));
  const arr=Object.entries(map).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const tot=arr.reduce((a,[,v])=>a+v,0)||1, max=arr[0]?arr[0][1]:1;
  const W=700,H=250,L=6,R=40,T=16,B=78, bw=(W-L-R)/Math.max(arr.length,1);
  const g=sv('svg',{viewBox:'0 0 '+W+' '+H});
  [0,.25,.5,.75,1].forEach(f=>{ const y=T+(H-T-B)*(1-f);
    g.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,class:'grid'}));
    g.append(sv('text',{x:W-R+5,y:y+3,class:'ax'},Math.round(f*100)+'%')); });
  let acc=0; const pts=[];
  arr.forEach(([n,v],i)=>{
    const x=L+i*bw, h=(H-T-B)*v/max, y=H-B-h;
    g.append(sv('rect',{x:x+bw*.16,y,width:bw*.68,height:Math.max(h,1),
      fill:i===0?'var(--oxido)':'var(--plano2)', onclick:()=>abrir(n), style:'cursor:pointer'},
      sv('title',{},n+' — '+money(v))));
    g.append(sv('text',{x:x+bw/2,y:y-5,'text-anchor':'middle',class:'val'},money(v)));
    acc+=v; pts.push([x+bw/2, T+(H-T-B)*(1-acc/tot)]);
    const t=sv('text',{x:0,y:0,'text-anchor':'end',class:'lbl2',transform:'translate('+(x+bw/2+3)+','+(H-B+8)+') rotate(-42)'},
      n.length>26?n.slice(0,25)+'…':n);
    g.append(t);
  });
  g.append(sv('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'var(--hivis)','stroke-width':2}));
  pts.forEach(p=>g.append(sv('circle',{cx:p[0],cy:p[1],r:3,fill:'var(--hivis)',stroke:'#fff','stroke-width':1.5})));
  const top1=arr[0]?Math.round(arr[0][1]/tot*100):0;
  const ceros=Object.entries(map).filter(([,v])=>!v).map(([n])=>n);
  return panelC('Concentración de la cartera',
    (arr[0]? top1+'% en '+arr[0][0] : '')+(ceros.length? ' · no aparece '+ceros.join(', ')+': oferta viva sin neto cargado':''),g,
    leg(['var(--oxido)','mayor exposición'],['var(--plano2)','resto de cuentas'],['var(--hivis)','acumulado']));
}

function chVigencias(){
  const qs=S.cotizaciones.filter(VIVA).map(q=>({q,d:dias(q.validez)})).sort((a,b)=>(a.d??999)-(b.d??999));
  const W=700,rh=19,L=150,R=52,H=qs.length*rh+30;
  const lo=Math.min(-30,...qs.map(x=>x.d??0)), hi=Math.max(30,...qs.map(x=>x.d??0));
  const X=d=>L+(W-L-R)*(d-lo)/(hi-lo||1);
  const g=sv('svg',{viewBox:'0 0 '+W+' '+H});
  [lo,Math.round(lo/2),0,Math.round(hi/2),hi].forEach(t=>{
    g.append(sv('line',{x1:X(t),x2:X(t),y1:16,y2:H-14,stroke:t===0?'var(--ink)':'var(--rule2)','stroke-width':t===0?1.5:1,'stroke-dasharray':t===0?'':'2 3'}));
    g.append(sv('text',{x:X(t),y:11,'text-anchor':'middle',class:'ax'},t===0?'HOY':(t>0?'+'+t:t)+'d'));});
  qs.forEach((x,i)=>{
    const y=22+i*rh+rh/2, d=x.d;

    g.append(sv('line',{x1:X(0),x2:X(d),y1:y,y2:y,stroke:col,'stroke-width':2}));

    g.append(sv('text',{x:X(d)+12,y:y+3,class:'val',fill:col},d<0?Math.abs(d)+'d tarde':d+'d'));
  });
  return panelC('Línea de vigencias','tamaño del punto = monto',g,

function chPrecio(){
  const qs=S.cotizaciones.filter(q=>q.kg&&q.neto).map(q=>({q,pk:q.neto/q.kg})).sort((a,b)=>a.pk-b.pk);
  const faltan=S.cotizaciones.filter(q=>VIVA(q)&&!q.kg).length;
  const W=700,H=Math.max(120,qs.length*24+52),L=150,R=70;
  const g=sv('svg',{viewBox:'0 0 '+W+' '+H});
  if(!qs.length){ g.append(sv('text',{x:12,y:30,class:'lbl2'},'Sin kilos cargados todavía.')); }
  else{
    const lo=Math.min(...qs.map(x=>x.pk))*.92, hi=Math.max(...qs.map(x=>x.pk))*1.06;
    const X=v=>L+(W-L-R)*(v-lo)/(hi-lo||1);
    [lo,(lo+hi)/2,hi].forEach(t=>{ g.append(sv('line',{x1:X(t),x2:X(t),y1:14,y2:H-22,class:'grid'}));
      g.append(sv('text',{x:X(t),y:10,'text-anchor':'middle',class:'ax'},'$'+Math.round(t).toLocaleString('es-CL'))); });
    qs.forEach((x,i)=>{
      const y=26+i*24;

      g.append(sv('line',{x1:L,x2:X(x.pk),y1:y,y2:y,stroke:'var(--rule2)','stroke-width':1}));
      g.append(sv('circle',{cx:X(x.pk),cy:y,r:6,fill:x.q.estado==='Adjudicada'?'var(--verde)':'var(--plano2)',stroke:'#fff','stroke-width':1.5},
        sv('title',{},x.q.cuenta+' — '+x.q.kg.toLocaleString('es-CL')+' kg')));
      g.append(sv('text',{x:X(x.pk)+11,y:y+4,class:'val'},'$'+Math.round(x.pk).toLocaleString('es-CL')));
    });
    g.append(sv('text',{x:L-8,y:H-8,'text-anchor':'end',class:'lbl2'},'$/kg implícito'));

  return panelC('Precio por kilo', faltan? faltan+' cotizaciones vivas todavía sin kilos':'',g,

function chCierre(){
  const qs=S.cotizaciones.filter(q=>VIVA(q)&&q.cierre);
  const sin=S.cotizaciones.filter(q=>VIVA(q)&&!q.cierre).length;
  const meses={};
  qs.forEach(q=>{const k=(q.cierre||'').slice(0,7);if(!k)return;if(!meses[k])meses[k]={m:0,p:0,n:0};
    meses[k].m+=q.neto||0;meses[k].p+=ponderadoAj(q);meses[k].n++;});
  const arr=Object.entries(meses).sort();
  const W=700,H=210,L=18,B=48,T=24,max=Math.max(1,...arr.map(x=>x[1].m));
  const g=sv('svg',{viewBox:'0 0 '+W+' '+H});
  if(!arr.length){
    g.append(sv('text',{x:12,y:40,class:'lbl2'},'Ninguna oferta viva tiene fecha estimada de cierre.'));
    g.append(sv('text',{x:12,y:58,class:'lbl2'},'Cárgala en la columna «Cierre est.» y este gráfico se arma solo.'));
  } else {
    const bw=(W-L*2)/arr.length;
    g.append(sv('line',{x1:L,x2:W-L,y1:H-B,y2:H-B,stroke:'var(--rule)'}));
    arr.forEach(([k,d],i)=>{
      const x=L+i*bw,h=(H-T-B)*d.m/max,hp=(H-T-B)*d.p/max;
      g.append(sv('rect',{x:x+bw*.2,y:H-B-h,width:bw*.6,height:Math.max(h,1),fill:'var(--plano-soft)',stroke:'var(--plano2)'}));
      g.append(sv('rect',{x:x+bw*.2,y:H-B-hp,width:bw*.6,height:Math.max(hp,1),fill:'var(--plano)'}));
      g.append(sv('text',{x:x+bw/2,y:H-B-h-7,'text-anchor':'middle',class:'val'},money(d.m)));
      const [yy,mm]=k.split('-');
      g.append(sv('text',{x:x+bw/2,y:H-B+15,'text-anchor':'middle',class:'lbl'},
        ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+mm-1]+' '+yy.slice(2)));
      g.append(sv('text',{x:x+bw/2,y:H-B+27,'text-anchor':'middle',class:'lbl2'},d.n+(d.n===1?' oferta':' ofertas')));
    });
  }
  return panelC('Cuándo cerraría', sin? sin+' ofertas vivas sin fecha de cierre':'por mes estimado de OC',g,

function filaTarea(t,conCuenta){
  const d=dias(t.fecha);
  const wrap=el('div',{class:'tsk'+(t.hecha?' done':'')});
  wrap.append(el('input',{type:'checkbox',class:'chk bx',checked:t.hecha?'':null,onchange:()=>toggleTarea(t)}));
  const b=el('div',{class:'tb'});
  b.append(el('div',{class:'tx'},edit(t,'texto',{blk:true,desc:'editar tarea'})));
  const mt=el('div',{class:'mt'});
  mt.append(edit(t,'fecha',{type:'date',fmt:s=>s?fdate(s):'sin fecha'}));
  if(!t.hecha&&d!==null)mt.append(el('span',{class:'pill '+(d<0?'p-red':d===0?'p-yel':'p-gry')},d<0?Math.abs(d)+'d tarde':d===0?'hoy':d===1?'mañana':d+'d'));
  mt.append(edit(t,'tipo',{options:['mio','esperando'],fmt:x=>x==='esperando'?'esperando a ellos':'mío'}));
  if(conCuenta)mt.append(el('button',{class:'linkish',style:'font-size:11.5px',onclick:()=>abrir(t.cuenta,'tareas')},t.cuenta));
  if(t.folio)mt.append(el('span',{class:'pill p-blu'},t.folio));

  wrap.append(b,el('div',{class:'acts'},
    t.hecha?null:el('button',{class:'mini k',onclick:()=>cerrarYAgendar(t)},'Cerrar y agendar'),
    t.hecha?null:el('button',{class:'mini',onclick:()=>mut('posponer',()=>{t.fecha=iso(new Date(Math.max((pd(t.fecha)||HOY).getTime(),HOY.getTime())+7*864e5));})},'+7d'),
    el('button',{class:'mini dgr',onclick:()=>borrar('tarea',t)},'×')));
  return wrap;
}
function barraNuevaTarea(cn){

function abrirCotizador(ctx){ COT_CTX=ctx||null; COT_READY=false; UI.tab='cotizador'; UI.open=null; render(); }

    el('span',{class:'sp'}),

    el('button',{class:'mini',onclick:()=>{COT_CTX=null;render();}},'Empezar en blanco')));
  const marco=el('iframe',{src:'cotizador.html',id:'cotFrame',
    style:'width:100%;height:78vh;border:1px solid var(--rule);border-radius:var(--r);background:#fff;margin-top:14px;display:block'});

window.addEventListener('message',ev=>{
  const m=ev.data; if(!m||typeof m!=='object'||!String(m.tipo||'').startsWith('acma-cot'))return;
  if(m.tipo==='acma-cot-listo'){
    COT_READY=true;
    const f=$('#cotFrame'); if(!f)return;
    const ctx=contextoCotizador();
    f.contentWindow.postMessage({tipo:'acma-cot-contexto',campos:ctx},'*');
    return;
  }
  if(m.tipo==='acma-cot-guardar'){ recibirCotizacion(m); return; }
});
function contextoCotizador(){
  if(!COT_CTX)return {};
  const c=cuenta(COT_CTX.cuenta), p=COT_CTX.proyecto?proyecto(COT_CTX.proyecto):null;
  const q=COT_CTX.qid?S.cotizaciones.find(x=>x.qid===COT_CTX.qid):null;
  const pr=contactosDe(COT_CTX.cuenta).find(x=>x.rol==='Decide')||contactosDe(COT_CTX.cuenta)[0];
  return {cliente:c?.nombre||'',contacto:(q?.contacto)||pr?.nombre||c?.contacto||'',
    obra:q?.obra||p?.nombre||'',comuna:p?.comuna||'',folio:q?q.folio:siguienteFolio(),
    rev:q?String((q.rev||0)+0):'0',
    e_correo:pr?.email||c?.email||'',fvalida:q?.validez||''};
}
function recibirCotizacion(m){
  const r=m.resumen||{};
  const cn=cuenta(r.cliente)?r.cliente:(COT_CTX?.cuenta||r.cliente);
  let c=cuenta(cn);
  snap('cotización desde el cotizador');
  if(!c){ const ids=S.cuentas.map(x=>+String(x.id).replace(/\D/g,'')||0);
    c={cid:uid(),id:'C'+String(Math.max(0,...ids)+1).padStart(2,'0'),nombre:cn||'Cliente sin nombre',seg:'',tipo:'Constructora',
      grupo:'',contacto:r.contacto||'',cargo:'',email:'',tel:'',ultMio:'',ultSuyo:'',hablo:'nadie',
      canal:'EN NEGOCIACIÓN',prio:'B - Media',notas:'',archivada:false};
    S.cuentas.push(c); }
  const nomProy=(COT_CTX?.proyecto&&proyecto(COT_CTX.proyecto)?.nombre)||r.obra||'Obra sin definir';
  let p=S.proyectos.find(x=>x.cuenta===c.nombre&&norm(x.nombre)===norm(nomProy));
  if(!p){ p={pid:uid(),cuenta:c.nombre,nombre:nomProy,comuna:r.comuna||'',direccion:'',mandante:'',
    estado:'Activo',inicio:'',notas:''}; S.proyectos.push(p); }
  else if(!p.comuna&&r.comuna)p.comuna=r.comuna;
  const lineas=(m.lineas||[]).map(l=>({id:uid(),familia:l.familia||'Otro',producto:l.producto||'',
    kg:l.kg||null,precioKg:l.precioKg||null,monto:l.monto||null}));
  /* El neto que manda el cotizador es el que vio el cliente: manda ese.
     Si las líneas no lo suman, se agrega una línea explícita con la diferencia
     en vez de dejar dos cifras distintas conviviendo en silencio. */
  const netoCot=Math.round(Number(r.neto)||0);
  const sumaLin=Math.round(lineas.reduce((a,l)=>a+(Number(l.kg)||0)*(Number(l.precioKg)||0)+(Number(l.monto)||0),0));
  let desajuste=0;
  if(lineas.length&&netoCot&&Math.abs(netoCot-sumaLin)>Math.max(1000,netoCot*0.005)){
    desajuste=netoCot-sumaLin;
    lineas.push({id:uid(),familia:'Otro',producto:desajuste>0?'Diferencia con el total del cotizador':'Descuento o ajuste',
      kg:null,precioKg:null,monto:desajuste});
  }
  let q=S.cotizaciones.find(x=>x.folio===r.folio&&x.cuenta===c.nombre);
  const rev=Number(r.rev||0);
  if(q){
    if(rev>(q.rev||0)){ q.versiones=q.versiones||[];
      q.versiones.unshift({rev:q.rev||0,ts:iso(HOY),fecha:q.fecha,neto:q.neto,kg:q.kg,validez:q.validez,
        estado:q.estado,lineas:JSON.parse(JSON.stringify(q.lineas||[])),nota:q.nota,motivo:'reemplazada por r'+rev+' del cotizador'}); }
    q.rev=rev; q.neto=r.neto||0; q.kg=r.kg||null; q.validez=r.fvalida||q.validez; q.obra=r.obra||q.obra;
    q.contacto=r.contacto||q.contacto; q.lineas=lineas; q.proyecto=p.pid;
    if(q.estado==='Por enviar')q.estado='Enviada';
    logB(c.nombre,'cotizacion','['+q.folio+' r'+rev+'] actualizada desde el cotizador: '+money(q.neto)+(q.kg?' · '+num(q.kg)+' kg':''));
  }else{
    q={qid:uid(),folio:r.folio||siguienteFolio(),rev,versiones:[],fecha:r.femision||iso(HOY),cuenta:c.nombre,
      proyecto:p.pid,obra:r.obra||p.nombre,contacto:r.contacto||'',email:'',producto:'',neto:r.neto||0,kg:r.kg||null,
      validez:r.fvalida||'',estado:'Enviada',prob:null,probManual:false,oc:'',nota:r.glosa||'',cierre:'',
      motivoPerdida:'',lineas};
    S.cotizaciones.unshift(q);
    logB(c.nombre,'cotizacion','['+q.folio+' r'+rev+'] creada desde el cotizador: '+money(q.neto));
    nuevaTarea(c.nombre,'Confirmar recepción de '+q.folio,iso(new Date(HOY.getTime()+3*864e5)),'esperando',q.folio);
  }
  if(desajuste)logB(c.nombre,'cotizacion','['+q.folio+'] las líneas no sumaban el total: se agregó una línea de ajuste por '+money(desajuste)+'. Revisa el desglose.');
  guardarSnapshotCot(q,m.snapshot);
  save(); render();
  toast(q.folio+' r'+rev+' registrada en '+c.nombre+' · '+lineas.length+' líneas',['Ver',()=>{UI.openProy=p.pid;UI.openCot=q.qid;abrir(c.nombre,'proy');}]);
}
async function guardarSnapshotCot(q,snapshot){
  if(!DIR||!snapshot)return;
  try{ const sub=await DIR.getDirectoryHandle('cotizaciones',{create:true});
    const fh=await sub.getFileHandle(String(q.folio).replace(/[^\w\-]/g,'_')+'_r'+(q.rev||0)+'.json',{create:true});
    const w=await fh.createWritable(); await w.write(new Blob([JSON.stringify(snapshot)],{type:'application/json'})); await w.close();
  }catch(e){}
}

VIEWS.salud=function(v){
  const C=checks(),tot=C.reduce((a,c)=>a+c.items.length,0);
  const altas=C.filter(c=>c.sev==='alta'&&c.items.length).length;
  const campos=activas().length*8+S.cotizaciones.length*8;
  const score=Math.max(0,Math.round(100-tot/Math.max(campos,1)*100*3));
  v.append(el('div',{class:'kpis'},
    kpi('Índice de completitud',score+'%',tot+' reglas incumplidas',score>80?'good':score>60?'warn':'bad'),
    kpi('Hallazgos graves',String(altas),'bloquean el pronóstico',altas?'bad':'good'),
    kpi('Cuentas',String(activas().length),activas().filter(c=>!c.email).length+' sin correo'),
    kpi('Cotizaciones',String(S.cotizaciones.length),S.cotizaciones.filter(VIVA).length+' vivas')));
  const card=el('div',{class:'card sec'},el('h3',{},'Qué está roto y por qué importa'));
  C.forEach(c=>{
    if(!c.items.length)return;
    const cl=el('div',{class:'cl'});
    c.items.slice(0,14).forEach(tx=>{
      const nom=tx.split(' · ').pop().split(' (')[0];
      const ct=S.cuentas.find(x=>x.nombre===nom)||S.cotizaciones.find(x=>tx.startsWith(x.folio));
      const dest=ct?(ct.nombre||ct.cuenta):null;
      cl.append(dest?el('button',{onclick:()=>abrir(dest)},tx):el('span',{},tx+'  '));
    });
    if(c.items.length>14)cl.append(el('span',{},'  +'+(c.items.length-14)+' más'));
    card.append(el('div',{class:'check'},el('span',{class:'sev '+c.sev},c.sev.toUpperCase()),
      el('div',{class:'cb'},el('div',{class:'ct'},c.t+' — '+c.items.length),el('div',{class:'cw'},c.w),cl)));
  });
  const ok=C.filter(c=>!c.items.length);
  if(ok.length)card.append(el('div',{class:'check'},el('span',{class:'sev baja'},'OK'),
    el('div',{class:'cb'},el('div',{class:'ct'},'Sin hallazgos en: '+ok.map(o=>o.t.toLowerCase()).join(', ')))));
  v.append(card);
};

      el('button',{class:'mini dgr',onclick:()=>borrar('nota',e)},'×')),

  if(!bitaDe(c.nombre).length)tl.append(el('div',{class:'empty'},'Sin registros.'));
  s.append(tl); b.append(s);
}

/* ============ búsqueda y paleta ============ */
function buscar(txt){
  const v=$('#view'); v.innerHTML='';
  const n=norm(txt);
  const cs=S.cuentas.filter(c=>norm([c.id,c.nombre,c.contacto,c.email,c.tel,c.grupo,c.canal,c.notas].join(' ')).includes(n));
  const qs=S.cotizaciones.filter(q=>norm([q.folio,q.cuenta,q.obra,q.contacto,q.producto,q.oc,q.nota].join(' ')).includes(n));
  const ps=S.contactos.filter(p=>norm([p.nombre,p.cuenta,p.email,p.tel,p.cargo,p.nota].join(' ')).includes(n));
  const ts=S.tareas.filter(t=>norm([t.texto,t.cuenta].join(' ')).includes(n));
  v.append(el('div',{class:'card sec'},el('h3',{},'Resultados para "'+txt+'"',
    el('span',{class:'n'},cs.length+' cuentas · '+qs.length+' cotizaciones · '+ps.length+' personas · '+ts.length+' tareas'))));
  const mk=(t,arr,fn)=>{if(!arr.length)return;const c=el('div',{class:'card sec'},el('h3',{},t,el('span',{class:'n'},String(arr.length))));arr.forEach(x=>c.append(fn(x)));v.append(c);};
  mk('Cuentas',cs,c=>el('div',{class:'row'},el('div',{class:'main'},
    el('div',{class:'t'},el('button',{class:'linkish',onclick:()=>abrir(c.nombre)},c.nombre)),
    el('div',{class:'d'},[c.contacto,c.email,c.tel,c.canal].filter(Boolean).join(' · ')))));
  mk('Cotizaciones',qs,q=>el('div',{class:'row'},el('div',{class:'main'},
    el('div',{class:'t'},el('button',{class:'linkish',onclick:()=>abrir(q.cuenta,'proy')},q.folio+' · '+q.cuenta+' · '+money(q.neto))),
    el('div',{class:'d'},q.obra+' · '+q.estado+' · validez '+fdate(q.validez)))));
  mk('Personas',ps,p=>el('div',{class:'row'},el('div',{class:'main'},
    el('div',{class:'t'},el('button',{class:'linkish',onclick:()=>abrir(p.cuenta,'gente')},p.nombre+' — '+p.cuenta)),
    el('div',{class:'d'},[p.cargo,p.email,p.tel,p.rol].filter(Boolean).join(' · ')))));
  mk('Tareas',ts.slice(0,20),t=>filaTarea(t,true));
  if(!cs.length&&!qs.length&&!ps.length&&!ts.length)
    v.append(el('div',{class:'card sec'},el('div',{class:'empty'},'Nada calza con "'+txt+'".')));
}
function cmdk(){
  if(document.querySelector('.cmdk'))return;
  const cerrar=()=>{sc.remove();box.remove();};
  const sc=el('div',{class:'scrim',style:'z-index:74',onclick:cerrar});
  const box=el('div',{class:'cmdk'});
  const inp=el('input',{placeholder:'Ir a una cuenta, folio o persona…'});
  const res=el('div',{class:'res'});
  box.append(inp,res,el('div',{class:'ft'},'↑↓ moverse · Enter abrir · Esc cerrar'));
  let items=[],sel=0;
  const pinta=()=>{
    const n=norm(inp.value);
    items=[];
    if(n){
      S.cuentas.filter(c=>norm(c.nombre+c.contacto+c.id).includes(n)).slice(0,7)
        .forEach(c=>items.push({k:'cuenta',n:c.nombre,s:[c.canal,c.prio].join(' · '),go:()=>abrir(c.nombre)}));
      S.cotizaciones.filter(q=>norm(q.folio+q.cuenta+q.obra).includes(n)).slice(0,6)
        .forEach(q=>items.push({k:'cotiz',n:q.folio+' · '+money(q.neto),s:q.cuenta+' — '+q.obra,go:()=>abrir(q.cuenta,'proy')}));
      S.contactos.filter(p=>norm(p.nombre+p.cuenta).includes(n)).slice(0,5)
        .forEach(p=>items.push({k:'persona',n:p.nombre,s:p.cuenta+(p.cargo?' — '+p.cargo:''),go:()=>abrir(p.cuenta,'gente')}));
    }else{
      items=[{k:'acción',n:'Nueva cuenta',s:'crear una cuenta desde cero',go:crearCuenta},
        {k:'acción',n:'Nueva cotización',s:'crear una oferta',go:()=>crearCotizacion()},
        {k:'acción',n:'Nueva persona',s:'agregar un contacto',go:()=>crearContacto()},
        {k:'acción',n:'Descargar respaldo en Excel',s:'copia manual',go:descargarRespaldo},
        ...TABS.map(([k,l])=>({k:'ir a',n:l,s:'',go:()=>{UI.tab=k;render();}}))];
    }
    sel=0; dibuja();
  };
  const dibuja=()=>{
    res.innerHTML='';
    items.forEach((it,i)=>res.append(el('div',{class:'it','aria-selected':i===sel?'true':'false',
      onclick:()=>{cerrar();it.go();}},el('span',{class:'k'},it.k),
      el('span',{},el('span',{class:'n'},it.n),it.s?el('div',{class:'s'},it.s):null))));
    if(!items.length)res.append(el('div',{class:'empty'},'Sin resultados.'));
  };
  inp.addEventListener('input',pinta);
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,items.length-1);dibuja();}
    if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);dibuja();}
    if(e.key==='Enter'&&items[sel]){e.preventDefault();cerrar();items[sel].go();}
    if(e.key==='Escape')cerrar();
  });
  document.body.append(sc,box); pinta(); inp.focus();
}

/* ============ portón ============ */
function gcard(t,tx,...bs){
  return el('div',{class:'card',style:'max-width:640px;margin:40px auto'},el('h3',{},t),
    el('div',{style:'padding:16px 18px 18px'},
      el('p',{style:'margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--ink2)'},tx),
      el('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},...bs)));
}
function vGate(v){
  if(!soporta()){
    v.append(gcard('Este navegador no sirve para esta versión',
      'El panel guarda directo en tu carpeta de OneDrive y eso solo funciona en Microsoft Edge o Google Chrome de escritorio.',
      el('button',{class:'mini k',onclick:()=>navigator.clipboard?.writeText(location.href).then(()=>toast('Dirección copiada'))},'Copiar la dirección')));
    return;
  }
  if(PEND){
    v.append(gcard('Reconectar la carpeta "'+PEND.name+'"',
      'Por seguridad el navegador te vuelve a pedir permiso cada tanto. Un clic y sigues donde estabas.',
      el('button',{class:'mini k',onclick:async()=>{if(await permiso(PEND,true)){DIR=PEND;PEND=null;
        const t=await leerTexto(F_JSON);if(t){try{S=migrar(JSON.parse(t));}catch(e){}}render();}else toast('No diste el permiso');}},'Dar permiso'),
      el('button',{class:'mini',onclick:async()=>{await delH();PEND=null;render();}},'Elegir otra carpeta')));
    return;
  }
  if(!DIR){
    v.append(gcard('Paso 1 · Conecta tu carpeta',
      'Elige la carpeta sincronizada de OneDrive donde quieres que se guarde todo. El panel escribe ahí cartera.json y respaldo_cartera.xlsx. Nada se sube a internet.',
      el('button',{class:'mini k',onclick:async()=>{if(await elegirCarpeta()){
        const t=await leerTexto(F_JSON);if(t){try{S=migrar(JSON.parse(t));toast('Cartera encontrada');}catch(e){}}render();}
        else toast('No se eligió ninguna carpeta');}},'Conectar carpeta')));
    return;
  }
  const zona=el('div',{class:'card',style:'max-width:640px;margin:40px auto'},
    el('h3',{},'Paso 2 · Carga tu Excel',el('span',{class:'n'},DIR.name)),
    el('div',{style:'padding:16px 18px 18px'},el('p',{style:'margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--ink2)'},
      'La carpeta está conectada pero no hay cartera. Arrastra aquí tu Excel o elígelo con el botón. Se hace una sola vez.')));
  const drop=el('div',{style:'border:2px dashed var(--rule);border-radius:4px;padding:34px 16px;text-align:center;color:var(--ink3);font-size:13px;background:var(--panel-2)'},'Suelta el archivo .xlsx aquí');
  const inp=el('input',{type:'file',accept:'.xlsx,.xlsm',style:'display:none'});
  const cargar=async file=>{ if(!file)return;
    try{ S=importarLibro(await file.arrayBuffer()); await guardarEnCarpeta(); render();
      toast(S.cuentas.length+' cuentas y '+S.cotizaciones.length+' cotizaciones cargadas'); }
    catch(e){ await ask('No pude leer el archivo',[{k:'x',label:'Detalle',type:'textarea',value:e.message}],'Entendido'); } };
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='var(--plano)';});
  drop.addEventListener('dragleave',()=>drop.style.borderColor='var(--rule)');
  drop.addEventListener('drop',e=>{e.preventDefault();drop.style.borderColor='var(--rule)';cargar(e.dataTransfer.files[0]);});
  inp.addEventListener('change',e=>cargar(e.target.files[0]));
  zona.lastChild.append(drop,el('div',{style:'display:flex;gap:8px;margin-top:12px;flex-wrap:wrap'},
    el('button',{class:'mini k',onclick:()=>inp.click()},'Elegir archivo'),inp,
    el('button',{class:'mini',onclick:async()=>{await delH();DIR=null;render();}},'Cambiar de carpeta'),
    el('button',{class:'mini',onclick:()=>{S={version:2,cuentas:[],cotizaciones:[],contactos:[],tareas:[],bitacora:[]};save();render();}},'Empezar en blanco')));
  v.append(zona);
}

/* ============ arranque ============ */
async function boot(){
  flag('');
  if(soporta()){
    const h=await getH();
    if(h){ if(await permiso(h,false)){ DIR=h; const t=await leerTexto(F_JSON);
        if(t){ try{ S=migrar(JSON.parse(t)); flag('carpeta '+h.name); }catch(e){} } } else PEND=h; }
  }
  render();
}
$('#q').addEventListener('input',e=>{UI.q=e.target.value;if(!S)return;if(UI.q.trim().length>=2)buscar(UI.q.trim());else render();});
$('#btnBackup').addEventListener('click',async()=>{await guardarEnCarpeta();toast('Guardado en la carpeta');});
$('#btnUndo').addEventListener('click',undo);
$('#btnFolder').addEventListener('click',async()=>{
  const r=await ask('Carpeta conectada: '+(DIR?DIR.name:'ninguna'),[],'Cambiar carpeta');
  if(r===null)return; if(await elegirCarpeta()){await guardarEnCarpeta();toast('Ahora se guarda en '+DIR.name);}});
$('#btnNuevo').addEventListener('click',async()=>{
  const r=await ask('¿Qué quieres crear?',[{k:'t',label:'Tipo',type:'select',options:['Cuenta','Cotización','Persona','Descargar respaldo Excel'],value:'Cuenta'}],'Seguir');
  if(!r)return;
  if(r.t==='Cuenta')crearCuenta(); else if(r.t==='Cotización')crearCotizacion();
  else if(r.t==='Persona')crearContacto(); else descargarRespaldo();});
document.addEventListener('keydown',e=>{
  const enCampo=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(S)cmdk();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!enCampo){e.preventDefault();if(S)undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(S)guardarEnCarpeta().then(()=>toast('Guardado'));return;}
  if(enCampo||!S)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();crearCuenta();}
  if(e.key==='/'){e.preventDefault();$('#q').focus();}
});
window.addEventListener('beforeunload',e=>{if(saveT){guardarEnCarpeta();}});
boot();

</script>
